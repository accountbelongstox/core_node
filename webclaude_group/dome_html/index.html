<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Stream</title>
<style>
:root {
  --bg: #1a1b26;
  --bg-panel: #24283b;
  --bg-block: #1f2335;
  --border: #3b4261;
  --text: #c0caf5;
  --text-dim: #565f89;
  --accent: #7aa2f7;
  --accent2: #bb9af7;
  --green: #9ece6a;
  --yellow: #e0af68;
  --red: #f7768e;
  --orange: #ff9e64;
  --cyan: #7dcfff;
  --thinking-bg: #1a1e30;
  --thinking-border: #3d59a1;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ────────────────────────────────────────────── */

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

header h1 {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
}

header .controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

header input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  width: 320px;
}

header input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 4px 14px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}

button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

button.danger { background: var(--red); }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: background 0.3s;
}

.status-dot.connected { background: var(--green); }
.status-dot.error { background: var(--red); }

/* ── Tabs ──────────────────────────────────────────────── */

.tab-bar {
  display: flex;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.tab {
  padding: 6px 18px;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  user-select: none;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Panels ────────────────────────────────────────────── */

.panels {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.panel {
  display: none;
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 12px 16px;
}

.panel.active { display: block; }

/* ── Stream panel ──────────────────────────────────────── */

.block {
  margin-bottom: 12px;
  border-radius: 6px;
  overflow: hidden;
}

.block-header {
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.block-content {
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.block.thinking {
  background: var(--thinking-bg);
  border: 1px solid var(--thinking-border);
}

.block.thinking .block-header {
  color: var(--accent2);
  background: rgba(187, 154, 247, 0.08);
}

.block.text {
  background: var(--bg-block);
  border: 1px solid var(--border);
}

.block.text .block-header {
  color: var(--green);
  background: rgba(158, 206, 106, 0.08);
}

.cursor-blink::after {
  content: '\2588';
  animation: blink 0.8s step-end infinite;
  color: var(--accent);
}

@keyframes blink {
  50% { opacity: 0; }
}

.system-info {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text-dim);
}

.system-info span { color: var(--cyan); }

.result-block {
  background: rgba(158, 206, 106, 0.06);
  border: 1px solid var(--green);
  border-radius: 6px;
  padding: 12px;
  margin-top: 12px;
}

.result-block h3 {
  font-size: 12px;
  color: var(--green);
  margin-bottom: 8px;
}

.result-block .result-text {
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.result-block .result-meta {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(158, 206, 106, 0.2);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.result-block .result-meta strong { color: var(--text); }

/* ── Events panel ──────────────────────────────────────── */

.event-entry {
  padding: 4px 0;
  font-size: 12px;
  border-bottom: 1px solid rgba(59, 66, 97, 0.4);
  display: flex;
  gap: 10px;
}

.event-entry .ev-time {
  color: var(--text-dim);
  flex-shrink: 0;
  width: 80px;
}

.event-entry .ev-type {
  font-weight: 600;
  flex-shrink: 0;
  width: 110px;
}

.event-entry .ev-detail {
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ev-type.welcome { color: var(--cyan); }
.ev-type.status { color: var(--yellow); }
.ev-type.system { color: var(--cyan); }
.ev-type.block_start { color: var(--accent2); }
.ev-type.delta { color: var(--text); }
.ev-type.block_stop { color: var(--accent2); }
.ev-type.usage { color: var(--orange); }
.ev-type.assistant { color: var(--green); }
.ev-type.result { color: var(--green); }
.ev-type.rate_limit { color: var(--yellow); }
.ev-type.error { color: var(--red); }
.ev-type.stderr { color: var(--red); }
.ev-type.message_stop { color: var(--text-dim); }

/* ── Raw panel ─────────────────────────────────────────── */

#raw-output {
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text-dim);
}

/* ── Stats bar ─────────────────────────────────────────── */

.stats-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 5px 16px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.stats-bar .stat-label { color: var(--text-dim); }
.stats-bar .stat-value { color: var(--text); margin-left: 4px; }
.stats-bar .stat-value.warning { color: var(--yellow); }
.stats-bar .stat-value.error { color: var(--red); }

/* ── Scrollbar ─────────────────────────────────────────── */

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<!-- Header -->
<header>
  <h1>Claude Code Stream</h1>
  <div class="controls">
    <div class="status-dot" id="statusDot" title="Disconnected"></div>
    <input type="text" id="wsUrl" placeholder="ws://host:port/ws/chat?key=..." value="">
    <button id="btnConnect" onclick="toggleConnection()">Connect</button>
    <button class="danger" id="btnClear" onclick="clearAll()">Clear</button>
  </div>
</header>

<!-- Tabs -->
<div class="tab-bar">
  <div class="tab active" data-panel="stream">Stream</div>
  <div class="tab" data-panel="events">Events</div>
  <div class="tab" data-panel="raw">Raw</div>
</div>

<!-- Panels -->
<div class="panels">
  <div class="panel active" id="panel-stream"></div>
  <div class="panel" id="panel-events"></div>
  <div class="panel" id="panel-raw"><pre id="raw-output"></pre></div>
</div>

<!-- Stats bar -->
<div class="stats-bar" id="statsBar">
  <span><span class="stat-label">Status:</span><span class="stat-value" id="statStatus">disconnected</span></span>
  <span><span class="stat-label">Input:</span><span class="stat-value" id="statInputTokens">0</span></span>
  <span><span class="stat-label">Output:</span><span class="stat-value" id="statOutputTokens">0</span></span>
  <span><span class="stat-label">Cache Read:</span><span class="stat-value" id="statCacheRead">0</span></span>
  <span><span class="stat-label">Cache Create:</span><span class="stat-value" id="statCacheCreate">0</span></span>
  <span><span class="stat-label">Cost:</span><span class="stat-value" id="statCost">$0.00</span></span>
  <span><span class="stat-label">Rate Limit:</span><span class="stat-value" id="statRateLimit">-</span></span>
  <span><span class="stat-label">Messages:</span><span class="stat-value" id="statMsgCount">0</span></span>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════

let ws = null;
let msgCount = 0;
let autoScroll = true;

// Currently active block being streamed
let activeBlock = null;   // { el, contentEl, type, index }

// Stats
const stats = {
  inputTokens: 0,
  outputTokens: 0,
  cacheRead: 0,
  cacheCreate: 0,
  costUsd: 0,
  rateLimit: null,
};

// DOM refs
const streamPanel  = document.getElementById('panel-stream');
const eventsPanel  = document.getElementById('panel-events');
const rawOutput    = document.getElementById('raw-output');
const statusDot    = document.getElementById('statusDot');
const btnConnect   = document.getElementById('btnConnect');
const wsUrlInput   = document.getElementById('wsUrl');

// ═══════════════════════════════════════════════════════════
//  Tabs
// ═══════════════════════════════════════════════════════════

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// ═══════════════════════════════════════════════════════════
//  WebSocket connection
// ═══════════════════════════════════════════════════════════

function toggleConnection() {
  if (ws && ws.readyState <= WebSocket.OPEN) {
    ws.close();
  } else {
    connect();
  }
}

function connect() {
  const url = wsUrlInput.value.trim();
  if (!url) {
    alert('Enter a WebSocket URL');
    return;
  }

  try {
    ws = new WebSocket(url);
  } catch (e) {
    setStatus('error', 'Invalid URL');
    return;
  }

  setStatus('connecting', 'connecting...');
  btnConnect.textContent = 'Disconnect';

  ws.onopen = () => {
    setStatus('connected', 'connected');
  };

  ws.onclose = (e) => {
    setStatus('disconnected', `disconnected (${e.code})`);
    btnConnect.textContent = 'Connect';
    ws = null;
  };

  ws.onerror = () => {
    setStatus('error', 'error');
  };

  ws.onmessage = (e) => {
    msgCount++;
    updateStat('statMsgCount', msgCount);

    let data;
    try {
      data = JSON.parse(e.data);
    } catch {
      appendRaw(e.data);
      return;
    }

    appendRaw(JSON.stringify(data, null, 2));
    handleMessage(data);
  };
}

// ═══════════════════════════════════════════════════════════
//  Message handler
// ═══════════════════════════════════════════════════════════

function handleMessage(msg) {
  const type = msg.type || '';

  switch (type) {
    case 'welcome':
      addEvent('welcome', `user=${msg.user || ''} level=${msg.level || ''}`);
      appendSystemInfo(`Welcome: ${msg.user || 'unknown'} (${msg.level || 'unknown'})`);
      break;

    case 'status':
      addEvent('status', msg.status || '');
      setStatus(
        msg.status === 'running' ? 'connected' : (msg.status === 'error' ? 'error' : 'connected'),
        msg.status || ''
      );
      if (msg.status === 'starting') {
        appendSystemInfo(
          `Starting: prompt="${(msg.prompt || '').substring(0, 120)}"` +
          (msg.username ? ` user=${msg.username}` : '') +
          (msg.project_dir ? ` dir=${msg.project_dir}` : '')
        );
      }
      break;

    case 'system':
      addEvent('system', `model=${msg.model || ''} session=${(msg.session_id || '').substring(0, 12)}`);
      appendSystemInfo(
        `Session: <span>${msg.session_id || ''}</span>` +
        ` | Model: <span>${msg.model || ''}</span>` +
        (msg.version ? ` | Version: <span>${msg.version}</span>` : '') +
        (msg.cwd ? ` | CWD: <span>${msg.cwd}</span>` : '') +
        (msg.permission_mode ? ` | Mode: <span>${msg.permission_mode}</span>` : '')
      );
      break;

    case 'block_start':
      addEvent('block_start', `${msg.block_type || ''} [${msg.index}]`);
      startBlock(msg.block_type || 'text', msg.index || 0);
      break;

    case 'delta':
      // Only log to events panel sparingly to avoid flooding
      if (msgCount % 20 === 0) {
        addEvent('delta', `${msg.delta_type || ''} +${(msg.text || '').length} chars`);
      }
      appendDelta(msg.text || '', msg.index);
      break;

    case 'block_stop':
      addEvent('block_stop', `[${msg.index}]`);
      stopBlock(msg.index);
      break;

    case 'usage':
      handleUsage(msg);
      addEvent('usage', `phase=${msg.phase} in=${msg.input_tokens || 0} out=${msg.output_tokens || 0}`);
      break;

    case 'assistant':
      addEvent('assistant', `${(msg.blocks || []).length} block(s)`);
      // The assistant message is a summary; blocks were already streamed.
      // We can use this for reconciliation if needed.
      break;

    case 'result':
      addEvent('result', `cost=$${(msg.cost_usd || 0).toFixed(4)} turns=${msg.num_turns || 0}`);
      handleResult(msg);
      break;

    case 'rate_limit':
      handleRateLimit(msg);
      addEvent('rate_limit', `${msg.rate_limit_type || ''} ${msg.status || ''}`);
      break;

    case 'error':
      addEvent('error', msg.message || 'unknown error');
      appendError(msg.message || 'Unknown error');
      break;

    case 'stderr':
      addEvent('stderr', (msg.text || '').substring(0, 100));
      appendStderr(msg.text || '');
      break;

    case 'message_stop':
      addEvent('message_stop', '');
      break;

    default:
      addEvent(type || 'unknown', JSON.stringify(msg).substring(0, 120));
      break;
  }
}

// ═══════════════════════════════════════════════════════════
//  Stream panel rendering
// ═══════════════════════════════════════════════════════════

function startBlock(blockType, index) {
  // Finish any previous active block
  if (activeBlock) {
    activeBlock.contentEl.classList.remove('cursor-blink');
  }

  const block = document.createElement('div');
  block.className = `block ${blockType}`;
  block.dataset.index = index;

  const header = document.createElement('div');
  header.className = 'block-header';
  header.textContent = blockType === 'thinking' ? 'Thinking' : 'Text';

  const content = document.createElement('div');
  content.className = 'block-content cursor-blink';

  block.appendChild(header);
  block.appendChild(content);
  streamPanel.appendChild(block);

  activeBlock = { el: block, contentEl: content, type: blockType, index: index };
  scrollToBottom(streamPanel);
}

function appendDelta(text, index) {
  if (!activeBlock) {
    // No active block yet; create a text block
    startBlock('text', index || 0);
  }
  activeBlock.contentEl.textContent += text;
  scrollToBottom(streamPanel);
}

function stopBlock(index) {
  if (activeBlock && activeBlock.index === index) {
    activeBlock.contentEl.classList.remove('cursor-blink');
    activeBlock = null;
  }
}

function appendSystemInfo(html) {
  const div = document.createElement('div');
  div.className = 'system-info';
  div.innerHTML = html;
  streamPanel.appendChild(div);
  scrollToBottom(streamPanel);
}

function appendError(message) {
  const div = document.createElement('div');
  div.className = 'system-info';
  div.style.borderColor = 'var(--red)';
  div.style.color = 'var(--red)';
  div.textContent = 'Error: ' + message;
  streamPanel.appendChild(div);
  scrollToBottom(streamPanel);
}

function appendStderr(text) {
  const div = document.createElement('div');
  div.className = 'system-info';
  div.style.borderColor = 'var(--orange)';
  div.style.color = 'var(--orange)';
  div.textContent = 'stderr: ' + text;
  streamPanel.appendChild(div);
  scrollToBottom(streamPanel);
}

function handleResult(msg) {
  const div = document.createElement('div');
  div.className = 'result-block';

  const title = document.createElement('h3');
  title.textContent = 'Result';

  const text = document.createElement('div');
  text.className = 'result-text';
  text.textContent = msg.text || '';

  const meta = document.createElement('div');
  meta.className = 'result-meta';

  const fields = [
    ['Cost', `$${(msg.cost_usd || 0).toFixed(4)}`],
    ['Duration', `${((msg.duration_ms || 0) / 1000).toFixed(1)}s`],
    ['API Duration', `${((msg.duration_api_ms || 0) / 1000).toFixed(1)}s`],
    ['Turns', msg.num_turns || 0],
    ['Stop Reason', msg.stop_reason || '-'],
  ];

  if (msg.model_usage) {
    const mu = msg.model_usage;
    fields.push(
      ['Model In', mu.input_tokens || 0],
      ['Model Out', mu.output_tokens || 0],
      ['Cache Read', mu.cache_read || 0],
      ['Cache Create', mu.cache_create || 0],
      ['Context Window', mu.context_window || 0],
      ['Max Output', mu.max_output || 0],
    );
    if (mu.web_search) fields.push(['Web Searches', mu.web_search]);
  }

  meta.innerHTML = fields
    .map(([label, val]) => `<span>${label}: <strong>${val}</strong></span>`)
    .join('');

  div.appendChild(title);
  div.appendChild(text);
  div.appendChild(meta);
  streamPanel.appendChild(div);

  // Update cost stat
  stats.costUsd = msg.cost_usd || stats.costUsd;
  updateStat('statCost', `$${stats.costUsd.toFixed(4)}`);

  scrollToBottom(streamPanel);
}

// ═══════════════════════════════════════════════════════════
//  Usage & rate limit
// ═══════════════════════════════════════════════════════════

function handleUsage(msg) {
  if (msg.input_tokens)  stats.inputTokens  = msg.input_tokens;
  if (msg.output_tokens) stats.outputTokens  = msg.output_tokens;
  if (msg.cache_read)    stats.cacheRead     = msg.cache_read;
  if (msg.cache_create)  stats.cacheCreate   = msg.cache_create;

  updateStat('statInputTokens',  stats.inputTokens.toLocaleString());
  updateStat('statOutputTokens', stats.outputTokens.toLocaleString());
  updateStat('statCacheRead',    stats.cacheRead.toLocaleString());
  updateStat('statCacheCreate',  stats.cacheCreate.toLocaleString());
}

function handleRateLimit(msg) {
  const resetsAt = msg.resets_at ? new Date(msg.resets_at * 1000).toLocaleTimeString() : '';
  const info = `${msg.rate_limit_type || 'unknown'}: ${msg.status || ''}`;
  stats.rateLimit = info;

  const el = document.getElementById('statRateLimit');
  el.textContent = resetsAt ? `${info} (resets ${resetsAt})` : info;
  el.className = 'stat-value' + (msg.status === 'exceeded' ? ' error' : ' warning');

  // Show in stream panel too
  const div = document.createElement('div');
  div.className = 'system-info';
  div.style.borderColor = 'var(--yellow)';
  div.innerHTML =
    `Rate Limit: <span>${msg.rate_limit_type || ''}</span> ` +
    `status=<span>${msg.status || ''}</span>` +
    (resetsAt ? ` resets=<span>${resetsAt}</span>` : '') +
    (msg.overage_status ? ` overage=<span>${msg.overage_status}</span>` : '') +
    (msg.is_using_overage ? ' <span style="color:var(--yellow)">[overage active]</span>' : '');
  streamPanel.appendChild(div);
  scrollToBottom(streamPanel);
}

// ═══════════════════════════════════════════════════════════
//  Events panel
// ═══════════════════════════════════════════════════════════

function addEvent(type, detail) {
  const entry = document.createElement('div');
  entry.className = 'event-entry';

  const time = document.createElement('span');
  time.className = 'ev-time';
  time.textContent = new Date().toLocaleTimeString();

  const typeBadge = document.createElement('span');
  typeBadge.className = `ev-type ${type}`;
  typeBadge.textContent = type;

  const det = document.createElement('span');
  det.className = 'ev-detail';
  det.textContent = detail;

  entry.appendChild(time);
  entry.appendChild(typeBadge);
  entry.appendChild(det);
  eventsPanel.appendChild(entry);
  scrollToBottom(eventsPanel);
}

// ═══════════════════════════════════════════════════════════
//  Raw panel
// ═══════════════════════════════════════════════════════════

function appendRaw(text) {
  rawOutput.textContent += text + '\n\n';
  scrollToBottom(rawOutput.parentElement);
}

// ═══════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════

function setStatus(state, text) {
  statusDot.className = 'status-dot' + (state === 'connected' ? ' connected' : (state === 'error' ? ' error' : ''));
  statusDot.title = text;
  updateStat('statStatus', text);
}

function updateStat(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

function scrollToBottom(el) {
  if (autoScroll) {
    requestAnimationFrame(() => {
      el.scrollTop = el.scrollHeight;
    });
  }
}

function clearAll() {
  streamPanel.innerHTML = '';
  eventsPanel.innerHTML = '';
  rawOutput.textContent = '';
  activeBlock = null;
  msgCount = 0;
  stats.inputTokens = 0;
  stats.outputTokens = 0;
  stats.cacheRead = 0;
  stats.cacheCreate = 0;
  stats.costUsd = 0;
  stats.rateLimit = null;
  updateStat('statMsgCount', '0');
  updateStat('statInputTokens', '0');
  updateStat('statOutputTokens', '0');
  updateStat('statCacheRead', '0');
  updateStat('statCacheCreate', '0');
  updateStat('statCost', '$0.00');
  updateStat('statRateLimit', '-');
}

// Auto-scroll detection: disable if user scrolls up
document.querySelectorAll('.panel').forEach(panel => {
  panel.addEventListener('scroll', () => {
    const threshold = 50;
    autoScroll = (panel.scrollHeight - panel.scrollTop - panel.clientHeight) < threshold;
  });
});

// Load URL from query string or localStorage
(function init() {
  const params = new URLSearchParams(window.location.search);
  const urlParam = params.get('ws') || params.get('url');
  const saved = localStorage.getItem('claudeStreamWsUrl');
  if (urlParam) {
    wsUrlInput.value = urlParam;
  } else if (saved) {
    wsUrlInput.value = saved;
  }

  // Save URL on change
  wsUrlInput.addEventListener('change', () => {
    localStorage.setItem('claudeStreamWsUrl', wsUrlInput.value);
  });

  // Auto-connect if URL provided via query string
  if (urlParam) {
    setTimeout(connect, 300);
  }
})();
</script>
