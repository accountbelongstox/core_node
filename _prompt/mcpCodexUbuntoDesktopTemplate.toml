# Codex MCP Servers Configuration Template (Ubuntu Desktop)
# This file contains MCP server configurations for Codex on Ubuntu Desktop
# Auto-generated template - do not modify directly

# Global MCP settings
experimental_use_rmcp_client = true

# ==================== Developer Documentation ====================

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.context7.env]
# Add any required environment variables here
# CONTEXT7_API_KEY = "your_key_here"
DISPLAY = ":0"

# ==================== File Processing ====================

[mcp_servers.file_processor]
command = "python3"
args = [
    "/home/$USER/projects/core_node/ncore/mcp_server/file_processor/main.py"
]

[mcp_servers.file_processor.env]
# File processor environment variables
PYTHONIOENCODING = "utf-8"
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

# ==================== Project-Specific Servers ====================

# Example: Project-specific MCP server
# Uncomment and modify as needed
# [mcp_servers.my_project]
# command = "node"
# args = ["$PROJECT_NAME$/mcp-server/index.js"]
