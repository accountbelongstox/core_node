# ==================== Linux Server Notes ====================
#
# Server Environment:
# - No GUI/Display available (headless)
# - Use CLI-only tools
# - Ensure proper permissions
#
# Paths:
# - Use absolute paths (e.g., /opt/, /srv/, /var/)
# - Or use /home/username/ for user directories
# - Use forward slashes (/)
#
# Python:
# - Use python3 command
# - Install packages with: pip3 install package-name
# - Or use virtual environments: python3 -m venv venv
#
# Node.js:
# - Use npx for global packages
# - Or install locally: npm install -g package-name
#
# Security:
# - Store secrets in environment variables
# - Use .env files (never commit to git)
# - Restrict file permissions (chmod 600 for sensitive files)
#
# Configuration structure:
# - command: The executable to launch the server
# - args: Array of arguments to pass to the command
# - env: Environment variables (optional)
# - url: For HTTP-based servers (instead of command)
# - bearer_token: For HTTP servers requiring authentication
# - startup_timeout_sec: Timeout for server initialization (optional)
# - tool_timeout_sec: Timeout for tool execution (optional)
#
# More info: https://docs.codex.ai/mcp
