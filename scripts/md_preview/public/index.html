<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown / Mermaid Preview</title>
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #d4d4d4; line-height: 1.6; display: flex; flex-direction: column; height: 100vh; }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #252526; border-bottom: 1px solid #333; flex-wrap: wrap; }
    .toolbar label { color: #9d9d9d; font-size: 12px; }
    .toolbar input[type="text"] { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 6px 10px; border-radius: 4px; min-width: 200px; }
    .toolbar input::placeholder { color: #6d6d6d; }
    .toolbar button { background: #0e639c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .toolbar button:hover { background: #1177bb; }
    .toolbar .root-hint { color: #6d6d6d; font-size: 12px; margin-right: 8px; }
    .sidebar-title .root-dir { display: block; font-weight: normal; font-size: 11px; color: #6d6d6d; margin-top: 4px; word-break: break-all; }
    .main { display: flex; flex: 1; min-height: 0; }
    .sidebar { flex: 0 0 auto; min-width: 160px; max-width: 80%; background: #252526; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-title { padding: 8px 12px; font-weight: 600; color: #e0e0e0; border-bottom: 1px solid #333; }
    .sidebar-filter { padding: 6px 8px; border-bottom: 1px solid #333; }
    .sidebar-filter input { width: 100%; background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 6px 8px; border-radius: 4px; }
    .file-list { flex: 1; overflow: auto; padding: 4px 0; }
    .file-list a { display: block; padding: 6px 12px; color: #d4d4d4; text-decoration: none; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-list a:hover { background: #2a2d2e; color: #fff; }
    .file-list a.active { background: #094771; color: #fff; }
    .resizer { flex: 0 0 6px; background: #333; cursor: col-resize; user-select: none; }
    .resizer:hover { background: #0e639c; }
    .content-area { flex: 1; min-width: 0; overflow: auto; padding: 1rem 2rem; }
    .content-area h1, .content-area h2, .content-area h3 { color: #e0e0e0; }
    .content-area a { color: #569cd6; }
    .content-area code { background: #2d2d2d; padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.9em; }
    .content-area pre { background: #2d2d2d; padding: 1rem; border-radius: 6px; overflow: auto; }
    .content-area pre code { padding: 0; background: none; }
    .content-area .mermaid { background: #2d2d2d; padding: 1rem; border-radius: 6px; margin: 1rem 0; overflow: visible; min-width: min-content; }
    .content-area .mermaid svg { overflow: visible; max-width: none; }
    .content-area .mermaid .cluster { overflow: visible !important; clip-path: none !important; }
    .content-area .mermaid .cluster rect { overflow: visible !important; fill: #252526 !important; stroke: #505050 !important; }
    .content-area .mermaid .cluster .cluster-label, .content-area .mermaid .cluster .label, .content-area .mermaid .cluster [class*="clusterLabel"] { overflow: visible !important; fill: #e0e0e0 !important; }
    /* Mermaid 11.x frequently sets fill on <text>/<tspan> directly (often inline). Target them explicitly. */
    .content-area .mermaid .cluster text,
    .content-area .mermaid .cluster tspan,
    .content-area .mermaid .cluster .label text,
    .content-area .mermaid .cluster .label tspan { fill: #e0e0e0 !important; }
    .content-area .mermaid .cluster foreignObject { overflow: visible !important; }
    .content-area .mermaid .cluster foreignObject div { overflow: visible !important; white-space: normal !important; word-break: break-word; color: #e0e0e0; background: transparent !important; }
    .content-area .mermaid .cluster-label-top { pointer-events: none; fill: #e0e0e0 !important; }
    .content-area .mermaid .cluster-label-top foreignObject div { color: #e0e0e0 !important; }
    .content-area .mermaid .node rect, .content-area .mermaid .node polygon, .content-area .mermaid .node circle { overflow: visible; fill: #252526 !important; stroke: #505050 !important; stroke-width: 1.5px !important; }
    .content-area .mermaid .node foreignObject { overflow: visible !important; }
    .content-area .mermaid .node foreignObject div { padding: 6px 10px; box-sizing: border-box; white-space: normal !important; word-break: break-word; min-height: 1.2em; line-height: 1.3; background: #252526 !important; }
    .content-area .mermaid .edgePath path { stroke-width: 2.8px !important; fill: none; }
    .content-area .mermaid .edgePath .arrowheadPath, .content-area .mermaid marker path { stroke-width: 2.8px !important; }
    .content-area .mermaid marker { overflow: visible; }
    .content-area .mermaid .edgeLabel rect,
    .content-area .mermaid .edgeLabel .labelBkg { fill: #1a2a3a !important; stroke: #2d4a5c !important; stroke-width: 1px !important; opacity: 1 !important; }
    .content-area .mermaid .edgeLabel foreignObject,
    .content-area .mermaid .edgeLabel foreignObject body,
    .content-area .mermaid .edgeLabel foreignObject div { background-color: #1a2a3a !important; border: 1px solid #2d4a5c !important; outline: none !important; padding: 2px 6px; border-radius: 4px; box-shadow: none !important; }
    .content-area .mermaid-block { margin: 1rem 0; }
    .content-area .mermaid-block-title { font-weight: 600; color: #9cdcfe; font-size: 0.95rem; margin-bottom: 0.35rem; }
    .content-area .error { color: #f48771; }
    .content-area .path-hint { color: #9cdcfe; font-size: 0.9rem; margin-bottom: 1rem; }
    .content-area.fit-width { overflow-x: hidden; }
    .content-area.fit-width .mermaid { max-width: 100%; min-width: 0; }
    .content-area.fit-width .mermaid svg { max-width: 100% !important; width: 100% !important; height: auto !important; }
    .content-area.fit-width pre { max-width: 100%; }
    .toolbar .fit-width-wrap { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
    .toolbar .fit-width-wrap label { margin: 0; cursor: pointer; }
    .toolbar .fit-width-wrap input[type="checkbox"] { margin: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="root-hint" id="rootHint">Root: —</span>
    <label>Path:</label>
    <input type="text" id="pathInput" placeholder="e.g. pyapps/d3-check/docs/ROSBOT_FLOW_MERMAID.md">
    <button type="button" id="loadBtn">Load</button>
    <div class="fit-width-wrap">
      <input type="checkbox" id="fitWidthToggle" title="右侧内容 100% 可用宽等比例显示，无横向滚动条">
      <label for="fitWidthToggle">Fit width</label>
    </div>
  </div>
  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">All .md / .mmd <span class="root-dir" id="rootDir"></span></div>
      <div class="sidebar-filter">
        <input type="text" id="filterInput" placeholder="Filter list...">
      </div>
      <div class="file-list" id="fileList"></div>
    </aside>
    <div class="resizer" id="resizer"></div>
    <main class="content-area">
      <div class="path-hint" id="pathHint"></div>
      <div id="content"></div>
    </main>
  </div>
  <script>
    (function initResizer() {
      var STORAGE_KEY = 'md_preview_sidebar_width';
      var MIN = 160;
      var MAX_PCT = 0.8;
      var DEFAULT = 280;
      var sidebar = document.getElementById('sidebar');
      var resizer = document.getElementById('resizer');
      var main = document.querySelector('.main');
      function getStored() {
        var v = localStorage.getItem(STORAGE_KEY);
        if (v == null) return DEFAULT;
        var n = parseInt(v, 10);
        return isNaN(n) ? DEFAULT : Math.max(MIN, n);
      }
      function setWidth(px) {
        var w = Math.max(MIN, Math.min(px, window.innerWidth * MAX_PCT));
        sidebar.style.width = w + 'px';
        localStorage.setItem(STORAGE_KEY, String(w));
      }
      setWidth(getStored());
      resizer.addEventListener('mousedown', function (e) {
        e.preventDefault();
        var startX = e.clientX;
        var startW = sidebar.offsetWidth;
        function move(e) {
          var dx = e.clientX - startX;
          setWidth(startW + dx);
        }
        function up() {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    })();
  </script>
  <script>
    const pathInput = document.getElementById('pathInput');
    const loadBtn = document.getElementById('loadBtn');
    const filterInput = document.getElementById('filterInput');
    const fileListEl = document.getElementById('fileList');
    const pathHint = document.getElementById('pathHint');
    const contentEl = document.getElementById('content');
    const rootHint = document.getElementById('rootHint');
    const rootDir = document.getElementById('rootDir');
    const contentArea = document.querySelector('.content-area');
    const fitWidthToggle = document.getElementById('fitWidthToggle');
    const FIT_WIDTH_STORAGE_KEY = 'md_preview_fit_width';
    const LAST_PATH_STORAGE_KEY = 'md_preview_last_path';
    const PREVIEW_SCROLL_STORAGE_KEY = 'md_preview_preview_scroll';
    function getFitWidth() { return localStorage.getItem(FIT_WIDTH_STORAGE_KEY) === '1'; }
    function setFitWidth(on) {
      localStorage.setItem(FIT_WIDTH_STORAGE_KEY, on ? '1' : '0');
      contentArea.classList.toggle('fit-width', on);
      fitWidthToggle.checked = on;
    }
    fitWidthToggle.checked = getFitWidth();
    contentArea.classList.toggle('fit-width', getFitWidth());
    fitWidthToggle.addEventListener('change', function () { setFitWidth(fitWidthToggle.checked); });

    (function initPreviewScrollPersist() {
      var scrollTimer;
      contentArea.addEventListener('scroll', function () {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
          localStorage.setItem(PREVIEW_SCROLL_STORAGE_KEY, String(contentArea.scrollTop));
        }, 150);
      });
      window.restorePreviewScroll = function () {
        var v = localStorage.getItem(PREVIEW_SCROLL_STORAGE_KEY);
        if (v == null) return;
        var n = parseInt(v, 10);
        if (!isNaN(n) && n >= 0) contentArea.scrollTop = n;
      };
    })();

    async function setRootDisplay() {
      try {
        const r = await fetch('/api/root');
        const data = await r.json();
        const root = (data.root || '').replace(/\\/g, '/');
        rootHint.textContent = 'Root: ' + (root || '—');
        rootDir.textContent = root || '';
      } catch (e) {
        rootHint.textContent = 'Root: —';
      }
    }

    function getPathFromUrl() {
      const params = new URLSearchParams(location.search);
      return (params.get('path') || '').replace(/\\/g, '/');
    }

    function setPathInUrl(path) {
      const u = new URL(location.href);
      u.searchParams.set('path', path);
      history.replaceState({}, '', u);
    }

    function renderMarkdown(md) {
      if (typeof marked !== 'undefined') {
        if (marked.setOptions) marked.setOptions({ gfm: true, breaks: true });
        marked.use({
          renderer: {
            code: function (token) {
              var lang = (token.lang || '').trim();
              var parts = lang ? lang.split(/\s+/) : [];
              var mainLang = parts[0] || '';
              var caption = parts.slice(1).join(' ').trim();
              if (mainLang === 'mermaid') {
                var code = token.escaped ? token.text : escapeHtml(token.text);
                if (caption) {
                  return '<div class="mermaid-block"><div class="mermaid-block-title">' + escapeHtml(caption) + '</div><pre><code class="language-mermaid">' + code + '</code></pre></div>';
                }
                return '<pre><code class="language-mermaid">' + code + '</code></pre>';
              }
              var langAttr = lang ? ' class="language-' + escapeHtml(lang) + '"' : '';
              return '<pre><code' + langAttr + '>' + (token.escaped ? token.text : escapeHtml(token.text)) + '</code></pre>';
            }
          }
        });
        return (marked.parse || marked)(md);
      }
      return md.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    function wrapMermaidBlocksWithTitle(container) {
      container.querySelectorAll('pre code.language-mermaid, pre code.mermaid').forEach(function (code) {
        var pre = code.parentElement;
        if (!pre || pre.closest('.mermaid-block')) return;
        var title = '';
        var prev = pre.previousElementSibling;
        while (prev) {
          if (/^H[1-6]$/i.test(prev.tagName)) {
            title = prev.textContent.trim();
            break;
          }
          prev = prev.previousElementSibling;
        }
        if (!title) title = 'Mermaid';
        var wrap = document.createElement('div');
        wrap.className = 'mermaid-block';
        var titleDiv = document.createElement('div');
        titleDiv.className = 'mermaid-block-title';
        titleDiv.textContent = title;
        wrap.appendChild(titleDiv);
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
      });
    }

    async function renderMermaid(container) {
      if (typeof mermaid === 'undefined') return;
      const blocks = container.querySelectorAll('pre code.language-mermaid, pre code.mermaid');
      for (const block of blocks) {
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = block.textContent.trim();
        block.parentElement.replaceWith(div);
      }
      const nodes = container.querySelectorAll('.mermaid');
      if (nodes.length === 0) return;
      try {
        if (mermaid.initialize) {
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            /* Ensure themeVariables apply (Mermaid official: only `base` is user-modifiable). */
            theme: 'base',
            darkMode: true,
            // Mermaid v11: subgraph titles ("区块标题") can be clipped/covered when fonts are large
            // or when renderer computes tight cluster bounds. Prefer using official layout knobs first.
            // - subGraphTitleMargin: reserve vertical space for the title inside cluster
            // - diagramPadding: extra breathing room around the whole SVG (prevents top/title clipping)
            flowchart: {
              useMaxWidth: false,
              htmlLabels: true,
              nodeSpacing: 30,
              rankSpacing: 40,
              subGraphTitleMargin: { top: 18, bottom: 6 },
              diagramPadding: 28
            },
            useMaxWidth: false,
            themeVariables: {
              nodeBorder: '#505050',
              nodeTextColor: '#fff',
              /* Official theme vars for flowchart/subgraph title visibility */
              titleColor: '#e0e0e0',
              textColor: '#e0e0e0',
              mainBkg: '#252526',
              clusterBkg: '#252526',
              clusterBorder: '#505050',
              lineColor: '#9e9e9e',
              secondaryBorder: '#555',
              tertiaryBorder: '#444',
              tertiaryColor: '#252526',
              edgeLabelBackground: '#1a2a3a',
            },
            themeCSS: '.cluster { overflow: visible !important; clip-path: none !important; } .cluster rect { overflow: visible !important; fill: #252526 !important; stroke: #505050 !important; } .cluster .cluster-label, .cluster .label, .cluster [class*="clusterLabel"] { overflow: visible !important; fill: #e0e0e0 !important; } .cluster foreignObject { overflow: visible !important; } .cluster foreignObject div { overflow: visible !important; color: #e0e0e0; } .edgePath path { stroke-width: 2.8px !important; } .arrowheadPath { stroke-width: 2.8px !important; } .node rect, .node polygon, .node circle { fill: #252526 !important; stroke: #505050 !important; } .node foreignObject { overflow: visible !important; } .node foreignObject div { white-space: normal !important; word-break: break-word; padding: 6px 10px; background: #252526 !important; } .edgeLabel rect, .edgeLabel .labelBkg, .edgeLabel .labelBkg rect { fill: #1a2a3a !important; stroke: #2d4a5c !important; stroke-width: 1px !important; opacity: 1 !important; } .edgeLabel .labelBkg, .edgeLabel foreignObject, .edgeLabel foreignObject body, .edgeLabel foreignObject div { background-color: #1a2a3a !important; border: 1px solid #2d4a5c !important; outline: none !important; box-shadow: none !important; }',
          });
        }
        if (typeof mermaid.run === 'function') await mermaid.run({ nodes });
        nodes.forEach(function (el) {
          // Mermaid 11.x flowchart "subgraph" titles are rendered inside `.cluster`.
          // The common failure mode: the cluster `<rect>` is appended after the label and covers it
          // (SVG paints in DOM order). Fix: remove clipping and reorder children so label is last.
          function findClusterLabelRoot(c) {
            // Prefer direct children first (most stable across Mermaid versions).
            var direct = c.querySelector(':scope > .cluster-label, :scope > .clusterLabel, :scope > .label');
            if (direct) return direct;

            // Fallback: locate a plausible label node, then lift it to the direct child under cluster.
            var deep = c.querySelector('.cluster-label, .clusterLabel, .label, text, foreignObject');
            if (!deep) return null;
            var cur = deep;
            while (cur && cur.parentNode && cur.parentNode !== c) cur = cur.parentNode;
            return cur && cur.parentNode === c ? cur : null;
          }
          function bringClusterTitleToFront(c) {
            var rect = c.querySelector(':scope > rect');
            if (rect && c.firstChild !== rect) c.insertBefore(rect, c.firstChild);
            var labelRoot = findClusterLabelRoot(c);
            if (labelRoot && labelRoot !== rect) {
              labelRoot.style.pointerEvents = 'none';
              c.appendChild(labelRoot);
            }
          }
          el.querySelectorAll('.cluster').forEach(function (c) {
            c.removeAttribute('clip-path');
            c.style.overflow = 'visible';
            c.querySelectorAll('[clip-path]').forEach(function (child) { child.removeAttribute('clip-path'); });
            bringClusterTitleToFront(c);
          });
          var labelBg = '#1a2a3a';
          var labelBorder = '#2d4a5c';
          el.querySelectorAll('.edgeLabel rect, .edgeLabel .labelBkg, .edgeLabel [class*="labelBkg"]').forEach(function (r) {
            r.setAttribute('fill', labelBg); r.setAttribute('stroke', labelBorder); r.style.fill = labelBg; r.style.stroke = labelBorder; r.style.opacity = '1';
          });
          el.querySelectorAll('.edgeLabel foreignObject, .edgeLabel foreignObject body, .edgeLabel foreignObject div').forEach(function (f) {
            f.style.backgroundColor = labelBg; f.style.border = '1px solid ' + labelBorder; f.style.outline = 'none';
          });
        });
      } catch (e) { console.warn('Mermaid:', e); }
    }

    async function loadPath(path) {
      path = (path || '').trim().replace(/\\/g, '/');
      pathHint.textContent = path ? 'File: ' + path : 'No file selected.';
      pathInput.value = path;
      setPathInUrl(path);
      updateListActive(path);
      if (!path) {
        contentEl.innerHTML = '<p class="error">Enter a path or pick a file from the list.</p>';
        return;
      }
      try {
        const r = await fetch('/api/content?path=' + encodeURIComponent(path));
        if (!r.ok) throw new Error(r.statusText);
        const md = await r.text();
        contentEl.innerHTML = renderMarkdown(md);
        wrapMermaidBlocksWithTitle(contentEl);
        await renderMermaid(contentEl);
        localStorage.setItem(LAST_PATH_STORAGE_KEY, path);
        fetch('/api/watch?path=' + encodeURIComponent(path)).catch(() => {});
        requestAnimationFrame(function () {
          if (window.restorePreviewScroll) window.restorePreviewScroll();
        });
      } catch (e) {
        contentEl.innerHTML = '<p class="error">Failed to load: ' + (e.message || e) + '</p>';
      }
    }

    let allFiles = [];
    async function fetchList() {
      try {
        const r = await fetch('/api/list');
        allFiles = await r.json();
        renderList(allFiles);
      } catch (e) {
        fileListEl.innerHTML = '<div class="error" style="padding:8px">Could not load list.</div>';
      }
    }

    function renderList(files) {
      const filter = (filterInput.value || '').toLowerCase();
      const filtered = filter ? files.filter(f => f.toLowerCase().includes(filter)) : files;
      fileListEl.innerHTML = filtered.map(f => {
        const active = getPathFromUrl() === f ? ' active' : '';
        return '<a href="#" data-path="' + escapeAttr(f) + '" class="' + active + '">' + escapeHtml(f) + '</a>';
      }).join('');
      fileListEl.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          loadPath(a.getAttribute('data-path'));
        });
      });
    }

    function escapeAttr(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML.replace(/"/g, '&quot;');
    }
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function updateListActive(path) {
      fileListEl.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-path') === path);
      });
    }

    loadBtn.addEventListener('click', () => loadPath(pathInput.value.trim()));
    pathInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadPath(pathInput.value.trim()); });
    filterInput.addEventListener('input', () => renderList(allFiles));

    function connectReload() {
      const ev = new EventSource('/api/reload');
      ev.onmessage = (e) => {
        let payload;
        try {
          payload = JSON.parse(e.data || '{}');
        } catch {
          payload = {};
        }
        const changedPath = (payload.path || '').replace(/\\/g, '/');
        fetchList();
        if (changedPath && changedPath === getPathFromUrl()) loadPath(changedPath);
      };
      ev.onerror = () => { ev.close(); setTimeout(connectReload, 2000); };
    }

    setRootDisplay();
    fetchList();
    loadPath(getPathFromUrl() || localStorage.getItem(LAST_PATH_STORAGE_KEY) || '');
    connectReload();
  </script>
</body>
</html>
