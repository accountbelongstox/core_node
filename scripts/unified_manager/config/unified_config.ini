# Unified App Manager Configuration
# Cross-platform configuration file
# This file is read by both Python and Shell/PowerShell components

[general]
version = 16.2.0
name = dd.sh Unified App Manager
prefix = UAPPMAN_

[paths]
# Will be set by runtime detection
root_dir =
ncore_apps =
pycore_apps =
poly_apps =
cache_dir =
temp_dir =

[ports]
base_port = 10000
range = 5000
auto_increment = true

[frameworks]
# Priority order for framework detection
priority_order = reactStart,vueStart,nuxtStart,laravelStart,flutterStart,reactNativeStart,kotlinMultiPlatformStart,phpStart,pyStart,polyLauncher

# Framework detection patterns
react_patterns = package.json,react
vue_patterns = package.json,vue,vite.config.js
nuxt_patterns = nuxt.config.ts,nuxt.config.js
laravel_patterns = composer.json,public/index.php,artisan
flutter_patterns = pubspec.yaml
reactnative_patterns = package.json,android,ios,react-native
kotlin_patterns = build.gradle.kts,build.gradle,kotlin
php_patterns = index.php
python_patterns = main.py

[debug_detection]
env_files = .env,.env.local,.env.development
env_patterns = APP_ENV=local,NODE_ENV=development,APP_DEBUG=true
dev_dirs = node_modules,src,lib,components,assets
workspace_patterns = poly_apps,dev,development

[service]
user = root
restart_policy = always
restart_sec = 5
cpu_limit = 50%
memory_limit = 1G

[ui]
max_app_display = 50
menu_width = 80

[commands]
# Command templates for different frameworks
react_dev = cd "{app_path}" && pnpm run dev
react_build = cd "{app_path}" && pnpm run build && pnpm start
vue_dev = cd "{app_path}" && pnpm run dev
vue_build = cd "{app_path}" && pnpm run build && pnpm start
nuxt_dev = cd "{app_path}" && pnpm run dev
nuxt_build = cd "{app_path}" && pnpm run build && pnpm start
laravel_dev = cd "{app_path}" && php artisan serve --host=0.0.0.0 --port={port}
laravel_prod = cd "{app_path}" && php artisan serve --host=0.0.0.0 --port={port} --env=production
flutter_dev = cd "{app_path}" && flutter run -d web-server --web-hostname=0.0.0.0 --web-port={port}
flutter_build = cd "{app_path}" && flutter build web && python3 -m http.server {port} --bind 0.0.0.0 --directory build/web
kotlin_dev = cd "{app_path}" && ./gradlew run
php_dev = php -S 0.0.0.0:{port} -t "{app_path}"
python_dev = python "{app_path}/main.py"
ncore_dev = node "{root_dir}/main.js" app={app_name}
pycore_dev = python "{root_dir}/pymain.py" app={app_name}

[platform_specific]
# Linux-only features
linux_enable_systemd = true
linux_enable_nginx = true
linux_enable_firewall = true

# Windows-only features
windows_enable_iis = false
windows_enable_wsl = true
windows_use_powershell = true

[excluded_features]
# Features not available on Windows
windows_exclude = systemd_service,nginx_config,firewall_config,domain_proxy