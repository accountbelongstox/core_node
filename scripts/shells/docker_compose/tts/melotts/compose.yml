# Project-managed compose service for the MeloTTS class-C server.
# restart "no": the pycore managed lifecycle owns start/stop (plan 19.10).
# Limits, port, device and staging come from model.sh through the docker model
# runner. /data is the staging bind mount, so weights stay outside the image.
services:
  melotts:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
      labels:
        pycore.fingerprint: ${TTS_IMAGE_FINGERPRINT:-}
    image: pycore-tts-melotts:local
    container_name: pycore-tts-melotts
    restart: "no"
    mem_limit: ${TTS_MEM_LIMIT:-3g}
    memswap_limit: ${TTS_MEM_LIMIT:-3g}
    cpus: ${TTS_CPUS:-3.0}
    pids_limit: ${TTS_PIDS_LIMIT:-512}
    ports:
      - "127.0.0.1:${TTS_PORT:-57212}:57212"
    volumes:
      - ${TTS_STAGING:?TTS_STAGING is required}:/data
      - ${CORE_NODE_REPO:?CORE_NODE_REPO is required}/pycore/pyfoundations:/opt/core_node/pycore/pyfoundations:ro
      - ${CORE_NODE_REPO:?CORE_NODE_REPO is required}/config/service_contract.json:/opt/core_node/config/service_contract.json:ro
      - ${CORE_NODE_REPO:?CORE_NODE_REPO is required}/pycore/pyfoundations/sentence_segmenter.py:/opt/melotts/sentence_segmenter.py:ro
      - ${CORE_NODE_REPO:?CORE_NODE_REPO is required}/config/sentence_segmentation_contract.json:/opt/melotts/sentence_segmentation_contract.json:ro
      - ${CORE_NODE_REPO:?CORE_NODE_REPO is required}/pycore/pyfoundations/sentence_segmenter.py:/opt/melotts/sentence_segmenter.py:ro
      - ${CORE_NODE_REPO:?CORE_NODE_REPO is required}/config/sentence_segmentation_contract.json:/opt/melotts/sentence_segmentation_contract.json:ro
    environment:
      MELOTTS_DEVICE: ${TTS_DEVICE:-cpu}
      MELOTTS_MODEL: ${MELOTTS_MODEL:-en}
      PYCORE_PROJECT_ROOT: /opt/core_node
      HF_HOME: /data/${TTS_WEIGHTS_SUBDIR:-hf_cache}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    labels:
      pycore.managed: "true"
      pycore.engine: "melotts"
