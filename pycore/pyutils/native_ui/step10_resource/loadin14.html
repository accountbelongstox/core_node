<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadin14 • Progress Bar</title>
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 90%;
            max-width: 360px;
        }
        .loader {
            width: 100%;
            height: 8px;
            display: inline-block;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        .loader::before {
            content: '';
            box-sizing: border-box;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.15);
            background-image: linear-gradient(45deg, rgba(0, 0, 0, 0.25) 25%, transparent 25%,
                                              transparent 50%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.25) 75%,
                                              transparent 75%, transparent);
            background-size: 15px 15px;
            z-index: 1;
        }
        .loader::after {
            content: '';
            box-sizing: border-box;
            width: 0%;
            height: 100%;
            background-color: #FFF;
            position: absolute;
            border-radius: 0 4px 4px 0;
            top: 0;
            left: 0;
            animation: animFw 10s ease-in infinite;
            z-index: 2;
        }
        @keyframes animFw {
            0% { width: 0; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loader" role="status" aria-label="Progress bar loading animation"></div>
    </div>
</body>
</html>
