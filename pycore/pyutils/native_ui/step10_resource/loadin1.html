<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadin1 • Wave Pulse</title>
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .loader {
            width: 8px;
            height: 8px;
            position: relative;
            border-radius: 50%;
            background: #fff;
            animation: wave 1s ease-in infinite;
        }
        @keyframes wave {
            0% {
                box-shadow: 0 0 0 0px rgba(255, 255, 255, 1),
                            0 0 0 20px rgba(255, 255, 255, 0.2),
                            0 0 0 40px rgba(255, 255, 255, 0.6),
                            0 0 0 60px rgba(255, 255, 255, 0.4),
                            0 0 0 80px rgba(255, 255, 255, 0.2);
            }
            100% {
                box-shadow: 0 0 0 80px rgba(255, 255, 255, 0),
                            0 0 0 60px rgba(255, 255, 255, 0.2),
                            0 0 0 40px rgba(255, 255, 255, 0.4),
                            0 0 0 20px rgba(255, 255, 255, 0.6),
                            0 0 0 0px rgba(255, 255, 255, 1);
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loader" role="status" aria-label="Wave loading animation"></div>
    </div>
</body>
</html>
