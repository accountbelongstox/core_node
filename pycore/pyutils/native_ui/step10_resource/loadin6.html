<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadin6 • Split Orbs</title>
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .loader {
            width: 64px;
            height: 48px;
            position: relative;
            animation: split 1s ease-in infinite alternate;
        }
        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            height: 48px;
            width: 48px;
            border-radius: 50%;
            top: 0;
            background: rgba(255, 61, 0, 0.85);
            backdrop-filter: blur(20px);
        }
        .loader::before {
            left: -10px;
        }
        .loader::after {
            right: -10px;
            background: #ffffff;
        }
        @keyframes split {
            0%, 25% { width: 64px; }
            100% { width: 148px; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loader" role="status" aria-label="Split orbs loading animation"></div>
    </div>
</body>
</html>
