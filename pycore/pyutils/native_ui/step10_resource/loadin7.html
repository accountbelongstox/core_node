<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadin7 • Fill Circles</title>
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .loader {
            width: 32px;
            height: 32px;
            position: relative;
            border-radius: 50%;
            color: #FF3D00;
            animation: fill 1s ease-in infinite alternate;
        }
        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            height: 100%;
            width: 100%;
            border-radius: 50%;
            top: 0;
            animation: fill 0.9s ease-in infinite alternate;
        }
        .loader::before {
            left: 48px;
        }
        .loader::after {
            right: 48px;
            animation-duration: 1.1s;
        }
        @keyframes fill {
            0% { box-shadow: 0 0 0 2px inset; }
            100% { box-shadow: 0 0 0 10px inset; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loader" role="status" aria-label="Fill circles loading animation"></div>
    </div>
</body>
</html>
