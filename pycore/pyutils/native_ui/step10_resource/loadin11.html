<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadin11 • Triple Squares</title>
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .loader {
            width: 48px;
            height: 48px;
            display: inline-block;
            position: relative;
            border: 2px solid #FFF;
            box-sizing: border-box;
            animation: rotationOuter 2s linear infinite;
        }
        .loader::after,
        .loader::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            border: 2px solid #FF3D00;
            width: 38px;
            height: 38px;
            animation: rotationBack 1.5s linear infinite;
            transform-origin: center;
        }
        .loader::before {
            width: 28px;
            height: 28px;
            border-color: #FFF;
            animation: rotationInner 1s linear infinite;
        }
        @keyframes rotationOuter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotationBack {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
        @keyframes rotationInner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loader" role="status" aria-label="Triple squares loading animation"></div>
    </div>
</body>
</html>
