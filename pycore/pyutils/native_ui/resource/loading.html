<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .loading-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Style 1: Wave */
        .loader.style-1 {
            width: 8px;
            height: 8px;
            position: relative;
            border-radius: 50%;
            background: #fff;
            animation: wave 1s ease-in infinite;
        }
        @keyframes wave {
            0% {
                box-shadow: 0 0 0 0px rgba(255, 255, 255, 1),
                            0 0 0 20px rgba(255, 255, 255, 0.2),
                            0 0 0 40px rgba(255, 255, 255, 0.6),
                            0 0 0 60px rgba(255, 255, 255, 0.4),
                            0 0 0 80px rgba(255, 255, 255, 0.2);
            }
            100% {
                box-shadow: 0 0 0 80px rgba(255, 255, 255, 0),
                            0 0 0 60px rgba(255, 255, 255, 0.2),
                            0 0 0 40px rgba(255, 255, 255, 0.4),
                            0 0 0 20px rgba(255, 255, 255, 0.6),
                            0 0 0 0px rgba(255, 255, 255, 1);
            }
        }

        /* Style 2: Rotating Ring */
        .loader.style-2 {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .loader.style-2:before,
        .loader.style-2:after {
            content: '';
            border-radius: 50%;
            position: absolute;
            inset: 0;
            box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.3) inset;
        }
        .loader.style-2:after {
            box-shadow: 0 2px 0 #FF3D00 inset;
            animation: rotate 2s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        /* Style 3: Pulsing Circle */
        .loader.style-3 {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 6rem;
        }
        .loader.style-3:before,
        .loader.style-3:after {
            content: "";
            position: absolute;
            border-radius: 50%;
            animation: pulsOut 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 1rem rgba(255, 255, 255, 0.75));
        }
        .loader.style-3:before {
            width: 100%;
            padding-bottom: 100%;
            box-shadow: inset 0 0 0 1rem #fff;
            animation-name: pulsIn;
        }
        .loader.style-3:after {
            width: calc(100% - 2rem);
            padding-bottom: calc(100% - 2rem);
            box-shadow: 0 0 0 0 #fff;
        }
        @keyframes pulsIn {
            0% {
                box-shadow: inset 0 0 0 1rem #fff;
                opacity: 1;
            }
            50%, 100% {
                box-shadow: inset 0 0 0 0 #fff;
                opacity: 0;
            }
        }
        @keyframes pulsOut {
            0%, 50% {
                box-shadow: 0 0 0 0 #fff;
                opacity: 0;
            }
            100% {
                box-shadow: 0 0 0 1rem #fff;
                opacity: 1;
            }
        }

        /* Style 4: Flip */
        .loader.style-4 {
            width: 48px;
            height: 48px;
            position: relative;
            perspective: 500px;
        }
        .loader.style-4:before,
        .loader.style-4:after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            width: 24px;
            height: 48px;
            background: #FF3D00;
            border-radius: 0 24px 24px 0;
            transform-origin: 0 0;
            animation: flip 2s linear infinite alternate;
        }
        .loader.style-4:after {
            left: 0;
            border-radius: 24px 0 0 24px;
            transform-origin: 100% 0;
            animation-delay: 1s;
        }
        @keyframes flip {
            0%, 10% { transform: rotateY(0deg); }
            90%, 100% { transform: rotateY(-180deg); }
        }

        /* Style 5: Spinning Border */
        .loader.style-5 {
            width: 48px;
            height: 48px;
            border: 24px solid #FFF;
            border-color: #FF3D00 #FF3D00 #fff #fff;
            border-radius: 50%;
            position: relative;
            animation: rotate 1s linear infinite;
        }
        .loader.style-5:before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translate(-50%, -125%);
            left: 50%;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
        }

        /* Style 6: Split */
        .loader.style-6 {
            width: 64px;
            height: 48px;
            position: relative;
            animation: split 1s ease-in infinite alternate;
        }
        .loader.style-6::before,
        .loader.style-6::after {
            content: '';
            position: absolute;
            height: 48px;
            width: 48px;
            border-radius: 50%;
            left: 0;
            top: 0;
            transform: translateX(-10px);
            background: #FF3D00;
            opacity: 0.75;
            backdrop-filter: blur(20px);
        }
        .loader.style-6::after {
            left: auto;
            right: 0;
            background: #FFF;
            transform: translateX(10px);
        }
        @keyframes split {
            0%, 25% { width: 64px; }
            100% { width: 148px; }
        }

        /* Style 7: Fill Circles */
        .loader.style-7 {
            width: 32px;
            height: 32px;
            position: relative;
            border-radius: 50%;
            color: #FF3D00;
            animation: fill 1s ease-in infinite alternate;
        }
        .loader.style-7::before,
        .loader.style-7::after {
            content: '';
            position: absolute;
            height: 100%;
            width: 100%;
            border-radius: 50%;
            left: 48px;
            top: 0;
            animation: fill 0.9s ease-in infinite alternate;
        }
        .loader.style-7::after {
            left: auto;
            right: 48px;
            animation-duration: 1.1s;
        }
        @keyframes fill {
            0% { box-shadow: 0 0 0 2px inset; }
            100% { box-shadow: 0 0 0 10px inset; }
        }

        /* Style 8: Shadow Rolling */
        .loader.style-8 {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
            position: relative;
            color: #FFF;
            left: -100px;
            box-sizing: border-box;
            animation: shadowRolling 2s linear infinite;
        }
        @keyframes shadowRolling {
            0% {
                box-shadow: 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0),
                           0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0);
            }
            12% {
                box-shadow: 100px 0 white, 0px 0 rgba(255, 255, 255, 0),
                           0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0);
            }
            25% {
                box-shadow: 110px 0 white, 100px 0 white,
                           0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0);
            }
            36% {
                box-shadow: 120px 0 white, 110px 0 white, 100px 0 white, 0px 0 rgba(255, 255, 255, 0);
            }
            50% {
                box-shadow: 130px 0 white, 120px 0 white, 110px 0 white, 100px 0 white;
            }
            62% {
                box-shadow: 200px 0 rgba(255, 255, 255, 0), 130px 0 white, 120px 0 white, 110px 0 white;
            }
            75% {
                box-shadow: 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0),
                           130px 0 white, 120px 0 white;
            }
            87% {
                box-shadow: 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0),
                           200px 0 rgba(255, 255, 255, 0), 130px 0 white;
            }
            100% {
                box-shadow: 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0),
                           200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0);
            }
        }

        /* Style 9: Dot Wave */
        .loader.style-9 {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
            position: relative;
            color: #FFF;
            box-sizing: border-box;
            animation: animloader 2s linear infinite;
        }
        @keyframes animloader {
            0% {
                box-shadow: 14px 0 0 -2px, 38px 0 0 -2px, -14px 0 0 -2px, -38px 0 0 -2px;
            }
            25% {
                box-shadow: 14px 0 0 -2px, 38px 0 0 -2px, -14px 0 0 -2px, -38px 0 0 2px;
            }
            50% {
                box-shadow: 14px 0 0 -2px, 38px 0 0 -2px, -14px 0 0 2px, -38px 0 0 -2px;
            }
            75% {
                box-shadow: 14px 0 0 2px, 38px 0 0 -2px, -14px 0 0 -2px, -38px 0 0 -2px;
            }
            100% {
                box-shadow: 14px 0 0 -2px, 38px 0 0 2px, -14px 0 0 -2px, -38px 0 0 -2px;
            }
        }

        /* Style 10: Dual Square */
        .loader.style-10 {
            width: 48px;
            height: 48px;
            display: inline-block;
            position: relative;
        }
        .loader.style-10::after,
        .loader.style-10::before {
            content: '';
            width: 48px;
            height: 48px;
            border: 2px solid #FFF;
            position: absolute;
            left: 0;
            top: 0;
            box-sizing: border-box;
            animation: rotation 2s ease-in-out infinite;
        }
        .loader.style-10::after {
            border-color: #FF3D00;
            animation-delay: 1s;
        }

        /* Style 11: Triple Square */
        .loader.style-11 {
            width: 48px;
            height: 48px;
            display: inline-block;
            position: relative;
            border: 2px solid #FFF;
            box-sizing: border-box;
            animation: rotation 2s linear infinite;
        }
        .loader.style-11::after,
        .loader.style-11::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            border: 2px solid #FF3D00;
            width: 38px;
            height: 38px;
            animation: rotationBack 1.5s linear infinite;
            transform-origin: center center;
        }
        .loader.style-11::before {
            width: 28px;
            height: 28px;
            border-color: #FFF;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotationBack {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Style 12: 3D Cube */
        .loader.style-12 {
            position: relative;
            width: 48px;
            height: 48px;
            background: #de3500;
            transform: rotateX(65deg) rotate(45deg);
            color: #fff;
            animation: layers1 1s linear infinite alternate;
        }
        .loader.style-12:after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            animation: layerTr 1s linear infinite alternate;
        }
        @keyframes layers1 {
            0% { box-shadow: 0px 0px 0 0px; }
            90%, 100% { box-shadow: 20px 20px 0 -4px; }
        }
        @keyframes layerTr {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-25px, -25px) scale(1); }
        }

        /* Style 13: Bouncing Dots */
        .loader.style-13 {
            width: 16px;
            height: 16px;
            box-shadow: 0 30px, 0 -30px;
            border-radius: 4px;
            background: currentColor;
            display: block;
            position: relative;
            color: #FFF;
            transform: translateY(30px);
            box-sizing: border-box;
            animation: animloader13 2s ease infinite;
        }
        .loader.style-13::after,
        .loader.style-13::before {
            content: '';
            box-sizing: border-box;
            width: 16px;
            height: 16px;
            box-shadow: 0 30px, 0 -30px;
            border-radius: 4px;
            background: currentColor;
            color: #FFF;
            position: absolute;
            left: 30px;
            top: 0;
            animation: animloader13 2s 0.2s ease infinite;
        }
        .loader.style-13::before {
            animation-delay: 0.4s;
            left: 60px;
        }
        @keyframes animloader13 {
            0% {
                top: 0;
                color: white;
            }
            50% {
                top: 30px;
                color: rgba(255, 255, 255, 0.2);
            }
            100% {
                top: 0;
                color: white;
            }
        }

        /* Style 14: Progress Bar */
        .loader.style-14 {
            width: 100%;
            max-width: 300px;
            height: 8px;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }
        .loader.style-14::before {
            content: '';
            box-sizing: border-box;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.15);
            background-image: linear-gradient(45deg, rgba(0, 0, 0, 0.25) 25%, transparent 25%,
                                              transparent 50%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.25) 75%,
                                              transparent 75%, transparent);
            background-size: 15px 15px;
            z-index: 10;
        }
        .loader.style-14::after {
            content: '';
            box-sizing: border-box;
            width: 0%;
            height: 100%;
            background-color: #FFF;
            position: absolute;
            border-radius: 0 4px 4px 0;
            top: 0;
            left: 0;
            animation: animFw 10s ease-in infinite;
        }
        @keyframes animFw {
            0% { width: 0; }
            100% { width: 100%; }
        }

        /* Hide all styles except the active one */
        .loader {
            display: none;
        }
        .loader.active {
            display: block;
        }
        .loader.style-3.active,
        .loader.style-10.active,
        .loader.style-11.active,
        .loader.style-14.active {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <!-- All loader styles (only one will be active) -->
        <div class="loader style-1" id="loader"></div>
        <div class="loader style-2"></div>
        <div class="loader style-3"></div>
        <div class="loader style-4"></div>
        <div class="loader style-5"></div>
        <div class="loader style-6"></div>
        <div class="loader style-7"></div>
        <div class="loader style-8"></div>
        <div class="loader style-9"></div>
        <div class="loader style-10"></div>
        <div class="loader style-11"></div>
        <div class="loader style-12"></div>
        <div class="loader style-13"></div>
        <div class="loader style-14"></div>

        <div class="loading-text" id="loading-text">Loading...</div>
    </div>

    <script>
        // Get loading style from URL parameter (default: 1)
        const urlParams = new URLSearchParams(window.location.search);
        const style = parseInt(urlParams.get('style')) || 1;
        const text = urlParams.get('text') || 'Loading...';
        const bgColor = urlParams.get('bg') || '#1e1e1e';

        // Set background color
        document.body.style.background = bgColor;

        // Set loading text
        document.getElementById('loading-text').textContent = text;

        // Activate the selected loader style
        const loaders = document.querySelectorAll('.loader');
        loaders.forEach((loader, index) => {
            if (index + 1 === style) {
                loader.classList.add('active');
                loader.id = 'loader';
            }
        });
    </script>
</body>
</html>
