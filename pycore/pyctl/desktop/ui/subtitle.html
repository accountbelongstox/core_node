<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Subtitle</title>
    <link rel="stylesheet" href="/voice-subtitle/subtitle.css">
</head>
<body>
    <div class="header">
        <div class="title">
            <span>🎵</span>
            <span>Voice Subtitle</span>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="subtitle-container">
        <div id="subtitleText" class="empty-state">
            <div class="icon">🎧</div>
            <div>No subtitle playing</div>
            <div style="font-size: 14px; margin-top: 8px;">Click play to start</div>
        </div>
    </div>

    <!-- HTML5 Audio Player (hidden) -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Playback Controls -->
    <div class="controls">
        <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
        <button class="control-btn play-pause" id="playPauseBtn" title="Play/Pause">▶</button>
        <button class="control-btn" id="nextBtn" title="Next">⏭</button>
        <select class="playback-speed" id="speedSelect" title="Playback Speed">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
        </select>
        <div class="volume-control">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
        </div>
    </div>

    <div class="footer">
        <div class="queue-info">
            <div class="queue-item">
                <span class="queue-label">Queue:</span>
                <span class="queue-value" id="queueSize">0</span>
            </div>
            <div class="queue-item">
                <span class="queue-label">Current:</span>
                <span class="queue-value" id="queueIndex">-</span>
            </div>
            <div class="queue-item">
                <span class="queue-label">Played:</span>
                <span class="queue-value" id="playCount">0</span>
            </div>
        </div>
        <div id="audioFile" style="color: #666666;">-</div>
    </div>

    <!-- RPC v2 WebSocket Client -->
    <script src="/js/rpc/ws_rpc_client.js"></script>
    <script src="/voice-subtitle/subtitle.js"></script>
</body>
</html>
