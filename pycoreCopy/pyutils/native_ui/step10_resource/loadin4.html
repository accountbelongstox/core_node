<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadin4 • Flip Panels</title>
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .loader {
            width: 48px;
            height: 48px;
            position: relative;
            perspective: 500px;
        }
        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 24px;
            height: 48px;
            background: #FF3D00;
            border-radius: 0 24px 24px 0;
            transform-origin: 0 0;
            animation: flip 2s linear infinite alternate;
        }
        .loader::after {
            left: 0;
            border-radius: 24px 0 0 24px;
            transform-origin: 100% 0;
            animation-delay: 1s;
        }
        @keyframes flip {
            0%, 10% { transform: rotateY(0deg); }
            90%, 100% { transform: rotateY(-180deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loader" role="status" aria-label="Flip loading animation"></div>
    </div>
</body>
</html>
