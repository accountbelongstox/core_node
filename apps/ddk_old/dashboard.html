<!DOCTYPE html><html><head><meta charset="UTF-8"><title>拼多多订单管理</title><link rel="stylesheet" href="assets/styles/styles.css"><script defer="defer" src="dashboard.bundle.js"></script></head><body><canvas id="backgroundCanvas"></canvas><button id="pageRefreshBtn" class="page-refresh-btn" style="display:none">刷新</button><div class="container"><div class="user-info"><div id="userStatus"><div class="free-user"><span>免费用户</span> <button id="loginBtn" class="btn">登录</button></div></div><div id="loginModal" class="modal"><div class="modal-content"><h3>用户登录</h3><form id="loginForm"><div class="form-group"><label for="username">用户名：</label> <input type="text" id="username" name="username" required></div><div class="form-group"><label for="password">密码：</label><div class="password-input-container"><input type="password" id="password" name="password" required> <button type="button" class="password-toggle" id="passwordToggle"><svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> <svg class="eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button></div></div><div class="form-group"><label class="checkbox-label"><input type="checkbox" id="rememberMe" name="rememberMe" checked="checked"> <span class="checkmark"></span> 记住账号密码</label></div><div class="form-actions"><button type="submit" class="btn">登录</button> <button type="button" class="btn" id="cancelLogin">取消</button></div></form></div></div></div><div class="accounts-wrapper"><div class="accounts-label">拼多多账号：</div><div id="accountsList"></div></div><div class="controls-wrapper"><div id="time-selector"><div class="time-input"><label>下单时间：</label> <input type="date" id="start-time" pattern="\d{4}/\d{2}/\d{2}"> <span>~</span> <input type="date" id="end-time" pattern="\d{4}/\d{2}/\d{2}"></div><div class="quick-date-selection"><select id="quickDateSelect" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px;cursor:pointer"><option value="7">近1周</option><option value="30">近1月</option><option value="60">近2月</option><option value="90">近3月</option><option value="365">近1年</option><option value="0">不限时间</option></select></div><div id="time-error" class="error-message"></div><div class="order-type-wrapper"><label style="font-size:14px;color:#666;margin-right:5px">订单状态：</label> <select id="orderTypeSelect" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px;cursor:pointer"><option value="all">全部</option><option value="unpaid">待付款</option><option value="grouping">待分享</option><option value="unshipping">待发货</option><option value="unreceived">待收货</option></select></div><div class="logistics-toggle-wrapper invoice-status"><label class="logistics-mode-toggle"><span>发票状态</span> <input type="checkbox" id="invoiceStatusToggle"><div class="toggle-slider"></div></label></div><div class="logistics-toggle-wrapper pickup-code"><label class="logistics-mode-toggle"><span>取件码</span> <input type="checkbox" id="pickupCodeToggle"><div class="toggle-slider"></div></label></div><div class="logistics-toggle-wrapper after-sale"><label class="logistics-mode-toggle"><span>售后</span> <input type="checkbox" id="afterSaleToggle"><div class="toggle-slider"></div></label></div><div class="logistics-toggle-wrapper"><label class="logistics-mode-toggle"><span>物流</span> <input type="checkbox" id="logisticsToggle"><div class="toggle-slider"></div></label></div><button id="fetch-orders" class="btn">查询所有</button></div><div class="search-box"><input type="text" id="searchInput" placeholder="输入收货地址、收件人姓名、收货电话、物流单号、订单状态、订单号、商品名称等关键词"><div id="shippingTimeFilter" style="display:none;align-items:center;margin-right:8px"><select id="logisticsTimeType" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px;cursor:pointer;margin-left:10px"><option value="orderTime">下单时间</option><option value="shippingTime">发货时间</option><option value="receiveTime">签收时间</option></select><div class="time-input"><input type="date" id="logisticsTimeStart"></div><div class="time-input"><label>~</label> <input type="date" id="logisticsTimeEnd"></div></div><button id="resetSearchBtn" class="btn" style="height:100%">重置</button></div></div><div class="orders"><h3></h3><div id="orderList"><div class="empty-state"><p>暂无订单，请添加账号后进行查询。</p><br><p>如果订单查询结果为空，请确保拼多多账号绑定了正确的手机号。</p></div></div></div><footer class="footer"><a href="#" id="privacyLink">隐私政策</a> | <a href="#" id="helpLink">使用说明</a> | <a href="#" id="contactLink">联系我们</a> | <a href="#" id="alipayUpgradeLink" class="alipay-link">产品订购</a> | <a href="#" id="officialWebsiteLink" class="official-website-link">官方网站</a></footer><span id="pluginVersion" class="plugin-version-fixed"></span><div id="tokenLoginModal" class="modal"><div class="modal-content"><h3>Token登录</h3><form id="tokenLoginForm"><div class="form-group"><label for="pddAccessToken">Token：</label> <input type="text" id="pddAccessToken" name="pddAccessToken" required></div><div class="form-group"><label for="pddUserId">用户ID：</label> <input type="text" id="pddUserId" name="pddUserId" required></div><div class="form-actions"><button type="submit" class="btn">登录</button> <button type="button" class="btn" id="cancelTokenLogin">取消</button></div></form></div></div><div id="changePasswordModal" class="modal"><div class="modal-content"><h3>修改密码</h3><form id="changePasswordForm"><div class="form-group"><label for="currentPassword">当前密码：</label> <input type="password" id="currentPassword" name="currentPassword" required></div><div class="form-group"><label for="newPassword">新密码：</label> <input type="password" id="newPassword" name="newPassword" required></div><div class="form-group"><label for="confirmPassword">确认新密码：</label> <input type="password" id="confirmPassword" name="confirmPassword" required> <span id="passwordError" class="error-message"></span></div><div class="form-actions"><button type="submit" class="btn">确认修改</button> <button type="button" class="btn" id="cancelChangePassword">取消</button></div></form></div></div><div id="registerModal" class="modal"><div class="modal-content"><h3>用户注册</h3><form id="registerForm"><div class="form-group"><label for="registerUsername">用户名：</label> <input type="text" id="registerUsername" name="username" required></div><div class="form-group"><label for="registerPassword">密码：</label> <input type="password" id="registerPassword" name="password" required></div><div class="form-group"><label for="registerConfirmPassword">确认密码：</label> <input type="password" id="registerConfirmPassword" name="confirmPassword" required></div><div class="form-group"><label for="registerAcquisitionSource">您是怎么知道多多开的？</label> <select id="registerAcquisitionSource" name="acquisitionSource"><option value="">请选择</option></select> <small class="form-help-text">填写该字段可获取3元代金券</small></div><div class="form-group" id="registerAcquisitionSourceDetailGroup" style="display:none"><label for="registerAcquisitionSourceDetail">平台名称：</label> <input type="text" id="registerAcquisitionSourceDetail" name="acquisitionSourceDetail" placeholder="请输入平台名称"></div><div class="form-group"><label for="captchaInput">验证码：</label><div class="captcha-container"><input type="text" id="captchaInput" name="captcha" required maxlength="4"><canvas id="captchaCanvas" width="120" height="40" style="cursor:pointer"></canvas></div></div><span id="registerError" class="error-message"></span><div class="form-actions"><button type="submit" class="btn primary">注册</button> <button type="button" class="btn" id="cancelRegister">取消</button></div></form></div></div></div><div id="toolbox" class="toolbox"><button id="toolboxToggle" class="toolbox-toggle" title="多多开工具箱"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></button><div id="toolboxPanel" class="toolbox-panel" style="display:none"><div class="toolbox-header"><h3>多多开工具箱</h3><button id="toolboxClose" class="toolbox-close">&times;</button></div><div class="toolbox-content"><div class="tool-item" id="linkConverterTool"><div class="tool-icon">🔗</div><div class="tool-info"><div class="tool-title">链接转换</div><div class="tool-desc">普通商品链接转微信小程序链接</div></div></div></div></div></div><script type="module" src="dashboard.js"></script></body></html>
