<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WordFlow AI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              glass: {
                border: 'rgba(255, 255, 255, 0.1)',
                surface: 'rgba(20, 20, 30, 0.6)',
                highlight: 'rgba(255, 255, 255, 0.05)',
              }
            },
            animation: {
              'aurora': 'aurora 20s linear infinite',
              'aurora-light': 'auroraLight 25s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'slide-up-fade': 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 0.2s ease-in-out forwards',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              aurora: {
                '0%': { backgroundPosition: '50% 50%, 50% 50%' },
                '100%': { backgroundPosition: '350% 50%, 350% 50%' },
              },
              auroraLight: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              slideUpFade: {
                '0%': { transform: 'translateY(40px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --glass-blur: blur(20px);
        --neon-glow: 0 0 20px rgba(59, 130, 246, 0.15);
      }

      /* Legacy: keep holo-card for components that still use it; design system prefers .ds-card */
      .holo-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        backdrop-filter: var(--blur-glass, 20px);
        -webkit-backdrop-filter: var(--blur-glass, 20px);
      }
      html.dark .holo-card {
        background: var(--color-surface, rgba(15, 23, 42, 0.6));
        border: 1px solid var(--color-glass-border, rgba(255, 255, 255, 0.08));
        box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.3));
      }
      html.dark .holo-card:hover {
        background: var(--color-surface-variant, rgba(30, 41, 59, 0.7));
        border-color: var(--color-glass-highlight, rgba(255, 255, 255, 0.2));
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 0 15px rgba(139, 92, 246, 0.15);
      }
      html:not(.dark) .holo-card {
        background: var(--color-surface, rgba(255, 255, 255, 0.65));
        border: 1px solid var(--color-glass-border, rgba(255, 255, 255, 0.6));
        box-shadow: 0 4px 6px -1px rgba(148, 163, 184, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.5);
      }
      html:not(.dark) .holo-card:hover {
        background: rgba(255, 255, 255, 0.85);
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(148, 163, 184, 0.2);
      }

      .glass-input {
        backdrop-filter: blur(var(--blur-md, 12px));
        transition: all 0.3s ease;
      }
      html.dark .glass-input {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--color-glass-border);
        color: white;
      }
      html:not(.dark) .glass-input {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(226, 232, 240, 0.8);
        color: #1e293b;
      }
      .glass-input:focus {
        box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
      }

      .font-muse {
        font-family: 'Playfair Display', serif;
        line-height: 1.8;
        letter-spacing: 0.01em;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { border-radius: 10px; }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
      html:not(.dark) .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "path": "https://aistudiocdn.com/path@^0.12.7"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="ds-aura-bg"></div>
    <div class="ds-aura-overlay"></div>
    <div id="root" class="h-full relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
