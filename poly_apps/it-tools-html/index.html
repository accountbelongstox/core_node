<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Tools - Developer Utilities</title>
    <meta name="description" content="Collection of 88+ handy online tools for developers">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        [x-cloak] { display: none !important; }
        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .tool-card {
            transition: all 0.3s ease;
        }
        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50" x-data="appData()" x-init="init()">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-tools text-blue-600"></i> IT Tools
                    </h1>
                    <span class="text-sm text-gray-500">88+ Developer Utilities</span>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-2xl mx-8">
                    <div class="relative">
                        <input
                            type="text"
                            x-model="searchQuery"
                            @input="filterTools()"
                            placeholder="Search tools... (e.g., hash, convert, json)"
                            class="w-full px-4 py-2 pl-10 pr-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </div>

                <!-- Theme Toggle & Settings -->
                <div class="flex items-center space-x-4">
                    <button
                        @click="showSettings = !showSettings"
                        class="p-2 text-gray-600 hover:text-gray-900"
                    >
                        <i class="fas fa-cog"></i>
                    </button>
                    <a href="API_DOCUMENTATION.md" target="_blank" class="text-sm text-blue-600 hover:text-blue-800">
                        <i class="fas fa-book"></i> API Docs
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Settings Modal -->
    <div x-show="showSettings" x-cloak class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center" @click.self="showSettings = false">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4" @click.stop>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Settings</h2>
                <button @click="showSettings = false" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">API Base URL</label>
                    <input
                        type="text"
                        x-model="apiBaseUrl"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                        placeholder="https://api.si.12gm.com/it-tools/v1"
                    >
                    <p class="mt-1 text-xs text-gray-500">Configure the backend API endpoint</p>
                </div>
                <div>
                    <button @click="saveSettings()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                        Save Settings
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Category Filters -->
        <div class="mb-6 flex flex-wrap gap-2">
            <button
                @click="selectedCategory = 'all'; filterTools()"
                :class="selectedCategory === 'all' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'"
                class="px-4 py-2 rounded-lg border hover:shadow-md transition"
            >
                All Tools
            </button>
            <template x-for="category in categories" :key="category.id">
                <button
                    @click="selectedCategory = category.id; filterTools()"
                    :class="selectedCategory === category.id ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'"
                    class="px-4 py-2 rounded-lg border hover:shadow-md transition"
                >
                    <span x-text="category.icon"></span>
                    <span x-text="category.name"></span>
                    <span class="ml-1 text-xs" x-text="'(' + category.count + ')'"></span>
                </button>
            </template>
        </div>

        <!-- Tools Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" x-show="filteredTools.length > 0">
            <template x-for="tool in filteredTools" :key="tool.id">
                <div
                    class="tool-card bg-white rounded-lg shadow-md p-6 cursor-pointer"
                    @click="openTool(tool)"
                >
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-gray-900" x-text="tool.name"></h3>
                            <p class="text-sm text-gray-600 mt-1" x-text="tool.description"></p>
                        </div>
                        <div class="text-2xl ml-4" x-html="tool.icon"></div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span
                            class="category-badge"
                            :class="getCategoryColor(tool.category)"
                            x-text="getCategoryName(tool.category)"
                        ></span>
                        <i class="fas fa-arrow-right text-gray-400"></i>
                    </div>
                </div>
            </template>
        </div>

        <!-- No Results -->
        <div x-show="filteredTools.length === 0" x-cloak class="text-center py-12">
            <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
            <p class="text-xl text-gray-600">No tools found</p>
            <p class="text-sm text-gray-500 mt-2">Try adjusting your search or filter</p>
        </div>
    </main>

    <!-- Tool Modal -->
    <div x-show="selectedTool" x-cloak class="fixed inset-0 bg-black bg-opacity-50 z-50 overflow-y-auto" @click.self="closeTool()">
        <div class="min-h-screen px-4 py-8 flex items-center justify-center">
            <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-auto" @click.stop>
                <!-- Modal Header -->
                <div class="border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <span x-html="selectedTool?.icon" class="text-2xl"></span>
                        <h2 class="text-2xl font-bold" x-text="selectedTool?.name"></h2>
                    </div>
                    <button @click="closeTool()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-6 py-6" id="toolContainer">
                    <!-- Tool content will be dynamically loaded here -->
                    <div x-html="toolContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="fixed bottom-4 right-4 space-y-2 z-50">
        <template x-for="(toast, index) in toasts" :key="index">
            <div
                x-show="toast.visible"
                x-transition
                class="bg-white rounded-lg shadow-lg p-4 max-w-sm"
                :class="toast.type === 'error' ? 'border-l-4 border-red-500' : 'border-l-4 border-green-500'"
            >
                <div class="flex items-start">
                    <i :class="toast.type === 'error' ? 'fas fa-exclamation-circle text-red-500' : 'fas fa-check-circle text-green-500'" class="mt-1 mr-3"></i>
                    <div>
                        <p class="font-semibold" x-text="toast.title"></p>
                        <p class="text-sm text-gray-600" x-text="toast.message"></p>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script src="app.js"></script>
    <script src="tools.js"></script>
</body>
</html>
