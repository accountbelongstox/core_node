# GoFrame Configuration File
# GoFrame 配置文件

server:
  address: ":8080"
  serverRoot: "resource/public"
  dumpRouterMap: true
  routeOverWrite: true
  accessLogEnabled: true
  errorLogEnabled: true
  pprofEnabled: false
  logPath: "logs"
  logStdout: true
  errorStack: true
  graceful: true

# Database configuration
database:
  default:
    type: "sqlite"
    link: "sqlite::@file(appfactory.db)"
    debug: true
    charset: "utf8mb4"
    dryRun: false
    maxIdle: 10
    maxOpen: 100
    maxLifetime: 30

# Logger configuration
logger:
  path: "logs"
  level: "all"
  stdout: true
  ctxKeys: ["RequestId", "UserId"]

# JWT configuration
jwt:
  secret: "your-super-secret-key-change-in-production"
  expire: 86400  # 24 hours in seconds

# CORS configuration
cors:
  allowOrigin: "*"
  allowMethods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
  allowHeaders: "Content-Type,Authorization,X-Requested-With"
  exposeHeaders: ""
  maxAge: 3600
  allowCredentials: true
