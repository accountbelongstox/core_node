<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>老挝靶场</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'mil-base': 'var(--mil-base)', 
              'mil-light': 'var(--mil-light)', 
              'tac-orange': '#f97316', 
              'tac-green': '#10b981', 
              'tac-red': '#ef4444', 
              'tac-gold': '#eab308', 
              'tac-cyan': '#06b6d4', 
            },
            textColor: {
              'mil-base': 'var(--text-main)',
              'mil-muted': 'var(--text-muted)',
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
              sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 3s linear infinite',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Mode (Arctic Tactical) */
        --mil-base: #f8fafc; /* Slate 50 */
        --mil-light: #e2e8f0; /* Slate 200 */
        --text-main: #0f172a; /* Slate 900 */
        --text-muted: #64748b; /* Slate 500 */
        
        /* Safe Area Variables */
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      .dark {
        /* Dark Mode (Night Ops) */
        --mil-base: #0b1120;
        --mil-light: #1e293b;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
      }

      body {
        /* Prevent elastic scrolling on iOS */
        overscroll-behavior-y: none;
        background-color: var(--mil-base);
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: var(--mil-base); }
      ::-webkit-scrollbar-thumb { background: var(--mil-light); }
      ::-webkit-scrollbar-thumb:hover { background: #f97316; }
      
      .clip-corner { clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%); }
      .clip-corner-top { clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 0 15%); }
      .clip-hex { clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%); }
      
      .bg-grid-pattern {
        background-image: linear-gradient(to right, var(--mil-light) 1px, transparent 1px),
                          linear-gradient(to bottom, var(--mil-light) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* Capacitor Safe Area Utilities */
      .pt-safe { padding-top: var(--sat); }
      .pb-safe { padding-bottom: var(--sab); }
      .pl-safe { padding-left: var(--sal); }
      .pr-safe { padding-right: var(--sar); }
      
      .top-safe { top: var(--sat); }
      .bottom-safe { bottom: var(--sab); }
      
      .h-safe-header { height: calc(4rem + var(--sat)); }
      .pt-safe-offset { padding-top: calc(4rem + var(--sat)); }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@capacitor/cli": "https://aistudiocdn.com/@capacitor/cli@^7.4.4",
    "@capacitor/geolocation": "https://aistudiocdn.com/@capacitor/geolocation@^7.1.6",
    "@capacitor/camera": "https://aistudiocdn.com/@capacitor/camera@^7.0.2",
    "@capacitor/filesystem": "https://aistudiocdn.com/@capacitor/filesystem@^7.1.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-mil-base text-mil-base antialiased overflow-x-hidden selection:bg-tac-orange selection:text-white transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
