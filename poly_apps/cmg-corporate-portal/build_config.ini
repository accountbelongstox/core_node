# Build Configuration for app_wuy
# This file defines compilation settings for the wuy application

[app_info]
app_name = cmg_club
display_name_chinese = CMG靶场&酒店
display_name_english = CMG-Shooting&Hotel
description = Interactive story and content application

[package_settings]
# Whether to generate random package ID (true/false)
random_package_id = false
# Default package ID (used when random_package_id is false)
default_package_id = com.ddsj.cmg.club
# Whether to generate random app display name (true/false)
random_display_name = false

[build_settings]
# Target platforms for compilation (android/ios/windows/web/all)
build_platforms = android
# Whether to use external resource directory (true/false)
use_external_resources = true
# Whether to apply image compression and optimization (true/false)
optimize_images = true
# Whether to use external safe build (copies project to build directory)
use_external_safe_build = true

[resources]
# Resource files use defaults if not specified:
# icon_file = icon.png (default)
# small_icon_file = notification_icon.png (default)
# splash_screen_file = splash.png (default)
# background_image_file = background.png (default)
# Uncomment and modify to override defaults:
# icon_file = wuy_icon.png
# small_icon_file = wuy_notification.png

[external_resources]
# External resource directory structure under D:\programing\.build_dir\build_apps_static_resources\app_wuy\
# icon/ - Contains icon files
# splash/ - Contains splash screen files
# background/ - Contains background images
# assets/ - Contains other static assets

[splash_config]
# Splash screen configuration (leave empty to use defaults)
# Basic colors
# color = #667eea
# color_dark = #121212

# Background images (auto-detected from app assets if not specified)
background_image = ""
background_image_dark = ""

# Splash logo/image
# image = assets/common/launch/splash_logo.png
# image_dark = assets/common/launch/splash_logo_dark.png

# Branding configuration
# branding = assets/common/launch/branding.png
# branding_dark = assets/common/launch/branding_dark.png
# branding_mode = bottom
# branding_bottom_padding = 24

# Android 12+ configuration
# android_12_color = #667eea
# android_12_color_dark = #121212
# android_12_icon_background_color = #667eea
# android_12_icon_background_color_dark = #121212
# android_12_image = assets/common/launch/splash_logo.png
# android_12_image_dark = assets/common/launch/splash_logo_dark.png

# Platform toggles
# android = true
# ios = true
# web = true

# Image positioning
# android_gravity = fill
# ios_content_mode = center
# web_image_mode = center

# Fullscreen mode
# fullscreen = true

# Platform-specific colors (optional)
color_android = #667eea
color_dark_android = #121212
color_ios = #667eea
color_dark_ios = #121212
color_web = #667eea
color_dark_web = #121212
