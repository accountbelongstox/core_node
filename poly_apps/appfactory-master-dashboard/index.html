    <!-- 
      Font Loading Strategy:
      - Using @fontsource/inter npm package (imported in index.tsx)

        2. jsDelivr/unpkg CDN (if using CDN) - accessible in China
      
      Alternative options:
      - Local hosting: Place fonts in public/fonts/ and use /fonts/inter.css
      - Manual download: Run ./scripts/download-inter-fonts.sh
      - Google Fonts CDN: https://fonts.googleapis.com/css2?family=Inter (may be slow in China)
    -->
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      body.dark {
        background-color: #0f172a;
      }
    </style>
