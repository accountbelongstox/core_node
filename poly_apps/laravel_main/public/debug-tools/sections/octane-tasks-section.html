    <!-- NAMESPACE: Octane Timer Tasks Section -->
    <div id="octane-tasks-section" class="content-section">
        <div class="card">
            <div class="card-header">
                <h2>Octane Timer Tasks Status</h2>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #666;">Monitor and manage Octane timer
                    tasks</p>
            </div>
            <div class="card-body">
                <!-- Summary Cards -->
                <div
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px;">
                    <div
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #28a745;">
                        <div style="color: #666; font-size: 12px; margin-bottom: 5px;">Timer Status</div>
                        <div id="timer-status" style="font-size: 20px; font-weight: 600; color: #2c3e50;">
                            ...</div>
                    </div>
                    <div
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #007bff;">
                        <div style="color: #666; font-size: 12px; margin-bottom: 5px;">Total Tasks</div>
                        <div id="total-tasks" style="font-size: 20px; font-weight: 600; color: #2c3e50;">...
                        </div>
                    </div>
                    <div
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #17a2b8;">
                        <div style="color: #666; font-size: 12px; margin-bottom: 5px;">Running Tasks</div>
                        <div id="running-tasks" style="font-size: 20px; font-weight: 600; color: #2c3e50;">
                            ...</div>
                    </div>
                    <div
                        style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #ffc107;">
                        <div style="color: #666; font-size: 12px; margin-bottom: 5px;">Total Ticks</div>
                        <div id="total-ticks" style="font-size: 20px; font-weight: 600; color: #2c3e50;">...
                        </div>
                    </div>
                </div>

                <!-- Heartbeat Status -->
                <div id="heartbeat-status"
                    style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 15px; margin-bottom: 20px; display: none;">
                    <div style="font-weight: 600; color: #856404; margin-bottom: 5px;">⏱️ Heartbeat</div>
                    <div id="heartbeat-details" style="color: #856404; font-size: 13px;"></div>
                </div>

                <!-- Task List -->
                <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0; font-size: 16px; font-weight: 600;">Task List</h3>
                    <button onclick="OctaneTasksManager.refresh()"
                        style="padding: 6px 14px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">🔄
                        Refresh</button>
                </div>

                <div id="tasks-list-container" style="background: #f8f9fa; border-radius: 6px; padding: 15px;">
                    <div style="text-align: center; color: #666; padding: 20px;">Loading tasks...</div>
                </div>
            </div>
        </div>
    </div>
