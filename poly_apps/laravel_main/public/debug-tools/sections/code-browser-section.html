    <!-- NAMESPACE: Code Browser Section -->
    <div id="code-browser-section" class="content-section">
        <div class="card">
            <div class="card-header">
                <h2>Code Browser - Core Node Directory</h2>
                <p id="code-browser-path-display"
                    style="margin: 8px 0 0 0; font-size: 13px; color: #666; font-family: monospace;"></p>
            </div>
            <div class="card-body" style="padding: 0;">
                <div id="code-browser-auth-check" style="padding: 25px; text-align: center; display: none;">
                    <p style="color: #dc3545; font-size: 18px; margin-bottom: 20px;">🔒 Authentication
                        Required</p>
                    <p style="color: #666; margin-bottom: 20px;">Please login to access the code browser</p>
                    <button onclick="AuthHelper.showAuthModal()"
                        style="padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;">Login
                        Now</button>
                </div>
                <div id="code-browser-content" style="display: none;">
                    <!-- Upper Panel: File Browser & Editor -->
                    <div class="code-browser-container">
                        <!-- File Tree (Left Panel) -->
                        <div id="file-tree-panel" class="file-tree-panel">
                            <div style="padding: 10px; border-bottom: 1px solid #333; background: #2d2d30;">
                                <div style="display: flex; align-items: center; justify-content: space-between;">
                                    <span style="font-weight: 500; font-size: 13px;">📁 core_node</span>
                                    <button onclick="CodeBrowser.refreshTree()"
                                        style="background: transparent; border: none; color: #cccccc; cursor: pointer; font-size: 16px; padding: 2px 6px;"
                                        title="Refresh">🔄</button>
                                </div>
                            </div>
                            <div id="file-tree" style="padding: 5px; font-size: 13px;">
                                <div style="padding: 20px; text-align: center; color: #888;">Loading...
                                </div>
                            </div>
                        </div>

                        <!-- Code Editor (Right Panel) -->
                        <div class="code-editor-panel">
                            <div
                                style="padding: 10px; border-bottom: 1px solid #333; background: #2d2d30; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <span id="current-file-path"
                                        style="font-size: 13px; color: #cccccc; font-family: monospace;">No
                                        file selected</span>
                                    <span id="file-status"
                                        style="margin-left: 15px; font-size: 12px; color: #888;"></span>
                                </div>
                                <div>
                                    <button id="save-file-btn" onclick="CodeBrowser.saveFile()"
                                        style="background: #0e639c; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 5px; display: none;">💾
                                        Save</button>
                                    <button onclick="CodeBrowser.closeFile()"
                                        style="background: #dc3545; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;"
                                        id="close-file-btn" disabled>✕ Close</button>
                                </div>
                            </div>
                            <div id="code-editor-container" style="flex: 1; overflow: hidden;">
                                <textarea id="code-editor"
                                    style="width: 100%; height: 100%; padding: 15px; background: #1e1e1e; color: #d4d4d4; border: none; outline: none; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; line-height: 1.6; resize: none; tab-size: 4;"
                                    placeholder="Select a file to edit..." readonly></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Lower Panel: Tasks/Prompts & Mapping Manager -->
                    <div class="prompts-container">
                        <!-- Tasks/Prompts List (Left Panel) -->
                        <div id="prompts-tasks-panel" class="prompts-panel">
                            <div style="padding: 10px; border-bottom: 1px solid #333; background: #2d2d30;">
                                <div
                                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                                    <span style="font-weight: 500; font-size: 13px;">📝 Tasks/Prompts</span>
                                    <div>
                                        <button onclick="PromptsTasksManager.showNewTaskDialog()"
                                            style="background: transparent; border: none; color: #28a745; cursor: pointer; font-size: 14px; padding: 2px 6px;"
                                            title="New Task">+</button>
                                        <button onclick="PromptsTasksManager.refresh()"
                                            style="background: transparent; border: none; color: #cccccc; cursor: pointer; font-size: 16px; padding: 2px 6px;"
                                            title="Refresh">🔄</button>
                                    </div>
                                </div>
                                <!-- Category Selector -->
                                <select id="prompt-category-selector"
                                    style="width: 100%; background: #1e1e1e; color: #d4d4d4; border: 1px solid #3c3c3c; padding: 5px; font-size: 12px; border-radius: 3px;">
                                    <option value="global">Global</option>
                                    <option value="mcp-dev">MCP Development</option>
                                    <option value="ncore-dev">NCORE Development</option>
                                    <option value="pycore-dev">PYCORE Development</option>
                                    <option value="laravel-main-dev">Laravel Main</option>
                                    <option value="nuxt-dev">NUXT Development</option>
                                </select>
                            </div>
                            <div id="prompts-tasks-list" style="padding: 5px; font-size: 13px;">
                                <div style="padding: 20px; text-align: center; color: #888;">Select a
                                    category</div>
                            </div>
                        </div>

                        <!-- Prompt Mapping Manager (Right Panel) -->
                        <div id="prompt-mapping-panel-embedded" class="mapping-panel"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
