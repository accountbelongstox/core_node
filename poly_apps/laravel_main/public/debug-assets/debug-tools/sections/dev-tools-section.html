<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Development Tools</title>
    <link rel="stylesheet" href="/debug-assets/css/tailwind.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden m-4">
        <div class="bg-gradient-to-r from-violet-600 to-purple-600 px-6 py-4">
            <h2 class="text-2xl font-bold text-white">Development Tools</h2>
        </div>
        <div class="p-0">
            <div class="ittools-container flex flex-col h-[calc(100vh-200px)]">
                <div class="ittools-top-menu flex items-center gap-2 p-4 bg-gray-800 border-b border-gray-700">
                    <button class="ittools-top-menu-item px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium" data-top-menu-id="tools">🛠️ Tools</button>
                    <button class="ittools-top-menu-item px-4 py-2 bg-gray-700 text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-600 transition-colors" data-top-menu-id="favorites">⭐ Favorites</button>
                    <button class="ittools-top-menu-item px-4 py-2 bg-gray-700 text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-600 transition-colors" data-top-menu-id="recent">🕐 Recent</button>

                    <div class="ittools-search-wrapper flex-1 ml-4 relative">
                        <input type="text" id="ittools-search-input" class="w-full px-4 py-2 bg-gray-700 text-gray-200 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50" placeholder="Search tools...">
                        <button class="ittools-search-clear absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors" data-action="clear-search">×</button>
                    </div>
                </div>

                <div class="ittools-top-dropdown-container hidden" id="ittools-top-dropdown-menu"></div>

                <div class="ittools-body flex flex-1 overflow-hidden">
                    <div class="ittools-left-menu w-64 border-r border-gray-300 bg-gray-50 overflow-auto" id="ittools-dynamic-menu"></div>

                    <div class="ittools-content-wrapper flex-1 overflow-auto relative">
                        <button class="ittools-menu-collapse-btn fixed top-20 left-64 z-10 bg-gray-700 text-white px-2 py-1 rounded-r-lg hover:bg-gray-600 transition-colors" id="ittools-menu-collapse-btn" data-action="toggle-menu">▶</button>
                        
                        <div class="ittools-main-content p-6" id="ittools-main-content">
                            <div class="ittools-card bg-white rounded-lg shadow p-6">
                                <div class="ittools-card-header text-xl font-bold text-gray-800 mb-4">Welcome to Development Tools</div>
                                <div class="ittools-card-body text-gray-600">
                                    <p class="mb-4">Select a tool from the left menu to get started.</p>
                                    <p class="ittools-category-intro font-semibold text-gray-700 mb-2">Available categories:</p>
                                    <ul class="list-disc list-inside space-y-1 text-sm">
                                        <li>Text Tools</li>
                                        <li>Converters</li>
                                        <li>Formatters</li>
                                        <li>Generators</li>
                                        <li>Crypto Tools</li>
                                        <li>And more...</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
