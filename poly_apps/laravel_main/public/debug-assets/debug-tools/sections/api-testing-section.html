<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Testing Dashboard</title>
    <link rel="stylesheet" href="/debug-assets/css/tailwind.min.css">
</head>
<!-- Built-in section: API Testing only. All other management features developed in poly_apps/pycore_laravel_wordnew_ui/. -->
<body class="min-h-screen bg-gray-50 p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4">
                <h2 class="text-2xl font-bold text-white">API Testing Dashboard</h2>
            </div>
            <div class="p-6">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Select Application:</label>
                    <select id="app-select" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white text-gray-900">
                        <option value="">Choose an app to test its APIs</option>
                    </select>
                </div>

                <div class="mb-6" id="api-search-container">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">🔍 Search APIs:</label>
                    <input type="text" id="api-search" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white text-gray-900" placeholder="Type to search APIs by path, description, or number...">
                    <small class="block mt-2 text-xs text-gray-500">
                        Search by API number (e.g., "1"), path (e.g., "initialize"), or description.
                        Best match will be automatically highlighted and scrolled to.
                    </small>
                </div>

                <div id="shared-headers-container" class="hidden mb-6"></div>

                <div id="api-list" class="space-y-4">
                    <p class="text-center text-gray-500 py-8">
                        Select an application to view and test its available APIs
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/debug-assets/js/api-client.js"></script>
    <script src="/debug-assets/js/template-utils.js"></script>
    <script src="/debug-assets/js/api-utils.js"></script>
    <script src="/debug-assets/js/dom-utils.js"></script>
    <script src="/debug-assets/js/api-testing-section.js"></script>
</body>
</html>
