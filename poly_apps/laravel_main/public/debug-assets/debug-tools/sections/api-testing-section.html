<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Testing Dashboard</title>
    
    <link rel="stylesheet" href="/debug-assets/css/debug-interface.css">
    <link rel="stylesheet" href="/debug-assets/css/api-testing-section.css">
</head>
<body>
    <div class="content-body">
        <div class="card">
            <div class="card-header">
                <h2>API Testing Dashboard</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">Select Application:</label>
                    <select id="app-select" class="form-control">
                        <option value="">Choose an app to test its APIs</option>
                    </select>
                </div>

                <div class="form-group" id="api-search-container">
                    <label class="form-label">🔍 Search APIs:</label>
                    <input type="text" id="api-search" class="form-control" placeholder="Type to search APIs by path, description, or number...">
                    <small class="api-search-hint">
                        Search by API number (e.g., "1"), path (e.g., "initialize"), or description.
                        Best match will be automatically highlighted and scrolled to.
                    </small>
                </div>

                <div id="shared-headers-container" class="shared-headers-container hidden"></div>

                <div id="api-list" class="api-list">
                    <p class="api-list-empty">
                        Select an application to view and test its available APIs
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/debug-assets/js/api-client.js"></script>
    <script src="/debug-assets/js/api-testing-section.js"></script>
</body>
</html>
