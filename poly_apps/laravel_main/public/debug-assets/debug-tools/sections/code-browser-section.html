<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Browser</title>
    <link rel="stylesheet" href="/debug-assets/css/tailwind.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden m-4">
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 px-6 py-4">
            <h2 class="text-2xl font-bold text-white">Code Browser - Core Node Directory</h2>
            <p id="code-browser-path-display" class="mt-2 text-sm text-purple-100 font-mono"></p>
        </div>
        <div class="p-0">
            <div id="code-browser-auth-check" class="hidden p-6 text-center">
                <p class="text-red-600 text-lg font-semibold mb-5">🔒 Authentication Required</p>
                <p class="text-gray-600 mb-5">Please login to access the code browser</p>
                <button onclick="AuthHelper.showAuthModal()" class="px-6 py-3 bg-blue-600 text-white rounded-lg cursor-pointer text-sm font-semibold hover:bg-blue-700 transition-colors">Login Now</button>
            </div>
            <div id="code-browser-content" class="hidden">
                <div class="flex flex-col h-[calc(100vh-200px)]">
                    <div class="flex flex-1 border-b border-gray-300">
                        <div id="file-tree-panel" class="w-64 border-r border-gray-300 bg-gray-50 flex flex-col">
                            <div class="px-3 py-2.5 border-b border-gray-300 bg-gray-800">
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-sm text-gray-200">📁 core_node</span>
                                    <button onclick="CodeBrowser.refreshTree()" class="bg-transparent border-none text-gray-300 cursor-pointer text-base px-1.5 py-0.5 hover:text-white transition-colors" title="Refresh">🔄</button>
                                </div>
                            </div>
                            <div id="file-tree" class="flex-1 overflow-auto p-1.5 text-sm">
                                <div class="p-5 text-center text-gray-500">Loading...</div>
                            </div>
                        </div>

                        <div class="code-editor-panel flex-1 flex flex-col bg-gray-900">
                            <div class="px-3 py-2.5 border-b border-gray-700 bg-gray-800 flex justify-between items-center">
                                <div>
                                    <span id="current-file-path" class="text-sm text-gray-300 font-mono">No file selected</span>
                                    <span id="file-status" class="ml-4 text-xs text-gray-500"></span>
                                </div>
                                <div>
                                    <button id="save-file-btn" onclick="CodeBrowser.saveFile()" class="hidden bg-blue-600 text-white border-none px-3.5 py-1.5 rounded cursor-pointer text-sm mr-1.5 hover:bg-blue-700 transition-colors">💾 Save</button>
                                    <button onclick="CodeBrowser.closeFile()" id="close-file-btn" disabled class="bg-red-600 text-white border-none px-3.5 py-1.5 rounded cursor-pointer text-sm hover:bg-red-700 transition-colors">✕ Close</button>
                                </div>
                            </div>
                            <div id="code-editor-container" class="flex-1 overflow-hidden">
                                <textarea id="code-editor" class="w-full h-full p-4 bg-gray-900 text-gray-300 border-none outline-none font-mono text-sm leading-relaxed resize-none [tab-size:4]" placeholder="Select a file to edit..." readonly></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="prompts-container flex border-t border-gray-300 h-64">
                        <div id="prompts-tasks-panel" class="prompts-panel w-64 border-r border-gray-300 bg-gray-50 flex flex-col">
                            <div class="px-3 py-2.5 border-b border-gray-300 bg-gray-800">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="font-medium text-sm text-gray-200">📝 Tasks/Prompts</span>
                                    <div>
                                        <button onclick="PromptsTasksManager.showNewTaskDialog()" class="bg-transparent border-none text-green-400 cursor-pointer text-sm px-1.5 py-0.5 hover:text-green-300 transition-colors" title="New Task">+</button>
                                        <button onclick="PromptsTasksManager.refresh()" class="bg-transparent border-none text-gray-300 cursor-pointer text-base px-1.5 py-0.5 hover:text-white transition-colors" title="Refresh">🔄</button>
                                    </div>
                                </div>
                                <select id="prompt-category-selector" class="w-full bg-gray-900 text-gray-300 border border-gray-700 px-1.5 py-1 text-xs rounded">
                                    <option value="global">Global</option>
                                    <option value="mcp-dev">MCP Development</option>
                                    <option value="ncore-dev">NCORE Development</option>
                                    <option value="pycore-dev">PYCORE Development</option>
                                    <option value="laravel-main-dev">Laravel Main</option>
                                    <option value="nuxt-dev">NUXT Development</option>
                                </select>
                            </div>
                            <div id="prompts-tasks-list" class="flex-1 overflow-auto p-1.5 text-sm">
                                <div class="p-5 text-center text-gray-500">Select a category</div>
                            </div>
                        </div>

                        <div id="prompt-mapping-panel-embedded" class="mapping-panel flex-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
