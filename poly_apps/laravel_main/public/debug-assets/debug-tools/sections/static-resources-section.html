    <!-- NAMESPACE: Static Resources Section -->
    <div id="static-resources-section" class="content-section">
        <div class="card">
            <div class="card-header">
                <h2>Static Resources - Media Browser</h2>
                <p id="static-resources-path-display"
                    style="margin: 8px 0 0 0; font-size: 13px; color: #666; font-family: monospace;"></p>
            </div>
            <div class="card-body" style="padding: 0;">
                <div id="static-resources-content">
                    <div class="static-resources-container">
                        <!-- Mobile toggle button (Moved inside container) -->
                        <button id="mobile-file-list-toggle" class="mobile-file-list-toggle"
                            onclick="StaticResourceBrowser.toggleFileList()">📁</button>
                        <!-- File List Overlay (mobile) -->
                        <div id="file-list-overlay" class="file-list-overlay"
                            onclick="StaticResourceBrowser.toggleFileList()"></div>

                        <!-- File List (Left Panel - slides from left on mobile) -->
                        <div id="static-file-list-panel" class="static-file-list-panel">
                            <div class="static-file-list-header">
                                <div class="static-file-list-header-title">
                                    <span>🎬 Files</span>
                                    <span class="static-file-list-header-toggle"
                                        onclick="StaticResourceBrowser.toggleFileList()">◀</span>
                                </div>
                                <div class="static-file-list-header-actions">
                                    <button onclick="StaticResourceBrowser.showCreateDirDialog()"
                                        title="New Folder">📁+</button>
                                    <button onclick="StaticResourceBrowser.refreshList()" title="Refresh">🔄</button>
                                    <button onclick="StaticResourceBrowser.showUploadDialog()"
                                        title="Upload">📤</button>
                                </div>
                            </div>
                            <div id="static-file-list" class="static-file-list">
                                <div class="static-loading">Loading...</div>
                            </div>
                        </div>

                        <!-- Preview Panel (Right Panel) -->
                        <div class="static-preview-panel">
                            <!-- Video Settings Bar -->
                            <div id="video-settings-bar" class="video-settings-bar floating" style="display: none;">
                                <div class="video-settings-item">
                                    <input type="checkbox" id="video-auto-play-next" checked>
                                    <label for="video-auto-play-next">Auto-play</label>
                                </div>
                                <div class="video-settings-item">
                                    <label>Skip:</label>
                                    <input type="number" id="video-skip-intro" min="0" max="300" value="0">
                                    <span>s</span>
                                </div>
                                <button class="playlist-toggle-btn" onclick="StaticResourceBrowser.togglePlaylist()">
                                    <span>📋</span>
                                    <span id="playlist-count-badge">0</span>
                                </button>
                            </div>

                            <div class="static-preview-header">
                                <div class="static-preview-header-info">
                                    <span id="preview-file-name" class="static-preview-file-name">No file
                                        selected</span>
                                    <span id="preview-file-info" class="static-preview-file-meta"></span>
                                </div>
                                <div class="static-preview-controls" id="preview-controls"></div>
                            </div>
                            <div id="preview-container" class="static-preview-container">
                                <!-- Floating nav buttons for video -->
                                <div id="video-nav-left" class="video-nav-floating left">
                                    <button class="video-nav-btn large" id="video-prev-btn-float"
                                        onclick="StaticResourceBrowser.playPrevVideo()" disabled>⏮</button>
                                </div>
                                <div id="video-nav-right" class="video-nav-floating right">
                                    <button class="video-nav-btn large" id="video-next-btn-float"
                                        onclick="StaticResourceBrowser.playNextVideo()" disabled>⏭</button>
                                </div>
                                <div class="static-preview-empty">
                                    <div class="static-preview-empty-icon">📂</div>
                                    <p class="static-preview-empty-text">Select a file to preview</p>
                                    <p class="static-preview-empty-hint">Supports images, videos, audio, and
                                        text files</p>
                                </div>
                            </div>

                            <!-- Video Playlist (collapsible) -->
                            <div id="video-playlist-panel" class="video-playlist-panel">
                                <div class="video-playlist-header" onclick="StaticResourceBrowser.togglePlaylist()">
                                    <span>📋 Playlist <span id="video-playlist-count"></span></span>
                                    <span class="video-playlist-toggle">▲</span>
                                </div>
                                <div id="video-playlist"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
