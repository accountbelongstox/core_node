<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Manager</title>
    <link rel="stylesheet" href="/debug-assets/css/tailwind.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden m-4">
        <div class="bg-gradient-to-r from-cyan-600 to-teal-600 px-6 py-4">
            <h2 class="text-2xl font-bold text-white">MCP Manager</h2>
            <p class="mt-2 text-sm text-cyan-100">Manage MCP (Model Context Protocol) features and resources</p>
        </div>
        <div class="p-0">
            <div id="mcp-manager-content">
                <div class="flex h-[calc(100vh-200px)]">
                    <div class="mcp-menu w-64 border-r border-gray-300 bg-gray-50 flex flex-col">
                        <div class="px-4 py-3 bg-gray-800 text-gray-200 font-semibold">MCP Manager</div>
                        <div id="mcp-menu-container" class="flex-1 overflow-auto"></div>
                    </div>
                    <div class="mcp-content flex-1 overflow-auto bg-white">
                        <div id="mcp-content-container" class="p-6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/debug-assets/js/api-client.js"></script>
    <script src="/debug-assets/js/template-utils.js"></script>
    <script src="/debug-assets/js/mcp-manager.js"></script>
</body>
</html>
