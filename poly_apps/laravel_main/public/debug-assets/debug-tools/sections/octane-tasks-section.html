<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octane Timer Tasks</title>
    <link rel="stylesheet" href="/debug-assets/css/tailwind.min.css">
</head>
<body class="min-h-screen bg-gray-50 p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="bg-gradient-to-r from-orange-600 to-amber-600 px-6 py-4">
                <h2 class="text-2xl font-bold text-white">Octane Timer Tasks Status</h2>
                <p class="mt-2 text-sm text-orange-100">Monitor and manage Octane timer tasks</p>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="bg-gray-50 p-5 rounded-lg border-l-4 border-green-500">
                        <div class="text-gray-600 text-xs mb-1">Timer Status</div>
                        <div id="timer-status" class="text-xl font-semibold text-gray-800">...</div>
                    </div>
                    <div class="bg-gray-50 p-5 rounded-lg border-l-4 border-blue-500">
                        <div class="text-gray-600 text-xs mb-1">Total Tasks</div>
                        <div id="total-tasks" class="text-xl font-semibold text-gray-800">...</div>
                    </div>
                    <div class="bg-gray-50 p-5 rounded-lg border-l-4 border-cyan-500">
                        <div class="text-gray-600 text-xs mb-1">Running Tasks</div>
                        <div id="running-tasks" class="text-xl font-semibold text-gray-800">...</div>
                    </div>
                    <div class="bg-gray-50 p-5 rounded-lg border-l-4 border-yellow-500">
                        <div class="text-gray-600 text-xs mb-1">Total Ticks</div>
                        <div id="total-ticks" class="text-xl font-semibold text-gray-800">...</div>
                    </div>
                </div>

                <div id="heartbeat-status" class="hidden bg-yellow-50 border border-yellow-400 rounded-lg p-4 mb-5">
                    <div class="font-semibold text-yellow-800 mb-1">⏱️ Heartbeat</div>
                    <div id="heartbeat-details" class="text-yellow-700 text-sm"></div>
                </div>

                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Task List</h3>
                    <button onclick="OctaneTasksManager.refresh()" class="px-4 py-2 bg-blue-600 text-white rounded-lg cursor-pointer text-sm hover:bg-blue-700 transition-colors">🔄 Refresh</button>
                </div>

                <div id="octane-tasks-list" class="space-y-3">
                    <div class="text-center text-gray-500 py-8">Loading tasks...</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
