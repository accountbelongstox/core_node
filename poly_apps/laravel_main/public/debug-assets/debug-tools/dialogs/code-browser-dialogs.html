    <!-- Context Menu for File Tree -->
    <div id="file-context-menu"
        style="display: none; position: fixed; background: #252526; border: 1px solid #454545; box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 10000; min-width: 180px; border-radius: 4px; padding: 4px 0;">
        <div onclick="CodeBrowser.copyRelativePath()"
            style="padding: 8px 16px; cursor: pointer; color: #cccccc; font-size: 13px;"
            onmouseover="this.style.background='#094771'" onmouseout="this.style.background='transparent'"
            id="menu-copy-path">
            📋 Copy Relative Path
        </div>
        <div onclick="CodeBrowser.copyAbsolutePath()"
            style="padding: 8px 16px; cursor: pointer; color: #cccccc; font-size: 13px;"
            onmouseover="this.style.background='#094771'" onmouseout="this.style.background='transparent'"
            id="menu-copy-abspath">
            📋 Copy Absolute Path
        </div>
        <div onclick="CodeBrowser.renameItem()"
            style="padding: 8px 16px; cursor: pointer; color: #cccccc; font-size: 13px; border-top: 1px solid #454545;"
            onmouseover="this.style.background='#094771'" onmouseout="this.style.background='transparent'"
            id="menu-rename">
            ✏️ Rename
        </div>
        <div onclick="CodeBrowser.autoRenameToEnglish()"
            style="padding: 8px 16px; cursor: pointer; color: #4ec9b0; font-size: 13px;"
            onmouseover="this.style.background='#094771'" onmouseout="this.style.background='transparent'"
            id="menu-auto-rename">
            🔤 Auto Rename to English
        </div>
        <div onclick="CodeBrowser.translateChineseLines()"
            style="padding: 8px 16px; cursor: pointer; color: #4ec9b0; font-size: 13px; border-top: 1px solid #454545;"
            onmouseover="this.style.background='#094771'" onmouseout="this.style.background='transparent'"
            id="menu-translate">
            🌐 Translate Chinese Lines
        </div>
        <div onclick="CodeBrowser.deleteFile()"
            style="padding: 8px 16px; cursor: pointer; color: #f48771; font-size: 13px; border-top: 1px solid #454545;"
            onmouseover="this.style.background='#5a1d1d'" onmouseout="this.style.background='transparent'"
            id="menu-delete">
            🗑️ Delete
        </div>
        <div onclick="CodeBrowser.restoreFile()"
            style="padding: 8px 16px; cursor: pointer; color: #4ec9b0; font-size: 13px; border-top: 1px solid #454545; display: none;"
            onmouseover="this.style.background='#094771'" onmouseout="this.style.background='transparent'"
            id="menu-restore">
            ♻️ Restore
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirm-dialog"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 20000; align-items: center; justify-content: center;">
        <div
            style="background: #252526; border: 1px solid #454545; border-radius: 6px; min-width: 400px; max-width: 500px; box-shadow: 0 4px 16px rgba(0,0,0,0.8);">
            <div style="padding: 20px 24px; border-bottom: 1px solid #454545;">
                <h3 id="confirm-title" style="margin: 0; color: #cccccc; font-size: 16px; font-weight: 500;">Confirm
                </h3>
            </div>
            <div style="padding: 24px;">
                <p id="confirm-message" style="margin: 0; color: #d4d4d4; font-size: 14px; line-height: 1.6;"></p>
            </div>
            <div
                style="padding: 16px 24px; border-top: 1px solid #454545; display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="CodeBrowser.closeConfirmDialog()"
                    style="padding: 8px 20px; background: #3c3c3c; color: #cccccc; border: 1px solid #454545; border-radius: 4px; cursor: pointer; font-size: 13px;"
                    onmouseover="this.style.background='#505050'"
                    onmouseout="this.style.background='#3c3c3c'">Cancel</button>
                <button id="confirm-ok-btn" onclick="CodeBrowser.confirmDialogOk()"
                    style="padding: 8px 20px; background: #0e639c; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;"
                    onmouseover="this.style.background='#1177bb'"
                    onmouseout="this.style.background='#0e639c'">OK</button>
            </div>
        </div>
    </div>

    <!-- Rename Dialog -->
    <div id="rename-dialog"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 20000; align-items: center; justify-content: center;">
        <div
            style="background: #252526; border: 1px solid #454545; border-radius: 6px; min-width: 400px; max-width: 500px; box-shadow: 0 4px 16px rgba(0,0,0,0.8);">
            <div style="padding: 20px 24px; border-bottom: 1px solid #454545;">
                <h3 style="margin: 0; color: #cccccc; font-size: 16px; font-weight: 500;">Rename</h3>
            </div>
            <div style="padding: 24px;">
                <input id="rename-input" type="text"
                    style="width: 100%; padding: 10px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #454545; border-radius: 4px; font-size: 14px; font-family: 'Consolas', monospace;"
                    placeholder="Enter new name...">
            </div>
            <div
                style="padding: 16px 24px; border-top: 1px solid #454545; display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="CodeBrowser.closeRenameDialog()"
                    style="padding: 8px 20px; background: #3c3c3c; color: #cccccc; border: 1px solid #454545; border-radius: 4px; cursor: pointer; font-size: 13px;"
                    onmouseover="this.style.background='#505050'"
                    onmouseout="this.style.background='#3c3c3c'">Cancel</button>
                <button onclick="CodeBrowser.executeRename()"
                    style="padding: 8px 20px; background: #0e639c; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;"
                    onmouseover="this.style.background='#1177bb'"
                    onmouseout="this.style.background='#0e639c'">Rename</button>
            </div>
        </div>
    </div>
