<div class="api-item bg-white rounded-lg shadow-md mb-4 overflow-hidden" id="api-item-{index}">
    <div class="api-number bg-gradient-to-r from-blue-500 to-indigo-600 text-white text-sm font-bold px-3 py-1">#{number}</div>
    <div class="api-header cursor-pointer hover:bg-gray-50 px-4 py-3 border-b border-gray-200 flex items-center justify-between" data-index="{index}" data-app-name="{appName}" data-endpoint="{endpoint}">
        <div class="flex items-center gap-2 flex-wrap">
            <span class="api-method method-{method} px-2 py-1 rounded text-xs font-semibold uppercase {method}">{method}</span>
            <strong class="api-endpoint text-gray-900 font-semibold">{endpoint}</strong>
            <span class="text-gray-600">{description}</span>
        </div>
        <span id="toggle-{index}" class="text-gray-400">▼</span>
    </div>
    <div id="details-{index}" class="api-details hidden p-4 bg-gray-50">
        <div class="feature-docs-container mb-4"></div>
        {headersInfo}
        <div class="form-group mb-4">
            <label class="form-label block text-sm font-semibold text-gray-700 mb-2">API Endpoint URL:</label>
            <input type="text" id="url-{index}" class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 bg-white text-gray-900" value="{fullUrl}">
        </div>
        <div class="form-group mb-4">
            <label class="form-label block text-sm font-semibold text-gray-700 mb-2">Request Parameters (JSON):</label>
            <textarea id="params-{index}" class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 bg-white text-gray-900 font-mono text-sm" placeholder="Enter JSON parameters" rows="6">{presetJson}</textarea>
        </div>
        <div class="btn-group flex gap-2 mb-4">
            <button class="btn btn-primary bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="test-api" data-index="{index}" data-method="{method}" data-app-name="{appName}" data-endpoint="{endpoint}">Send Request</button>
            <button class="btn btn-secondary bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="save-params" data-index="{index}" data-app-name="{appName}" data-endpoint="{endpoint}" data-method="{method}">Save Params</button>
            <button class="btn btn-secondary bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="load-params" data-index="{index}" data-app-name="{appName}" data-endpoint="{endpoint}">Load Params</button>
            <button class="btn btn-success bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="copy-headers" data-index="{index}" data-app-name="{appName}">Copy Headers</button>
        </div>
        <div id="response-{index}" class="response-area hidden"></div>
    </div>
</div>
