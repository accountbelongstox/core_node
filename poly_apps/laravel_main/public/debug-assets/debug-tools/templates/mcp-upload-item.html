<div class="mcp-upload-item bg-gray-800 border border-gray-700 rounded-md p-3 mb-2" data-index="{index}">
    <div class="flex justify-between items-center gap-3 flex-wrap">
        <div>
            <div class="font-semibold text-white">Screenshot {index}</div>
            <div class="text-gray-400 text-xs">{name} • {size}</div>
        </div>
    </div>
    <input type="text" class="mcp-ss-upload-desc-input mt-2 w-full p-2 rounded border border-gray-600 bg-gray-900 text-gray-200" data-index="{index}" placeholder="Optional description for this image">
</div>
