<div class="ittools-card">
    <div class="ittools-card-header">Numeronym Generator (i18n → i12n)</div>
    <div class="ittools-card-body">
        <div class="ittools-form-group">
            <label class="ittools-label">Input Text:</label>
            <textarea 
                id="numeronym-input" 
                class="ittools-textarea" 
                rows="6" 
                placeholder="internationalization&#10;localization&#10;accessibility"
                data-input="numeronym-input"
            ></textarea>
        </div>
        <div class="ittools-btn-group">
            <button 
                class="ittools-btn ittools-btn-primary" 
                data-action="generate-numeronym"
            >
                🔢 Generate Numeronym
            </button>
        </div>
        <div id="numeronym-result" class="ittools-result text-result hidden"></div>
    </div>
</div>
