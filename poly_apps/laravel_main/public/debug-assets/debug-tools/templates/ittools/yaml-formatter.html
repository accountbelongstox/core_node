<div class="ittools-card">
    <div class="ittools-card-header">YAML Formatter & Beautifier</div>
    <div class="ittools-card-body">
        <div class="ittools-form-group">
            <label class="ittools-label">YAML Input:</label>
            <textarea 
                id="yaml-format-input" 
                class="ittools-textarea" 
                rows="10" 
                placeholder="key: value"
                data-input="yaml-input"
            ></textarea>
        </div>
        <div class="ittools-btn-group">
            <button 
                class="ittools-btn ittools-btn-primary" 
                data-action="format-yaml"
            >
                ✨ Format YAML
            </button>
        </div>
        <div id="yaml-format-result" class="ittools-result formatter-result hidden"></div>
    </div>
</div>
