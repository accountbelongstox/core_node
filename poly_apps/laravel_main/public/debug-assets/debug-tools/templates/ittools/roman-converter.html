<div class="ittools-card">
    <div class="ittools-card-header">Roman Numeral Converter</div>
    <div class="ittools-card-body">
        <div class="ittools-form-group">
            <label class="ittools-label">Input:</label>
            <input 
                type="text" 
                id="roman-input" 
                class="ittools-input" 
                placeholder="42 or XLII"
                data-input="roman-input"
            >
        </div>
        <div class="ittools-btn-group">
            <button 
                class="ittools-btn ittools-btn-primary" 
                data-action="convert-roman"
            >
                🔄 Convert
            </button>
        </div>
        <div id="roman-result" class="ittools-result converter-result hidden"></div>
    </div>
</div>
