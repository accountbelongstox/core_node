<div class="ittools-card">
    <div class="ittools-card-header">XML Formatter & Beautifier</div>
    <div class="ittools-card-body">
        <div class="ittools-form-group">
            <label class="ittools-label">XML Input:</label>
            <textarea 
                id="xml-input" 
                class="ittools-textarea" 
                rows="10" 
                placeholder="<root><item>value</item></root>"
                data-input="xml-input"
            ></textarea>
        </div>
        <div class="ittools-btn-group">
            <button 
                class="ittools-btn ittools-btn-primary" 
                data-action="format-xml"
            >
                ✨ Format XML
            </button>
        </div>
        <div id="xml-result" class="ittools-result formatter-result hidden"></div>
    </div>
</div>
