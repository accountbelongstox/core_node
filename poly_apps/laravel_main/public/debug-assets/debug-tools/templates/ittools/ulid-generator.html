<div class="ittools-card">
    <div class="ittools-card-header">ULID Generator</div>
    <div class="ittools-card-body">
        <div class="ittools-form-group">
            <label class="ittools-label">Number of ULIDs:</label>
            <input 
                type="number" 
                id="ulid-count" 
                class="ittools-input" 
                value="5" 
                min="1" 
                max="100"
                data-input="ulid-count"
            >
        </div>
        <div class="ittools-btn-group">
            <button 
                class="ittools-btn ittools-btn-primary" 
                data-action="generate-ulid"
            >
                🆔 Generate ULIDs
            </button>
        </div>
        <div id="ulid-result" class="ittools-result crypto-result hidden"></div>
    </div>
</div>
