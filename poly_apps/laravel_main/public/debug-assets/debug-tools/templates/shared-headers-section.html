<div class="card shared-headers-card bg-white rounded-lg shadow-md mb-6">
    <div class="card-header shared-headers-header bg-gradient-to-r from-purple-500 to-indigo-600 px-6 py-4 rounded-t-lg">
        <h3 class="shared-headers-title text-xl font-bold text-white mb-2">{appName} - Shared Headers</h3>
        <p class="shared-headers-description text-purple-100 text-sm">
            Edit these values to use across all {appName} APIs. Changes are automatically cached.
        </p>
    </div>
    <div class="card-body p-6">
        <div class="form-group">
            <div id="shared-headers-{appName}" class="shared-headers-grid grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
        <div class="shared-headers-actions mt-4 flex gap-2">
            <div class="btn-group flex gap-2">
                <button class="btn btn-success bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="save-headers-server" data-app-name="{appName}">Save All Headers</button>
                <button class="btn btn-secondary bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="reset-headers-server" data-app-name="{appName}">Reset to Defaults</button>
                <button class="btn btn-primary bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium transition-colors" data-action="copy-headers-json" data-app-name="{appName}">Copy Headers JSON</button>
            </div>
        </div>
    </div>
</div>
