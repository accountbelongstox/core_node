
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toprouter.cn | TopRouter Infrastructure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use domestic accessible font CDN as alternative to Google Fonts -->
    <!-- Using fonts.loli.net mirror service (recommended for stable and fast access in China) -->
    <link href="https://fonts.loli.net/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          }
        }
      }
    </script>
    <style>
        :root {
            --bg-color: #030014;
            --glass-bg: rgba(255, 255, 255, 0.015);
            --border-color: rgba(255, 255, 255, 0.08);
            --blob-opacity: 0.25;
            --blob-blur: 120px;
        }
        .light {
            --bg-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --border-color: rgba(0, 0, 0, 0.05);
            --blob-opacity: 0.12;
            --blob-blur: 100px;
        }
        body {
            background-color: var(--bg-color);
            transition: background-color 1s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        /* Dynamic Blurred Background Matrix */
        .neural-matrix-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(var(--blob-blur));
            opacity: var(--blob-opacity);
            transition: opacity 1s ease, filter 1s ease;
            mix-blend-mode: screen;
        }
        .light .blob {
            mix-blend-mode: multiply;
        }
        
        .blob-1 { width: 800px; height: 800px; background: #3b82f6; top: -200px; left: -200px; animation: orbit 40s linear infinite; }
        .blob-2 { width: 700px; height: 700px; background: #a855f7; bottom: -150px; right: -150px; animation: orbit 35s linear infinite reverse; }
        .blob-3 { width: 600px; height: 600px; background: #10b981; top: 30%; left: 40%; animation: orbit 50s linear infinite; animation-delay: -5s; }
        .blob-4 { width: 500px; height: 500px; background: #f59e0b; bottom: 20%; left: 10%; animation: orbit 45s linear infinite reverse; animation-delay: -10s; }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid var(--border-color);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-right: 4rem !important;
            display: inline-block;
        }
        
        .glow-button {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-button:hover {
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.4);
            transform: translateY(-4px) scale(1.02);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3b82f644; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f688; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }

        .uptime-dot {
            width: 4px;
            height: 16px;
            border-radius: 1px;
            transition: all 0.2s ease;
        }
        .uptime-dot:hover {
            height: 24px;
            transform: scaleY(1.2);
            z-index: 10;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="dark:text-white text-slate-900 transition-colors duration-500">
    <div class="neural-matrix-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
