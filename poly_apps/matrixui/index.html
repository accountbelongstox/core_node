<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星灿传媒 云矩阵</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin>
    <!-- 主题检测脚本 - 防止闪屏 -->
    <script>
      (function() {
        // 立即设置背景图片和背景色，防止白色闪屏
        const bgImage = '/background.jpg';
        const bgColor = '#030305';
        
        if (document.documentElement) {
          document.documentElement.style.backgroundColor = bgColor;
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        
        // 设置背景图片的函数
        function setBackgroundImage() {
          if (document.body) {
            document.body.style.backgroundImage = `url(${bgImage})`;
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundAttachment = 'fixed';
            document.body.style.backgroundColor = bgColor;
          }
        }
        
        // 立即尝试设置
        setBackgroundImage();
        
        // 如果 body 还未加载，等待 DOMContentLoaded
        if (!document.body) {
          document.addEventListener('DOMContentLoaded', setBackgroundImage);
        }
      })();
    </script>
    <!-- 资源预加载 -->
    <link rel="preload" href="/background.jpg" as="image">
    <link rel="preload" href="/index.css" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" as="style" crossorigin>
    <!-- 预加载入口脚本 -->
    <link rel="modulepreload" href="/index.tsx">
    <!-- DNS预解析，加速外部资源加载 -->
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://aistudiocdn.com">
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root" class="h-full w-full relative z-10"></div>
    <!-- Atmosphere -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden dynamic-bg">
      <div class="absolute inset-0 noise-bg z-[1]"></div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="scanlines absolute inset-0 z-[2]"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20 z-[3]"></div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
