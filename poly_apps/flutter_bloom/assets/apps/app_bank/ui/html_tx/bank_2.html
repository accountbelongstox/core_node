<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活服务页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 375px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #f8f9fa;
            font-size: 14px;
            font-weight: 500;
        }

        .status-left {
            color: #333;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .battery {
            background: #4CAF50;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }

        /* 顶部导航区域 */
        .top-header {
            background: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .search-bar {
            flex: 1;
            background: #f5f5f5;
            border-radius: 20px;
            padding: 8px 16px;
            border: none;
            font-size: 14px;
            color: #666;
        }

        .header-icons {
            display: flex;
            gap: 16px;
        }

        .header-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
        }

        .header-icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        .header-icon-text {
            font-size: 12px;
        }

        /* 主横幅 */
        .main-banner {
            margin: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            /* 注意：此处应该使用实际的横幅背景图片 */
            position: relative;
            height: 160px;
        }

        .banner-content {
            padding: 20px;
            color: #333;
            position: relative;
            z-index: 2;
        }

        .banner-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d4691a;
        }

        .banner-subtitle {
            font-size: 16px;
            margin-bottom: 4px;
            color: #e67e22;
        }

        .banner-desc {
            font-size: 14px;
            color: #8b4513;
        }

        .banner-image {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        /* 服务网格 */
        .services-grid {
            padding: 20px 16px;
            background: #fff;
        }

        .services-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .service-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
        }

        .service-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .service-icon.phone { background: #e3f2fd; }
        .service-icon.electric { background: #fff3e0; }
        .service-icon.medical { background: #f3e5f5; }
        .service-icon.life { background: #e8f5e8; }
        .service-icon.movie { background: #fce4ec; }
        .service-icon.food { background: #fff8e1; }
        .service-icon.points { background: #e1f5fe; }
        .service-icon.party { background: #ffebee; }
        .service-icon.gas { background: #f1f8e9; }
        .service-icon.water { background: #e0f2f1; }

        .service-name {
            font-size: 12px;
            text-align: center;
            line-height: 1.2;
        }

        /* 生活缴费区域 */
        .payment-section {
            background: #fff;
            margin: 8px 16px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .more-link {
            color: #666;
            font-size: 14px;
            text-decoration: none;
        }

        .payment-items {
            display: flex;
            justify-content: space-between;
        }

        .payment-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            flex: 1;
        }

        .payment-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .payment-name {
            font-size: 14px;
        }

        .payment-button {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6b35 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            margin-top: 4px;
        }

        /* 本地生活区域 */
        .local-life-section {
            background: #fff;
            margin: 8px 16px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .life-cards {
            display: flex;
            gap: 12px;
        }

        .life-card {
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .life-card-image {
            height: 100px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            /* 注意：此处应该使用实际的卡片背景图片 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        .life-card-content {
            padding: 12px;
            background: #fff;
        }

        .life-card-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .life-card-desc {
            font-size: 12px;
            color: #666;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            padding: 8px;
        }

        .nav-item.active {
            color: #ff6b35;
        }

        .nav-item-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            background: #f0f0f0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item.active .nav-item-icon {
            background: #ff6b35;
            color: white;
        }

        .nav-item-text {
            font-size: 12px;
        }

        /* 响应式调整 */
        @media (max-width: 320px) {
            .services-row {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-left">12:01</div>
            <div class="status-right">
                <span>🌙</span>
                <span>📶</span>
                <span>📶</span>
                <span>📶</span>
                <span class="battery">100%</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 顶部导航区域 -->
        <div class="top-header">
            <div class="location">
                <span>📍</span>
                <span>北京</span>
            </div>
            <input type="text" class="search-bar" placeholder="查看您的庭保金额">
            <div class="header-icons">
                <a href="#" class="header-icon">
                    <div class="header-icon-circle">🎧</div>
                    <div class="header-icon-text">客服</div>
                </a>
                <a href="#" class="header-icon">
                    <div class="header-icon-circle">📋</div>
                    <div class="header-icon-text">订单</div>
                </a>
            </div>
        </div>

        <!-- 主横幅 -->
        <div class="main-banner">
            <!-- 注意：此处应该使用实际的横幅背景图片，显示谢园小美好的场景 -->
            <div class="banner-content">
                <div class="banner-title">🌟谢园小美好</div>
                <div class="banner-subtitle">试标享福利</div>
                <div class="banner-desc">至高可领5元红包立减金</div>
            </div>
            <div class="banner-image">
                <!-- 注意：此处应该使用实际的人物图片 -->
                👩‍💼
            </div>
        </div>

        <!-- 服务网格 -->
        <div class="services-grid">
            <div class="services-row">
                <a href="#" class="service-item">
                    <div class="service-icon phone">📱</div>
                    <!-- 注意：此处应该使用实际的手机话费图标 -->
                    <div class="service-name">手机话费</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon electric">⚡</div>
                    <!-- 注意：此处应该使用实际的电费图标 -->
                    <div class="service-name">电费</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon medical">🏥</div>
                    <!-- 注意：此处应该使用实际的医保码图标 -->
                    <div class="service-name">医保码</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon life">🏠</div>
                    <!-- 注意：此处应该使用实际的低碳生活图标 -->
                    <div class="service-name">低碳生活</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon movie">🎬</div>
                    <!-- 注意：此处应该使用实际的电影演出图标 -->
                    <div class="service-name">电影演出</div>
                </a>
            </div>

            <div class="services-row">
                <a href="#" class="service-item">
                    <div class="service-icon food">🍽️</div>
                    <!-- 注意：此处应该使用实际的智慧食堂图标 -->
                    <div class="service-name">智慧食堂</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon points">🏪</div>
                    <!-- 注意：此处应该使用实际的积分兑换图标 -->
                    <div class="service-name">积分兑</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon party">🎉</div>
                    <!-- 注意：此处应该使用实际的党费图标 -->
                    <div class="service-name">党费</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon gas">🔥</div>
                    <!-- 注意：此处应该使用实际的燃气费图标 -->
                    <div class="service-name">燃气费</div>
                </a>
                <a href="#" class="service-item">
                    <div class="service-icon water">💧</div>
                    <!-- 注意：此处应该使用实际的水费图标 -->
                    <div class="service-name">水费</div>
                </a>
            </div>
        </div>

        <!-- 生活缴费区域 -->
        <div class="payment-section">
            <div class="section-header">
                <h2 class="section-title">生活缴费</h2>
                <a href="#" class="more-link">更多</a>
            </div>

            <div class="payment-items">
                <a href="#" class="payment-item">
                    <div class="payment-icon">🔥</div>
                    <!-- 注意：此处应该使用实际的燃气费图标 -->
                    <div class="payment-name">燃气费</div>
                    <button class="payment-button">立即添加</button>
                </a>
                <a href="#" class="payment-item">
                    <div class="payment-icon">📡</div>
                    <!-- 注意：此处应该使用实际的供暖费图标 -->
                    <div class="payment-name">供暖费</div>
                    <button class="payment-button">立即添加</button>
                </a>
                <a href="#" class="payment-item">
                    <div class="payment-icon">📞</div>
                    <!-- 注意：此处应该使用实际的固话费图标 -->
                    <div class="payment-name">固话费</div>
                    <button class="payment-button">立即添加</button>
                </a>
            </div>
        </div>

        <!-- 本地生活区域 -->
        <div class="local-life-section">
            <div class="section-header">
                <h2 class="section-title">本地生活</h2>
            </div>

            <div class="life-cards">
                <a href="#" class="life-card">
                    <div class="life-card-image">
                        <!-- 注意：此处应该使用实际的财富号图片 -->
                        💰
                    </div>
                    <div class="life-card-content">
                        <div class="life-card-title">财富号</div>
                        <div class="life-card-desc">月月有好礼</div>
                    </div>
                </a>
                <a href="#" class="life-card">
                    <div class="life-card-image">
                        <!-- 注意：此处应该使用实际的周周抽好礼图片 -->
                        🎁
                    </div>
                    <div class="life-card-content">
                        <div class="life-card-title">周周抽好礼</div>
                        <div class="life-card-desc">一分钱抽100元立减金</div>
                    </div>
                </a>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <a href="#" class="nav-item">
                <div class="nav-item-icon">🏠</div>
                <div class="nav-item-text">首页</div>
            </a>
            <a href="#" class="nav-item">
                <div class="nav-item-icon">💳</div>
                <div class="nav-item-text">信用卡</div>
            </a>
            <a href="#" class="nav-item">
                <div class="nav-item-icon">💰</div>
                <div class="nav-item-text">财富</div>
            </a>
            <a href="#" class="nav-item active">
                <div class="nav-item-icon">🏪</div>
                <div class="nav-item-text">生活</div>
            </a>
            <a href="#" class="nav-item">
                <div class="nav-item-icon">👤</div>
                <div class="nav-item-text">我的</div>
            </a>
        </div>
    </div>
</body>
</html>
