name: app_qy
description: Shanbay vocabulary learning app - app_qy
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Flutter Bloom common dependencies
  flutter_bloom_common:
    path: ../../common

  # Authentication library
  flutter_bloom_auth_v2:
    path: ../../common/auth_v2

  # State management
  provider: ^6.0.5

  # Local storage
  shared_preferences: ^2.2.0

  # HTTP requests
  http: ^1.1.0

  # URL launcher for OAuth
  url_launcher: ^6.1.12

  # Utility packages
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  qyflutter: any
  image_picker: any
  flutter_localization: any
  go_router: any
  get: any
  pin_code_fields: any
  percent_indicator: any
  table_calendar: any
  smooth_page_indicator: any
  hive: any
  intl: any
flutter:
  uses-material-design: true

  # App-specific assets
  assets:
    - assets/images/
    - assets/icons/

  # App-specific fonts
  fonts:
    - family: PingFang SC
      fonts:
        - asset: assets/fonts/PingFangSC-Regular.ttf
        - asset: assets/fonts/PingFangSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/PingFangSC-Semibold.ttf
          weight: 600