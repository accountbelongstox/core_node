<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>关于我们（还原）</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#f6f8fc,#eef1f6);display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}
  .phone{width: 375px;height: 812px;background:#f8f9fb;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;border:6px solid #fff}
  
  .hero{height:180px;background:radial-gradient(140% 90% at 0% 0%,#dff2ff 0%,#f5fbff 45%,#ffffff 80%)}
  .logo{position:absolute;left:50%;top:210px;transform:translateX(-50%);display:inline-grid;grid-auto-flow:column;align-items:center;gap:8px;font-weight:800;font-size:24px;color:#1b5cff}
  .logo .bar{width:10px;height:44px;background:#1b5cff;border-radius:2px;box-shadow:16px 0 0 #5aa8ff inset}
  .list{position:absolute;top:300px;left:40px;right:40px;display:grid;gap:18px}
  .cell{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid #eef1f5;padding-bottom:6px;color:#333}
  .arrow{color:#999}




/* unified bottom navigation */
.tabs{position:absolute;left:0;right:0;bottom: 0;background:#ffffff;border-top:1px solid #e6e9ef;height:64px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;justify-items:center;align-content:center;color:#8a94a1;font-size:12px;gap:4px;text-decoration:none}
.tab.active{color:#2a89ff}
.tab svg{width:22px;height:22px;display:block}
</style>
</head>
<body>
  <div class=phone>
    <div></div>
    </div>
    <div class=hero></div>
    <div class=logo><span class=bar></span><span>安无忧</span></div>

      <div class=cell><div>功能介绍</div><div class=arrow>›</div></div>
      <div class=cell><div>版本更新</div><div class=arrow>›</div></div>
    </div>
  
  
    </div>
