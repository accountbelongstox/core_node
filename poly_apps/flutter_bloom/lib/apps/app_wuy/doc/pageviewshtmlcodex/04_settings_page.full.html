<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>好友列表（还原）</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#f6f8fc,#eef1f6);display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}
  .phone{width: 375px;height: 812px;background:#f8f9fb;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;border:6px solid #fff}
  
  .toolbar{height:44px;background:#f3f4f7;border-bottom:1px solid #e2e4ea;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 10px;font-weight:700;color:#444}
  .toolbar .title{text-align:center}
  .toolbar .icons{display:flex;gap:14px;color:#7b8794}
  .search{margin:8px 10px;background:#fff;border:1px solid #e7eaf0;border-radius:18px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#a3aab3}
  .list{position:absolute;top:140px;bottom:84px;left:0;right:0;overflow:auto;padding:0}
  .item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #f0f1f5;background:#fff}
  .item:first-child{border-top:0}
  .avatar{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#ff6b6b,#ffaf87);display:grid;place-items:center;color:#fff;font-weight:800}
  .badge{position:absolute;margin:-8px 0 0 26px;background:#ff4d6d;color:#fff;font-size:12px;border-radius:10px;padding:0 6px;border:2px solid #fff}
  .meta{display:grid;gap:4px}
  .meta .name{font-weight:700;color:#0a1a2b}
  .meta .msg{font-size:12px;color:#7a8794}
  .meta .state{font-size:12px;color:#1f2f44}
  .time{font-size:12px;color:#a0a7b0}
  .switch{position:relative;width:44px;height:24px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;border-radius:999px;background:#e5e9f0;transition:.2s}
  .slider:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
  .switch input:checked + .slider{background:#4c84ff}
  .switch input:checked + .slider:before{transform:translateX(20px)}
  
  
  
  .home-indicator{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:134px;height:5px;background:#000;border-radius:999px;opacity:.9}
/* unified bottom navigation */
.tabs{position:absolute;left:0;right:0;bottom: 0;background:#ffffff;border-top:1px solid #e6e9ef;height:64px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;justify-items:center;align-content:center;color:#8a94a1;font-size:12px;gap:4px;text-decoration:none}
.tab.active{color:#2a89ff}
.tab svg{width:22px;height:22px;display:block}
</style>
</head>
<body>
  <div class=phone>
    <div></div>
    </div>
    <div class=toolbar>
      <div class=title>好友列表（3）</div>
      <div class=icons>🔍 ⟳</div>
    </div>
    <div class=search>🔎 搜索</div>
    <div class=list>
      <div class=item>
        <div style="position:relative">
          <div class=avatar>推</div>
          <div class=badge>2</div>
        </div>
        <div class=meta>

          <div class=msg>这本书很好看，推荐你可以看看</div>
          <div class=state>监控状态：</div>
        </div>
        <label class=switch title=开关><input type=checkbox checked><span class=slider></span></label>
      </div>
      <div class=item>
        <div class=avatar style="background:linear-gradient(135deg,#5a9cff,#3c6dff)">头</div>
        <div class=meta>
          <div class=name>父亲</div>

      </div>
      <div class=item>
        <div class=avatar style="background:linear-gradient(135deg,#9b5cff,#6d3cff)">头</div>
        <div class=meta>
          <div class=name>母亲</div>
          <div class=msg>聊天内容聊天内容聊天内容</div>
          <div class=state>监控状态：</div>
        </div>
        <label class=switch><input type=checkbox><span class=slider></span></label>
      </div>
      <div class=item>
        <div class=avatar style="background:linear-gradient(135deg,#36c486,#00b47a)">头</div>
        <div class=meta>
          <div class=name>孩子</div>
          <div class=msg>聊天内容聊天内容聊天内容</div>
          <div class=state>监控状态：</div>
        </div>
        <div class=time>4-24</div>
      </div>
    </div>
    <div class=tabs>
      <div class=tab>地图</div>
      <div class="tab active">好友</div>
      <div class=tab>我的</div>
    </div>
    <div class=home-indicator></div>
  
  
    </div>

  <div class="tabs">
    <a class="tab" href="03_menu_drawer_open.full.html" title="地图">

  </div>
</div>

</html>
