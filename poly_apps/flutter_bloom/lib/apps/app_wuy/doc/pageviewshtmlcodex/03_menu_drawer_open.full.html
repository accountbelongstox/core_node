<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>地图与底部卡片（还原）</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#f6f8fc,#eef1f6);display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}
  .phone{width: 375px;height: 812px;background:#f8f9fb;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;border:6px solid #fff}
  
  
  .map{position:absolute;inset:0;background:#e8ecef}
  /* stylized map using inline SVG */
  .map:before{content:"";position:absolute;inset:0;background:
    linear-gradient(#ccd6dd 0 0) left 0 top 120px/100% 2px no-repeat,
    linear-gradient(#ccd6dd 0 0) left 0 top 200px/100% 2px no-repeat,
    linear-gradient(#ccd6dd 0 0) left 0 top 280px/100% 2px no-repeat,
    linear-gradient(#ccd6dd 0 0) left 0 top 360px/100% 2px no-repeat,
    linear-gradient(#ccd6dd 0 0) left 0 top 440px/100% 2px no-repeat,
    linear-gradient(#ccd6dd 0 0) left 0 top 520px/100% 2px no-repeat,
    linear-gradient(#ccd6dd 0 0) left 0 top 600px/100% 2px no-repeat,
    linear-gradient(90deg,#ccd6dd 0 0) left 60px top 0/2px 100% no-repeat,
    linear-gradient(90deg,#ccd6dd 0 0) left 140px top 0/2px 100% no-repeat,
    linear-gradient(90deg,#ccd6dd 0 0) left 220px top 0/2px 100% no-repeat,
    linear-gradient(90deg,#ccd6dd 0 0) left 300px top 0/2px 100% no-repeat,
    radial-gradient(120px 80px at 60px 150px,#bfe5bf,transparent 70%),
    radial-gradient(80px 80px at 110px 200px,#bfe5bf,transparent 70%),
    radial-gradient(70px 70px at 185px 135px,#bfe5bf,transparent 70%),
    radial-gradient(60px 60px at 280px 210px,#bfe5bf,transparent 70%);
    opacity:.85}
  .top-buttons{position:absolute;top:84px;right:12px;display:grid;gap:12px;z-index:2}
  .fab{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;border:1px solid #e5e7eb}
  .fab svg{width:22px;height:22px;stroke:#e06464}
  .bottom-card{position:absolute;left:12px;right:12px;bottom:104px;background:#e9fbff;border:1px solid #d9f2fb;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:grid;grid-template-columns:56px 1fr 32px;align-items:center;padding:12px}
  .avatar{width:48px;height:48px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#ffd08a,#ff9f6e)}
  .avatar:before{content:"";position:absolute}
  .meta{display:grid;gap:4px;color:#0d2a3d}
  .meta .name{font-weight:800}
  .meta .row{display:flex;gap:10px;color:#447;opacity:.8;font-size:12px}
  .desc{color:#16445f;font-size:12px;opacity:.9}
  .loc{display:grid;place-items:center}
  .loc svg{width:22px;height:22px;stroke:#1f415a}
  
  
  
  
  .home-indicator{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:134px;height:5px;background:#000;border-radius:999px;opacity:.9;z-index:2}
/* unified bottom navigation */
.tabs{position:absolute;left:0;right:0;bottom: 0;background:#ffffff;border-top:1px solid #e6e9ef;height:64px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;justify-items:center;align-content:center;color:#8a94a1;font-size:12px;gap:4px;text-decoration:none}
.tab.active{color:#2a89ff}
.tab svg{width:22px;height:22px;display:block}
</style>
</head>
<body>
  <div class=phone>
    
    <div class=map></div>
    <div class=top-buttons>
      <div class=fab title="消息"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0 1 12 0v5l2 2H4l2-2z" stroke="#e06464" stroke-width="1.6"/></svg></div>
      <div class=fab title="礼物"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="10" width="18" height="10" rx="2" stroke="#e06464" stroke-width="1.6"/><path d="M3 10h18M12 10v10" stroke="#e06464" stroke-width="1.6"/><path d="M12 10c-1.8-3 2-4 3-2 1-2 4-1 3 2" stroke="#e06464" stroke-width="1.6" fill="none"/></svg></div>
    </div>
    <div class=bottom-card>
      <div class=avatar style="border-radius:12px"></div>
      <div class=meta>
        <div class=name>小飞棍</div>
        <div class=row><span>1314天</span><span>男朋友</span></div>
        <div class=desc>守护你的未来</div>
      </div>
      <div class=loc><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s6-6 6-10a6 6 0 1 0 -12 0c0 4 6 10 6 10z" stroke="#1f415a" stroke-width="1.6"/><circle cx="12" cy="11" r="2" fill="#1f415a"/></svg></div>
    </div>
    <div class=tabs>
      <div class="tab active"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v8H3z" stroke="currentColor" stroke-width="1.6"/></svg><div>地图</div></div>
      <div class=tab><svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg><div>好友</div></div>
      <div class=tab><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20a8 5 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg><div>我的</div></div>
    </div>
    <div class=home-indicator></div>
  
  
    </div>

  <div class="tabs">
    <a class="tab" href="03_menu_drawer_open.full.html" title="地图">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v8H3z" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>地图</div>
    </a>
    <a class="tab" href="04_settings_page.full.html" title="好友">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>好友</div>
    </a>
    <a class="tab" href="12_theme_selection_dialog.full.html" title="我的">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20a8 5 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>我的</div>
    </a>
  </div>
</div>
</body>
</html>
