<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>登录/注册（还原）</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#f6f8fc,#eef1f6);display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}
  .phone{width: 375px;height: 812px;background:#f8f9fb;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;border:6px solid #fff}
  
  
  .header-bg{height:220px;background:radial-gradient(140% 90% at 0% 0%,#dff2ff 0%,#f5fbff 45%,#ffffff 80%);position:relative}
  .header-bg:before{content:"";position:absolute;inset:20px 16px auto 16px;height:60px;background:conic-gradient(from 40deg at 10% 0%,rgba(155,197,255,.35),rgba(255,255,255,0) 60%);border-radius:16px;filter:blur(10px);opacity:.9}
  .wrap{padding:0 22px 22px}
  h1{margin:16px 0 26px;font-size:32px;line-height:1.2;letter-spacing:.5px;color:#0a1a2b;font-weight:800}
  .field{height:44px;border-radius:12px;background:#eef4fb;border:1px solid #e5effa;box-shadow:0 1px 2px rgba(0,0,0,.03) inset;margin:12px 0;display:flex;align-items:center;padding:0 14px;color:#7a8794}
  .field .ph{opacity:.8;font-weight:600}
  .primary{margin-top:16px;position:relative;height:46px;border-radius:23px;background:linear-gradient(180deg,#2fa6ff 0%,#1677ff 100%);color:#fff;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 6px 18px rgba(35,119,255,.35)}
  .primary:after{content:"";position:absolute;right:8px;top:-2px;width:16px;height:16px;background:#e6f1ff;border-top-right-radius:12px;transform:skew(-35deg);box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
  .agreements{position:absolute;left:0;right:0;bottom:58px;text-align:center;color:#b7bec6;font-size:11px}
  .home-indicator{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:134px;height:5px;background:#000;border-radius:999px;opacity:.9}




/* unified bottom navigation */
.tabs{position:absolute;left:0;right:0;bottom: 0;background:#ffffff;border-top:1px solid #e6e9ef;height:64px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;justify-items:center;align-content:center;color:#8a94a1;font-size:12px;gap:4px;text-decoration:none}
.tab.active{color:#2a89ff}
.tab svg{width:22px;height:22px;display:block}
</style>
</head>
<body>
  <div class=phone>
    
    <div class=header-bg></div>
    <div class=wrap>
      <h1>登录/注册</h1>
      <div class=field><div class=ph>请输入手机号</div></div>
      <div class=field><div class=ph>验证码</div></div>
      <a class=primary href="#">注册/登录</a>
    <div class=agreements>登录/注册表示您已同意《用户协议》和《隐私政策》</div>
    <div class=home-indicator></div>
  
  
    </div>

  <div class="tabs">
    <a class="tab" href="03_menu_drawer_open.full.html" title="地图">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v8H3z" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>地图</div>
    </a>
    <a class="tab" href="04_settings_page.full.html" title="好友">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>好友</div>
    </a>
    <a class="tab" href="12_theme_selection_dialog.full.html" title="我的">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20a8 5 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>我的</div>
    </a>
  </div>
</div>
</body>
</html>
