<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>我的（还原）</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#f6f8fc,#eef1f6);display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}
  .phone{width: 375px;height: 812px;background:#f8f9fb;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;border:6px solid #fff}
  
  .hero{height:140px;background:linear-gradient(135deg,#ff7d4d,#d94b3b);border-bottom-left-radius:18px;border-bottom-right-radius:18px}
  .avatar{position:absolute;left:50%;top:120px;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ffd08a,#ff9f6e);border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .name{position:absolute;left:50%;top:170px;transform:translateX(-50%);font-weight:800}
  .list{position:absolute;top:210px;left:12px;right:12px;display:grid;gap:10px}
  .cell{background:#fff;border:1px solid #e6e9ef;border-radius:10px;height:48px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 14px}
  .cell .icon{width:20px;text-align:center}
  .cell .arrow{color:#999}
  
  
  
  .home-indicator{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:134px;height:5px;background:#000;border-radius:999px;opacity:.9}
/* unified bottom navigation */
.tabs{position:absolute;left:0;right:0;bottom: 0;background:#ffffff;border-top:1px solid #e6e9ef;height:64px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;justify-items:center;align-content:center;color:#8a94a1;font-size:12px;gap:4px;text-decoration:none}
.tab.active{color:#2a89ff}
.tab svg{width:22px;height:22px;display:block}
</style>
</head>
<body>
  <div class=phone>
    <div></div>
    </div>
    <div class=hero></div>
    <div class=avatar></div>
    <div class=name>小飞鱼 ♀</div>
    <div class=list>
      <div class=cell><div class=icon>👤</div><div>个人信息</div><div class=arrow>›</div></div>
      <div class=cell><div class=icon>ℹ️</div><div>关于我们</div><div class=arrow>›</div></div>
    </div>
    <div class=tabs>
      <div class=tab>地图</div>
      <div class=tab>好友</div>
      <div class="tab active">我的</div>
    </div>
    <div class=home-indicator></div>
  
  
    </div>

      <div>地图</div>
    </a>
    <a class="tab" href="04_settings_page.full.html" title="好友">

      <div>好友</div>
    </a>
    <a class="tab" href="12_theme_selection_dialog.full.html" title="我的">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20a8 5 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>我的</div>
    </a>
  </div>
</div>
</body>
</html>
