<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>页面清单（还原）</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:#fff;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}
  .phone{width: 375px;height: 812px;background:#f8f9fb;border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;border:6px solid #fff}
  
  .list{position:absolute;left:0;right:0;top:48px;bottom:64px;overflow:auto}
  .row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #eceef2;background:#fff}
  .row:nth-child(odd){background:#fbfbfc}
  .idx{width:24px;height:24px;border-radius:50%;background:#e9edf5;display:grid;place-items:center;font-weight:700;color:#4a5660}




/* unified bottom navigation */
.tabs{position:absolute;left:0;right:0;bottom: 0;background:#ffffff;border-top:1px solid #e6e9ef;height:64px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;justify-items:center;align-content:center;color:#8a94a1;font-size:12px;gap:4px;text-decoration:none}
.tab.active{color:#2a89ff}
.tab svg{width:22px;height:22px;display:block}
</style>
</head>
<body>
  <div class=phone>
    <div></div></div>
    <div class=list>
      <div class=row><div class=idx>1</div><div>登录</div></div>
      <div class=row><div class=idx>2</div><div>注册</div></div>
      <div class=row><div class=idx>3</div><div>地图页面</div></div>
      <div class=row><div class=idx>4</div><div>好友列表页面</div></div>
      <div class=row><div class=idx>5</div><div>查找好友页面</div></div>
      <div class=row><div class=idx>6</div><div>添加好友信息页面</div></div>
      <div class=row><div class=idx>7</div><div>聊天页面</div></div>
      <div class=row><div class=idx>8</div><div>好友信息页面</div></div>
      <div class=row><div class=idx>9</div><div>历史轨迹页面</div></div>
      <div class=row><div class=idx>10</div><div>网络记录页面</div></div>
      <div class=row><div class=idx>11</div><div>我的</div></div>
      <div class=row><div class=idx>12</div><div>个人资料页面</div></div>
      <div class=row><div class=idx>13</div><div>关于我们页面</div></div>
    </div>
  
  
    </div>

  <div class="tabs">
    <a class="tab" href="03_menu_drawer_open.full.html" title="地图">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7v8H3z" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>地图</div>
    </a>
    <a class="tab" href="04_settings_page.full.html" title="好友">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>好友</div>
    </a>
    <a class="tab" href="12_theme_selection_dialog.full.html" title="我的">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20a8 5 0 0 1 16 0" stroke="currentColor" stroke-width="1.6"/></svg>
      <div>我的</div>
    </a>
  </div>
</div>
</body>
</html>
