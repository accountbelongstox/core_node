<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 375px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            align-items: center;
            position: relative;
        }

        .back-button {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .profile-section {
            background-color: #fff;
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-container {
            position: relative;
            margin-right: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 600;
        }

        .avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 28px;
            height: 28px;
            background-color: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border: 3px solid white;
            transition: all 0.2s ease;
        }

        .avatar-edit:hover {
            background-color: #5a6fd8;
            transform: scale(1.1);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .profile-email {
            font-size: 14px;
            color: #666;
        }

        .form-section {
            background-color: #fff;
            margin-top: 10px;
        }

        .form-group {
            border-bottom: 1px solid #f0f0f0;
            padding: 0 20px;
        }

        .form-group:last-child {
            border-bottom: none;
        }

        .form-item {
            padding: 15px 0;
            display: flex;
            align-items: center;
        }

        .form-label {
            font-size: 16px;
            color: #333;
            min-width: 70px;
            font-weight: 500;
        }

        .form-input {
            flex: 1;
            font-size: 16px;
            color: #666;
            background: none;
            border: none;
            outline: none;
            padding: 0;
        }

        .form-input::placeholder {
            color: #ccc;
        }

        .form-value {
            flex: 1;
            font-size: 16px;
            color: #666;
            text-align: right;
        }

        .form-arrow {
            color: #ccc;
            font-size: 16px;
            margin-left: 10px;
        }

        .action-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 30px auto;
            display: block;
            min-width: 200px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .action-button:active {
            transform: translateY(0);
        }

        .logout-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 20px;
            width: calc(100% - 40px);
        }

        .logout-button:hover {
            background-color: #d32f2f;
        }

        .logout-button:active {
            background-color: #b71c1c;
        }

        .clickable {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="back-button">←</div>
            <div class="header-title">账户设置</div>
        </div>

        <div class="profile-section">
            <div class="profile-header">
                <div class="avatar-container">
                    <div class="avatar">U</div>
                    <div class="avatar-edit">📷</div>
                </div>
                <div class="profile-info">
                    <div class="profile-name">用户名</div>
                    <div class="profile-email">user@example.com</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <div class="form-item">
                    <div class="form-label">用户名</div>
                    <input type="text" class="form-input" placeholder="设置用户名" value="用户名">
                </div>
            </div>

            <div class="form-group">
                <div class="form-item">
                    <div class="form-label">邮箱</div>
                    <input type="email" class="form-input" placeholder="设置邮箱地址" value="user@example.com">
                </div>
            </div>

            <div class="form-group">
                <div class="form-item">
                    <div class="form-label">手机号</div>
                    <input type="tel" class="form-input" placeholder="绑定手机号" value="">
                </div>
            </div>

            <div class="form-group">
                <div class="form-item clickable">
                    <div class="form-label">修改密码</div>
                    <div class="form-arrow">›</div>
                </div>
            </div>

            <div class="form-group">
                <div class="form-item">
                    <div class="form-label">双重认证</div>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <div class="form-item clickable">
                    <div class="form-label">登录方式</div>
                    <div class="form-value">邮箱登录</div>
                    <div class="form-arrow">›</div>
                </div>
            </div>

            <div class="form-group">
                <div class="form-item clickable">
                    <div class="form-label">关联账号</div>
                    <div class="form-value">未关联</div>
                    <div class="form-arrow">›</div>
                </div>
            </div>
        </div>

        <button class="action-button">保存设置</button>

        <button class="logout-button">退出登录</button>
    </div>

    <script>
        // Back button handler
        document.querySelector('.back-button').addEventListener('click', function() {
            window.history.back();
        });

        // Avatar edit handler
        document.querySelector('.avatar-edit').addEventListener('click', function() {
            alert('点击更换头像功能');
        });

        // Form input handlers
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.color = '#333';
            });

            input.addEventListener('blur', function() {
                this.style.color = '#666';
            });
        });

        // Save button handler
        document.querySelector('.action-button').addEventListener('click', function() {
            const username = document.querySelector('.form-input[type="text"]').value;
            const email = document.querySelector('.form-input[type="email"]').value;
            const phone = document.querySelector('.form-input[type="tel"]').value;

            if (!username || !email) {
                alert('请填写必要信息');
                return;
            }

            // Simulate saving
            this.textContent = '保存中...';
            this.disabled = true;

            setTimeout(() => {
                this.textContent = '保存成功';
                setTimeout(() => {
                    this.textContent = '保存设置';
                    this.disabled = false;
                }, 1500);
            }, 1000);
        });

        // Logout button handler
        document.querySelector('.logout-button').addEventListener('click', function() {
            if (confirm('确定要退出登录吗？')) {
                alert('已退出登录');
                // window.location.href = 'login.html';
            }
        });

        // Clickable items handlers
        document.querySelectorAll('.clickable').forEach(item => {
            item.addEventListener('click', function() {
                const label = this.querySelector('.form-label').textContent;
                console.log('Clicked:', label);

                // Add click feedback
                this.style.backgroundColor = '#f8f8f8';
                setTimeout(() => {
                    this.style.backgroundColor = '';
                }, 200);

                // Handle specific actions
                if (label === '修改密码') {
                    alert('跳转到修改密码页面');
                } else if (label === '登录方式') {
                    alert('跳转到登录方式设置页面');
                } else if (label === '关联账号') {
                    alert('跳转到关联账号页面');
                }
            });
        });

        // Switch toggle handler
        document.querySelector('.switch input').addEventListener('change', function() {
            const isEnabled = this.checked;
            console.log('双重认证:', isEnabled ? '开启' : '关闭');
        });
    </script>
</body>
</html>
