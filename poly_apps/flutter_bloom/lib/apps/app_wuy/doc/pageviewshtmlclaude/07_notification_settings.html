<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 375px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            align-items: center;
            position: relative;
        }

        .back-button {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .content {
            background-color: #f5f5f5;
            min-height: calc(100vh - 60px);
        }

        .settings-section {
            background-color: #fff;
            margin-bottom: 10px;
        }

        .section-title {
            padding: 15px 20px 10px;
            font-size: 13px;
            color: #666;
            font-weight: 500;
            background-color: #f5f5f5;
        }

        .settings-group {
            border-bottom: 1px solid #f0f0f0;
        }

        .settings-group:last-child {
            border-bottom: none;
        }

        .settings-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .settings-item:hover {
            background-color: #f8f8f8;
        }

        .settings-item:active {
            background-color: #f0f0f0;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-bottom: 3px;
        }

        .item-description {
            font-size: 13px;
            color: #999;
        }

        .item-value {
            font-size: 14px;
            color: #666;
            margin-right: 10px;
        }

        .item-arrow {
            color: #ccc;
            font-size: 16px;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
        }

        .switch-label {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .notification-badge {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: #f44336;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
        }

        .time-selector {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 10px;
        }

        .time-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            background-color: #f8f9fa;
        }

        .time-separator {
            color: #666;
            font-weight: 500;
        }

        .preview-notification {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 20px;
            border-left: 4px solid #667eea;
        }

        .preview-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .preview-icon {
            width: 24px;
            height: 24px;
            background-color: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            margin-right: 10px;
        }

        .preview-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .preview-time {
            font-size: 12px;
            color: #999;
            margin-left: auto;
        }

        .preview-content {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px;
            width: calc(100% - 40px);
        }

        .button-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .button-primary:active {
            transform: translateY(0);
        }

        .permission-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
        }

        .permission-label {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .permission-value {
            font-size: 14px;
            color: #4caf50;
            font-weight: 500;
        }

        .permission-value.denied {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="back-button">←</div>
            <div class="header-title">通知设置</div>
        </div>

        <div class="content">
            <div class="section-title">系统权限</div>
            <div class="settings-section">
                <div class="permission-status">
                    <div class="permission-label">通知权限</div>
                    <div class="permission-value">已开启</div>
                </div>
            </div>

            <div class="section-title">推送通知</div>
            <div class="settings-section">
                <div class="switch-container">
                    <div class="switch-label">推送通知</div>
                    <label class="switch">
                        <input type="checkbox" id="pushNotifications" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="switch-container">
                    <div class="switch-label">声音提醒</div>
                    <label class="switch">
                        <input type="checkbox" id="soundNotifications" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="switch-container">
                    <div class="switch-label">震动提醒</div>
                    <label class="switch">
                        <input type="checkbox" id="vibrateNotifications">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="switch-container">
                    <div class="switch-label">LED灯提醒</div>
                    <label class="switch">
                        <input type="checkbox" id="ledNotifications">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="section-title">免打扰时间</div>
            <div class="settings-section">
                <div class="switch-container">
                    <div class="switch-label">开启免打扰</div>
                    <label class="switch">
                        <input type="checkbox" id="doNotDisturb">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="time-selector">
                    <input type="time" class="time-input" value="22:00" id="startTime">
                    <span class="time-separator">至</span>
                    <input type="time" class="time-input" value="08:00" id="endTime">
                </div>
            </div>

            <div class="section-title">通知类型</div>
            <div class="settings-section">
                <div class="settings-item">
                    <div class="item-content">
                        <div class="item-title">系统通知</div>
                        <div class="item-description">系统更新、维护公告</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="settings-item">
                    <div class="item-content">
                        <div class="item-title">互动通知</div>
                        <div class="item-description">点赞、评论、关注</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                    <div class="notification-badge">3</div>
                </div>

                <div class="settings-item">
                    <div class="item-content">
                        <div class="item-title">私信通知</div>
                        <div class="item-description">新消息、聊天提醒</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="settings-item">
                    <div class="item-content">
                        <div class="item-title">推荐通知</div>
                        <div class="item-description">个性化内容推荐</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="section-title">预览效果</div>
            <div class="settings-section">
                <div class="preview-notification">
                    <div class="preview-header">
                        <div class="preview-icon">🔔</div>
                        <div class="preview-title">系统通知</div>
                        <div class="preview-time">刚刚</div>
                    </div>
                    <div class="preview-content">
                        您有一条新的系统消息，请及时查看。
                    </div>
                </div>
            </div>

            <button class="button-primary">保存设置</button>
        </div>
    </div>

    <script>
        // Back button handler
        document.querySelector('.back-button').addEventListener('click', function() {
            window.history.back();
        });

        // Switch handlers
        document.getElementById('pushNotifications').addEventListener('change', function() {
            console.log('推送通知:', this.checked);
            // If push notifications are disabled, disable all related switches
            if (!this.checked) {
                document.getElementById('soundNotifications').checked = false;
                document.getElementById('vibrateNotifications').checked = false;
                document.getElementById('ledNotifications').checked = false;
            }
        });

        document.getElementById('soundNotifications').addEventListener('change', function() {
            console.log('声音提醒:', this.checked);
            // Enable push notifications if sound is enabled
            if (this.checked) {
                document.getElementById('pushNotifications').checked = true;
            }
        });

        document.getElementById('vibrateNotifications').addEventListener('change', function() {
            console.log('震动提醒:', this.checked);
            // Enable push notifications if vibrate is enabled
            if (this.checked) {
                document.getElementById('pushNotifications').checked = true;
            }
        });

        document.getElementById('ledNotifications').addEventListener('change', function() {
            console.log('LED灯提醒:', this.checked);
        });

        document.getElementById('doNotDisturb').addEventListener('change', function() {
            console.log('免打扰模式:', this.checked);
            // Enable/disable time inputs based on DND status
            const timeInputs = document.querySelectorAll('.time-input');
            timeInputs.forEach(input => {
                input.disabled = !this.checked;
            });
        });

        // Time input handlers
        document.getElementById('startTime').addEventListener('change', function() {
            console.log('开始时间:', this.value);
        });

        document.getElementById('endTime').addEventListener('change', function() {
            console.log('结束时间:', this.value);
        });

        // Notification type switches
        document.querySelectorAll('.settings-item input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const title = this.closest('.settings-item').querySelector('.item-title').textContent;
                console.log(title, this.checked ? '开启' : '关闭');
            });
        });

        // Save button handler
        document.querySelector('.button-primary').addEventListener('click', function() {
            const settings = {
                pushNotifications: document.getElementById('pushNotifications').checked,
                soundNotifications: document.getElementById('soundNotifications').checked,
                vibrateNotifications: document.getElementById('vibrateNotifications').checked,
                ledNotifications: document.getElementById('ledNotifications').checked,
                doNotDisturb: document.getElementById('doNotDisturb').checked,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value
            };

            console.log('Saving notification settings:', settings);

            // Simulate saving
            this.textContent = '保存中...';
            this.disabled = true;

            setTimeout(() => {
                this.textContent = '保存成功';
                setTimeout(() => {
                    this.textContent = '保存设置';
                    this.disabled = false;
                }, 1500);
            }, 1000);
        });

        // Initialize time inputs state
        document.addEventListener('DOMContentLoaded', function() {
            const dndEnabled = document.getElementById('doNotDisturb').checked;
            const timeInputs = document.querySelectorAll('.time-input');
            timeInputs.forEach(input => {
                input.disabled = !dndEnabled;
            });
        });
    </script>
</body>
</html>
