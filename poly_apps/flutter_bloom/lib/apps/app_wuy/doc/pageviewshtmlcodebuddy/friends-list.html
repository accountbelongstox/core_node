<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>好友列表 - 安无忧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--border:#e8eef5}
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:420px;margin:0 auto;min-height:100vh;padding:12px 12px 72px}
.header{display:flex;align-items:center;gap:8px}
.header h1{font-size:18px;margin:0}
.search{margin:10px 0}
.input{width:100%;height:38px;border:1px solid var(--border);border-radius:20px;padding:0 14px}
.list{background:#f7f7f8;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border);background:#fff}
.item:last-child{border-bottom:none}
.badge{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700}
.badge.red{background:#ff4d4f}.badge.green{background:#52c41a}.badge.blue{background:#1677ff}.badge.purple{background:#722ed1}
.meta{flex:1}
.meta .name{font-weight:700}
.meta .msg{font-size:12px;color:#666}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px}
.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);max-width:420px;width:100%;display:flex;justify-content:space-around;padding:10px 22px}
.tab{display:flex;flex-direction:column;align-items:center;color:#7c8b9f;text-decoration:none;font-size:12px}
.tab.active{color:#1677ff}
/* 导航选中态高亮与毛玻璃 */
.nav{backdrop-filter:saturate(120%) blur(6px)}
.tab{padding:6px 10px;border-radius:14px}
.tab.active{color:#1677ff;background:rgba(35,136,255,.12);box-shadow:0 6px 12px rgba(35,136,255,.12)}
.tab:hover{background:rgba(0,0,0,.06)}
/* 高级CSS：滑动开关 Switch（无JS） */
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:#dfe6ee;border:1px solid #cfd8e3;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);transition:all .2s ease}
.switch .slider::after{content:"";position:absolute;top:50%;left:3px;width:18px;height:18px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:all .2s ease}
.switch input:checked + .slider{background:#a7d2ff;border-color:#7db7ff;box-shadow:inset 0 2px 6px rgba(35,136,255,.18)}
.switch input:checked + .slider::after{left:23px;background:#fff}
.switch input:focus-visible + .slider{outline:2px solid #2388ff33;outline-offset:2px}
/* 列表行 hover/按压反馈与头像光晕 */
.item{transition:background .15s ease}
.item:hover{background:#f9fbff}
.avatar,.badge{box-shadow:0 2px 6px rgba(0,0,0,.08)}
/* 输入框 focus 高亮 */
.input:focus{outline:none;border-color:#1677ff;box-shadow:0 0 0 3px #1677ff22}
/* 统一次级文本颜色与间距 */
.meta .msg{color:#59677a}
</style></head>
