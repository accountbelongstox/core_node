<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>设置 - 通知设置</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5}
    .app{max-width:420px;margin:0 auto;background:#fff;min-height:100vh;position:relative}
    .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:15px 20px;color:#fff;display:flex;align-items:center}
    .back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-right:12px;background:rgba(255,255,255,.2);border-radius:50%}
    .title{font-size:18px;font-weight:600}
    .content{background:#f5f5f5}
    .section-title{padding:15px 20px 10px;font-size:13px;color:#666;font-weight:500;background:#f5f5f5}
    .section{background:#fff;margin-bottom:10px}
    .row{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #f0f0f0}
    .row:last-child{border-bottom:none}
    .label{font-size:16px;font-weight:500;color:#333}
    .value{font-size:14px;color:#4caf50;font-weight:500}
    .value.denied{color:#f44336}
    /* iOS-like switch (shared pattern) */
    .switch{position:relative;display:inline-block;width:50px;height:26px}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.3s;border-radius:26px}
    .slider:before{content:"";position:absolute;height:18px;width:18px;left:4px;bottom:4px;background:#fff;transition:.3s;border-radius:50%}
    .switch input:checked + .slider{background:#667eea}
    .switch input:checked + .slider:before{transform:translateX(24px)}
    .item{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid #f0f0f0}
    .item:last-child{border-bottom:none}
    .item-content{flex:1}
    .item-title{font-size:16px;font-weight:500;color:#333;margin-bottom:3px}
    .item-desc{font-size:13px;color:#999}
    .badge{margin-left:10px;background:#f44336;color:#fff;font-size:11px;padding:2px 6px;border-radius:10px}
    .time{display:flex;align-items:center;gap:10px;padding:15px 20px}
    .time input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;text-align:center;background:#f8f9fa}
    .preview{background:#f8f9fa;border-radius:8px;padding:15px;margin:15px 20px;border-left:4px solid #667eea}
    .preview-head{display:flex;align-items:center;margin-bottom:8px}
    .preview-icon{width:24px;height:24px;background:#667eea;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-right:10px}
    .preview-title{font-size:14px;font-weight:600;color:#333}
    .preview-time{font-size:12px;color:#999;margin-left:auto}
    .preview-content{font-size:13px;color:#666;line-height:1.4}
    .btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin:20px;width:calc(100% - 40px)}
    .btn:hover{box-shadow:0 4px 12px rgba(102,126,234,.30);transform:translateY(-1px)}
    /* bottom nav */
    .nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);max-width:420px;width:100%;display:flex;justify-content:space-around;padding:10px 22px;background:rgba(255,255,255,.92);border:1px solid #e8eef5;border-radius:22px;box-shadow:0 8px 20px rgba(0,0,0,.08);backdrop-filter:saturate(120%) blur(6px)}
    .tab{display:flex;flex-direction:column;align-items:center;color:#7c8b9f;text-decoration:none;font-size:12px;padding:6px 10px;border-radius:14px}
    .tab.active{color:#1677ff;background:rgba(35,136,255,.12);box-shadow:0 6px 12px rgba(35,136,255,.12)}
  </style>
</head>
<body>
  <div class="app">
    <div class="header"><a class="back" href="mine.html">←</a><div class="title">🔔 通知设置</div></div>
    <div class="content">
      <div class="section-title">系统权限</div>
      <div class="section">
        <div class="row"><div class="label">通知权限</div><div class="value">已开启</div></div>
      </div>

      <div class="section-title">推送通知</div>
      <div class="section">
        <div class="row"><div class="label">推送通知</div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="row"><div class="label">声音提醒</div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="row"><div class="label">震动提醒</div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
        <div class="row"><div class="label">LED灯提醒</div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
      </div>

      <div class="section-title">免打扰时间</div>
      <div class="section">
        <div class="row"><div class="label">开启免打扰</div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
        <div class="time"><input type="time" value="22:00"><span style="color:#666;font-weight:500">至</span><input type="time" value="08:00"></div>
      </div>

      <div class="section-title">通知类型</div>
      <div class="section">
        <div class="item"><div class="item-content"><div class="item-title">系统通知</div><div class="item-desc">系统更新、维护公告</div></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="item"><div class="item-content"><div class="item-title">互动通知</div><div class="item-desc">点赞、评论、关注</div></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label><span class="badge">3</span></div>
        <div class="item"><div class="item-content"><div class="item-title">私信通知</div><div class="item-desc">新消息、聊天提醒</div></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="item"><div class="item-content"><div class="item-title">推荐通知</div><div class="item-desc">个性化内容推荐</div></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
      </div>

      <div class="section-title">预览效果</div>
      <div class="section">
        <div class="preview">
          <div class="preview-head"><div class="preview-icon">🔔</div><div class="preview-title">系统通知</div><div class="preview-time">刚刚</div></div>
          <div class="preview-content">您有一条新的系统消息，请及时查看。</div>
        </div>
      </div>

      <button class="btn">保存设置</button>
    </div>
  </div>

  <nav class="nav" aria-label="底部导航">
    <a class="tab" href="map.html"><span>地图</span></a>
    <a class="tab" href="friends-list.html"><span>好友</span></a>
    <a class="tab active" href="mine.html"><span>我的</span></a>
  </nav>
</body>
</html>
