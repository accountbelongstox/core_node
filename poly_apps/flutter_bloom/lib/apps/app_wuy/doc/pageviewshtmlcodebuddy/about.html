<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>关于我们 - 安无忧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eaf6ff,#ffffff);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:420px;margin:0 auto;min-height:100vh;padding:24px 16px}
.logo{display:grid;place-items:center;margin:20px 0}
.logo img{width:120px;height:auto}
.list{margin-top:16px; background:#fff; border:1px solid #e8eef5; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.08)}
.item{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #e8eef5}
.item:last-child{border-bottom:none}
.back{position:fixed;left:50%;top:10px;transform:translateX(-50%);max-width:420px;width:100%;padding:10px 16px;display:flex;align-items:center;z-index:10}
.back a{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);backdrop-filter:saturate(120%) blur(4px);border:1px solid #e8eef5;border-radius:16px;padding:6px 10px;color:#111;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.back a:hover{background:#fff}

.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);max-width:420px;width:100%;display:flex;justify-content:space-around;padding:10px 22px;background:rgba(255,255,255,.92);border:1px solid #e8eef5;border-radius:22px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.tab{display:flex;flex-direction:column;align-items:center;color:#7c8b9f;text-decoration:none;font-size:12px}
.tab.active{color:#1677ff}
/* 导航选中态高亮与毛玻璃 */
.nav{backdrop-filter:saturate(120%) blur(6px)}
.tab{padding:6px 10px;border-radius:14px}
.tab.active{color:#1677ff;background:rgba(35,136,255,.12);box-shadow:0 6px 12px rgba(35,136,255,.12)}
.tab:hover{background:rgba(0,0,0,.06)}
/* 顶部纹理增强 */
.header{position:relative}
.header::after{
  content:"";position:absolute;inset:0;border-bottom-left-radius:20px;border-bottom-right-radius:20px;
  background:
    radial-gradient(140px 100px at 20% 20%, rgba(255,255,255,.30), transparent 70%),
    radial-gradient(180px 120px at 80% 35%, rgba(255,255,255,.24), transparent 76%);
  pointer-events:none;
}
/* 通用滑动开关样式 */
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:#dfe6ee;border:1px solid #cfd8e3;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);transition:all .2s ease}
.switch .slider::after{content:"";position:absolute;top:50%;left:3px;width:18px;height:18px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:all .2s ease}
.switch input:checked + .slider{background:#a7d2ff;border-color:#7db7ff;box-shadow:inset 0 2px 6px rgba(35,136,255,.18)}
.switch input:checked + .slider::after{left:23px}
.switch input:focus-visible + .slider{outline:2px solid #2388ff33;outline-offset:2px}
</style></head>
