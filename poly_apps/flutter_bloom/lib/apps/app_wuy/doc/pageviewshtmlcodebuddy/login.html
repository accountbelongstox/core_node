<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>登录/注册 - 安无忧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg1:#eaf6ff;--bg2:#f7fbff;--bg3:#fff;--primary:#2388ff;--text:#111;--sub:#666;--border:#e8eef5;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.wrapper{max-width:420px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px 16px;display:flex;flex-direction:column}
.hero{position:relative;padding:28px 8px 12px}
.hero::before{content:"";position:absolute;inset:-40px -20%;height:160px;background:
radial-gradient(140px 100px at 20% 20%,rgba(64,158,255,.22),rgba(64,158,255,0) 70%),
radial-gradient(160px 110px at 80% 40%,rgba(34,197,255,.15),rgba(34,197,255,0) 72%);}
h1{margin:0 0 8px;font-size:26px;font-weight:800}
.sub{margin:0;color:var(--sub)}
.form{margin-top:24px;padding:0 8px}
.input{width:100%;height:44px;border:none;border-radius:12px;background:#f1f6fd;box-shadow:inset 0 0 0 1px var(--border);padding:0 14px;margin-bottom:12px;font-size:14px}
.btn{position:relative;width:100%;height:46px;border:none;border-radius:24px;background:linear-gradient(90deg,#8fb8ff,#cfe1ff);color:#000;font-weight:700;box-shadow:0 8px 20px rgba(35,136,255,.15)}
.btn::after{content:"";position:absolute;right:10px;top:-6px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:10px solid rgba(255,255,255,.9);transform:rotate(18deg)}
.footer-tip{margin-top:20px;font-size:12px;color:#8aa0b8;text-align:center}
.footer-tip a{color:var(--primary);text-decoration:none}
.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);max-width:420px;width:100%;display:flex;justify-content:space-around;padding:10px 22px}
.tab{display:flex;flex-direction:column;align-items:center;color:#7c8b9f;font-size:12px;text-decoration:none}
.tab.active{color:var(--primary)}
/* 导航选中态高亮与毛玻璃 */
.nav{backdrop-filter:saturate(120%) blur(6px)}
.tab{padding:6px 10px;border-radius:14px}
.tab.active{color:#1677ff;background:rgba(35,136,255,.12);box-shadow:0 6px 12px rgba(35,136,255,.12)}
.tab:hover{background:rgba(0,0,0,.06)}
/* 顶部纹理增强 */
.hero{position:relative}
.hero::after{
  content:"";position:absolute;inset:-20px -20% auto -20%;
  height:160px;pointer-events:none;
  background:
    radial-gradient(160px 120px at 25% 25%, rgba(64,158,255,.26), rgba(64,158,255,0) 72%),
    radial-gradient(200px 140px at 80% 35%, rgba(34,197,255,.20), rgba(34,197,255,0) 76%);
  filter:blur(1px);
}
/* 通用滑动开关样式（可直接复用） */
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:#dfe6ee;border:1px solid #cfd8e3;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);transition:all .2s ease}
.switch .slider::after{content:"";position:absolute;top:50%;left:3px;width:18px;height:18px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:all .2s ease}
.switch input:checked + .slider{background:#a7d2ff;border-color:#7db7ff;box-shadow:inset 0 2px 6px rgba(35,136,255,.18)}
.switch input:checked + .slider::after{left:23px;background:#fff}
.switch input:focus-visible + .slider{outline:2px solid #2388ff33;outline-offset:2px}
</style></head>
