<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>地图 - 安无忧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.container{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.map{flex:1;position:relative;overflow:hidden;background:#eef2f7}
.map-bg{
  position:absolute;top:0;left:0;width:160%;height:160%;
  background-image:url('https://dummyimage.com/1200x1800/e6edf5/95a5bb.png&text=FAKE+MAP');
  background-size:cover;background-position:center;
  transform:translate(-12%, -8%); /* initial offset */
  transition:transform .05s linear;
}
.toolbox{position:absolute;right:12px;top:20%;display:flex;flex-direction:column;gap:12px;z-index:5}
.float-btn{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#ffffffcc;border:1px solid #e6edf5;color:#55657a;
  box-shadow:0 6px 14px rgba(0,0,0,.10);backdrop-filter:saturate(120%) blur(4px);
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, color .15s ease;
}
.float-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.12);color:#1677ff}
.status-dot{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:44px;height:4px;border-radius:4px;background:#00000033}
.card{
  position:fixed;left:50%;bottom:72px;transform:translateX(-50%);
  max-width:420px;width:90%;background:linear-gradient(90deg,#baf0ff,#e6fbff);
  border:1px solid #e6f3f9;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.06);
  padding:12px;display:flex;gap:10px;align-items:center
}
.avatar{width:44px;height:44px;border-radius:50%;background:#eee;overflow:hidden}
.info{flex:1}
.info .name{font-weight:700}
.info .sub{font-size:12px;color:#666}
.icon-btn{color:#333}
.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);max-width:420px;width:100%;display:flex;justify-content:space-around;padding:10px 22px;background:transparent}
.tab{display:flex;flex-direction:column;align-items:center;color:#7c8b9f;text-decoration:none;font-size:12px}
.tab.active{color:#2388ff}
/* 导航选中态高亮与毛玻璃 */
.nav{backdrop-filter:saturate(120%) blur(6px)}
.tab{padding:6px 10px;border-radius:14px}
.tab.active{color:#1677ff;background:rgba(35,136,255,.12);box-shadow:0 6px 12px rgba(35,136,255,.12)}
.tab:hover{background:rgba(0,0,0,.06)}
/* 通用滑动开关样式 */
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:#dfe6ee;border:1px solid #cfd8e3;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);transition:all .2s ease}
.switch .slider::after{content:"";position:absolute;top:50%;left:3px;width:18px;height:18px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:all .2s ease}
.switch input:checked + .slider{background:#a7d2ff;border-color:#7db7ff;box-shadow:inset 0 2px 6px rgba(35,136,255,.18)}
.switch input:checked + .slider::after{left:23px}
.switch input:focus-visible + .slider{outline:2px solid #2388ff33;outline-offset:2px}

<script>
  (function(){
    const map = document.getElementById('map');
    const bg = document.getElementById('mapBg');
    let dragging = false, startX = 0, startY = 0, curX = -0.12, curY = -0.08; // percents
    // Convert percent offsets to transform
    function applyTransform(){ bg.style.transform = 'translate(' + (curX*100) + '%, ' + (curY*100) + '%)'; }

    function onDown(e){
      dragging = true;
      const p = ('touches' in e) ? e.touches[0] : e;
      startX = p.clientX; startY = p.clientY;
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const p = ('touches' in e) ? e.touches[0] : e;
      const dx = p.clientX - startX;
      const dy = p.clientY - startY;
      // translate relative to container size to get percent movement
      const w = map.clientWidth, h = map.clientHeight;
      curX += dx / w; curY += dy / h;
      // clamp a bit so background doesn't leave empty edges too far
      curX = Math.max(-0.6, Math.min(0.1, curX));
      curY = Math.max(-0.6, Math.min(0.1, curY));
      startX = p.clientX; startY = p.clientY;
      applyTransform();
      e.preventDefault();
    }
    function onUp(){ dragging = false; }
    map.addEventListener('mousedown', onDown);
    map.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    map.addEventListener('touchstart', onDown, {passive:false});
    map.addEventListener('touchmove', onMove, {passive:false});
    map.addEventListener('touchend', onUp);
  })();
</script>
