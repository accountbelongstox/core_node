// Note: Plugin versions are now managed in settings.gradle using the plugins DSL
// This is the recommended approach for Gradle 7.0+
// The buildscript block is kept minimal for backward compatibility
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // Most plugins are now defined in settings.gradle
    // Only add plugins here if they specifically require buildscript classpath
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
