<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言选择 - 企业通讯</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f7f7f7;
            color: #333;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            position: relative;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            background: #fff;
            font-size: 14px;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .header-icons {
            width: 60px;
            display: flex;
            align-items: center;
        }

        .header-icons.left i {
            font-size: 20px;
            color: #333;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .language-list {
            padding: 12px 0;
        }

        .language-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #fff;
            border-bottom: 1px solid #f5f5f5;
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
        }

        .language-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .language-name {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .language-native {
            font-size: 14px;
            color: #999;
        }

        .selected-icon {
            color: #007AFF;
            font-size: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .language-item:nth-child(1) { animation-delay: 0.1s; }
        .language-item:nth-child(2) { animation-delay: 0.15s; }
        .language-item:nth-child(3) { animation-delay: 0.2s; }
        .language-item:nth-child(4) { animation-delay: 0.25s; }
        .language-item:nth-child(5) { animation-delay: 0.3s; }
        .language-item:nth-child(6) { animation-delay: 0.35s; }
        .language-item:nth-child(7) { animation-delay: 0.4s; }
        .language-item:nth-child(8) { animation-delay: 0.45s; }
        .language-item:nth-child(9) { animation-delay: 0.5s; }
        .language-item:nth-child(10) { animation-delay: 0.55s; }

        .language-item:active {
            background: #f5f5f5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #eee;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 12px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #007AFF;
        }

        .connecting-status {
            text-align: center;
            padding: 8px;
            background: #f8f8f8;
            color: #666;
            font-size: 14px;
        }

        .complete-btn {
            position: absolute;
            top: 10px;
            right: 16px;
            color: #007AFF;
            font-size: 16px;
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="time">16:16</div>
            <div class="status-icons">
                <i class="fab fa-bluetooth-b"></i>
                <i class="fas fa-signal"></i>
                <span class="battery">58%</span>
            </div>
        </div>

        <!-- 头部 -->
        <header>
            <div class="header-icons left">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="connecting-status">连接中...</div>
            <button class="complete-btn">完成</button>
        </header>

        <!-- 语言列表 -->
        <div class="language-list">
            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">简体中文</div>
                    <div class="language-native">Simplified Chinese</div>
                </div>
                <i class="fas fa-check selected-icon"></i>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">English</div>
                    <div class="language-native">English</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">日本語</div>
                    <div class="language-native">Japanese</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">한국어</div>
                    <div class="language-native">Korean</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">Français</div>
                    <div class="language-native">French</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">Deutsch</div>
                    <div class="language-native">German</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">Español</div>
                    <div class="language-native">Spanish</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">Italiano</div>
                    <div class="language-native">Italian</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">Português</div>
                    <div class="language-native">Portuguese</div>
                </div>
            </div>

            <div class="language-item">
                <div class="language-info">
                    <div class="language-name">Русский</div>
                    <div class="language-native">Russian</div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-comment"></i>
                <span>聊天</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-address-book"></i>
                <span>联系人</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>
    </div>

    <script>
        // 更新时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // 语言项点击效果
        document.querySelectorAll('.language-item').forEach(item => {
            item.addEventListener('click', function() {
                // 移除其他项的选中状态
                document.querySelectorAll('.language-item .selected-icon').forEach(icon => {
                    icon.remove();
                });
                
                // 添加新的选中状态
                if (!this.querySelector('.selected-icon')) {
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-check selected-icon';
                    this.appendChild(icon);
                }

                // 点击效果
                this.style.backgroundColor = '#f5f5f5';
                setTimeout(() => {
                    this.style.backgroundColor = '#fff';
                }, 200);
            });
        });

        // 返回按钮点击效果
        document.querySelector('.fa-chevron-left').addEventListener('click', () => {
            history.back();
        });

        // 完成按钮点击效果
        document.querySelector('.complete-btn').addEventListener('click', () => {
            window.location.href = '1.html';
        });
    </script>
</body>
</html>
