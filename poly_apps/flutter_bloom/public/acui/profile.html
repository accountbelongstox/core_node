<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 企业通讯</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f7f7f7;
            color: #333;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            position: relative;
            padding-bottom: 60px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            background: #fff;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .profile-header {
            padding: 20px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .profile-details {
            flex: 1;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-id {
            color: #666;
            font-size: 14px;
        }

        .qr-code {
            width: 24px;
            height: 24px;
            color: #666;
        }

        .profile-hint {
            background: #f8f8f8;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        .hint-icon {
            width: 24px;
            height: 24px;
            background: #34c759;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .hint-text {
            color: #666;
            font-size: 14px;
            flex: 1;
        }

        .settings-group {
            margin-top: 10px;
            background: #fff;
        }

        .settings-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f5f5f5;
            animation: slideIn 0.3s ease forwards;
        }

        .settings-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }

        .icon-privacy { background: #007AFF; }
        .icon-notification { background: #ff9500; }
        .icon-language { background: #5856d6; }

        .settings-icon i {
            color: #fff;
            font-size: 16px;
        }

        .settings-content {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-label {
            font-size: 16px;
            color: #333;
        }

        .settings-arrow {
            color: #ccc;
        }

        .version-info {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 13px;
            position: absolute;
            bottom: 60px;
            width: 100%;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #eee;
            max-width: 600px;
            margin: 0 auto;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 12px;
            position: relative;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #34c759;
        }

        .nav-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: #ff3b30;
            color: #fff;
            border-radius: 12px;
            padding: 0 6px;
            font-size: 12px;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="time">16:15</div>
            <div class="status-icons">
                <i class="fab fa-bluetooth-b"></i>
                <i class="fas fa-signal"></i>
                <span class="battery">58%</span>
            </div>
        </div>

        <!-- 个人资料头部 -->
        <div class="profile-header">
            <div class="profile-info">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f0f0f0'/%3E%3Ctext x='50' y='50' font-family='Arial' font-size='40' fill='%23999' text-anchor='middle' dy='.3em'%3E头像%3C/text%3E%3C/svg%3E" alt="Profile" class="profile-avatar">
                <div class="profile-details">
                    <div class="profile-name">张经理</div>
                    <div class="profile-id">工号: PM8023</div>
                </div>
            </div>
            <i class="fas fa-qrcode qr-code"></i>
        </div>

        <!-- 提示信息 -->
        <div class="profile-hint">
            <div class="hint-icon">
                <i class="fas fa-pencil-alt"></i>
            </div>
            <div class="hint-text">完善您的个人资料，让同事更好地了解您</div>
        </div>

        <!-- 设置列表 -->
        <div class="settings-group">
            <div class="settings-item">
                <div class="settings-icon icon-privacy">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="settings-content">
                    <div class="settings-label">隐私安全</div>
                    <i class="fas fa-chevron-right settings-arrow"></i>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon icon-notification">
                    <i class="fas fa-bell"></i>
                </div>
                <div class="settings-content">
                    <div class="settings-label">通知声音</div>
                    <i class="fas fa-chevron-right settings-arrow"></i>
                </div>
            </div>
            <div class="settings-item">
                <div class="settings-icon icon-language">
                    <i class="fas fa-globe"></i>
                </div>
                <div class="settings-content">
                    <div class="settings-label">语言设置</div>
                    <i class="fas fa-chevron-right settings-arrow"></i>
                </div>
            </div>
        </div>

        <!-- 版本信息 -->
        <div class="version-info">
            企业通讯 Android Client v1.0.5
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <div class="nav-item">
                <i class="fas fa-comment"></i>
                <span>聊天</span>
                <span class="nav-badge">99+</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-address-book"></i>
                <span>联系人</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="nav-item active">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>
    </div>

    <script>
        // 更新时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // 设置项点击效果
        document.querySelectorAll('.settings-item').forEach(item => {
            item.addEventListener('click', function() {
                this.style.backgroundColor = '#f5f5f5';
                setTimeout(() => {
                    this.style.backgroundColor = '';
                }, 200);
            });
        });

        // 底部导航点击效果
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(nav => {
                    nav.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        // 个人资料点击效果
        document.querySelector('.profile-header').addEventListener('click', function() {
            this.style.backgroundColor = '#f5f5f5';
            setTimeout(() => {
                this.style.backgroundColor = '';
            }, 200);
        });

        // QR码点击效果
        document.querySelector('.qr-code').addEventListener('click', function(e) {
            e.stopPropagation();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
                this.style.transform = '';
            }, 200);
        });
    </script>
</body>
</html>
