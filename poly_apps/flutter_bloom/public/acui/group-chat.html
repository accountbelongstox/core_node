<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群聊 - 企业通讯</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f7f7f7;
            color: #333;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            position: relative;
            padding-bottom: 60px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            background: #fff;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 24px;
            z-index: 99;
        }

        .back-btn {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            cursor: pointer;
        }

        .header-title {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .group-avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #007AFF;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        .header-actions i {
            font-size: 20px;
            color: #333;
        }

        .chat-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        .message.sent {
            align-self: flex-end;
            background: #007AFF;
            color: #fff;
        }

        .message.received {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
        }

        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }

        .input-container {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: #fff;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #eee;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-box {
            flex: 1;
            background: #f5f5f5;
            border-radius: 20px;
            padding: 8px 16px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #007AFF;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #eee;
            max-width: 600px;
            margin: 0 auto;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 12px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #007AFF;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="time">16:15</div>
            <div class="status-icons">
                <i class="fab fa-bluetooth-b"></i>
                <i class="fas fa-signal"></i>
                <span class="battery">58%</span>
            </div>
        </div>

        <!-- 头部 -->
        <header>
            <div class="back-btn" onclick="window.location.href='chat-list.html'">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="header-title" onclick="window.location.href='chat-details.html'">
                <div class="group-avatar">APP</div>
                <h1>移动端开发组</h1>
            </div>
            <div class="header-actions">
                <i class="fas fa-search"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </header>

        <!-- 聊天内容 -->
        <div class="chat-container">
            <div class="message received">
                <div class="message-content">大家早上好，今天我们要讨论新版本UI的设计方案。</div>
                <div class="message-time">09:30</div>
            </div>

            <div class="message sent">
                <div class="message-content">好的，我已经准备好了设计稿。</div>
                <div class="message-time">09:32</div>
            </div>

            <div class="message received">
                <div class="message-content">请把设计稿上传到共享文件夹，我们一起来review。</div>
                <div class="message-time">09:33</div>
            </div>

            <div class="message sent">
                <div class="message-content">已经上传了，在"UI设计/2024-02-24"文件夹中。</div>
                <div class="message-time">09:35</div>
            </div>
        </div>

        <!-- 输入框 -->
        <div class="input-container">
            <input type="text" class="input-box" placeholder="输入消息...">
            <div class="send-btn">
                <i class="fas fa-paper-plane"></i>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='chat-list.html'">
                <i class="fas fa-comment"></i>
                <span>聊天</span>
            </div>
            <div class="nav-item" onclick="window.location.href='new-chat.html'">
                <i class="fas fa-address-book"></i>
                <span>联系人</span>
            </div>
            <div class="nav-item" onclick="window.location.href='chat-list-alt.html'">
                <i class="fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="nav-item" onclick="window.location.href='profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>
    </div>

    <script>
        // 更新时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // 底部导航点击效果
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(nav => {
                    nav.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        // 发送消息功能
        const inputBox = document.querySelector('.input-box');
        const sendBtn = document.querySelector('.send-btn');
        const chatContainer = document.querySelector('.chat-container');

        function sendMessage() {
            const message = inputBox.value.trim();
            if (message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.innerHTML = `
                    <div class="message-content">${message}</div>
                    <div class="message-time">${new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'})}</div>
                `;
                chatContainer.appendChild(messageDiv);
                inputBox.value = '';
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
