<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发起聊天 - 聊天APP</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="time">2:41</div>
            <div class="status-icons">
                <i class="fab fa-bluetooth-b"></i>
                <i class="fas fa-moon"></i>
                <i class="fas fa-signal"></i>
                <span class="battery">33%</span>
            </div>
        </div>

        <!-- 头部 -->
        <header>
            <div class="header-icons left">
            </div>
            <h1>发起聊天</h1>
            <div class="header-icons right">
                <span class="cancel-btn">取消</span>
            </div>
        </header>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <div class="search-input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="搜索用户">
            </div>
        </div>

        <!-- 联系人列表 -->
        <div class="contact-list">
            <div class="contact-item">
                <div class="avatar" style="background-color: #4CAF50;">张</div>
                <div class="contact-info">
                    <h3>张经理</h3>
                    <p class="last-seen">最近上线于 2月24日 14:02</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="avatar" style="background-color: #2196F3;">李</div>
                <div class="contact-info">
                    <h3>李工程师</h3>
                    <p class="last-seen">最近上线于 2月24日 13:45</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="avatar" style="background-color: #9C27B0;">王</div>
                <div class="contact-info">
                    <h3>王设计师</h3>
                    <p class="last-seen">最近上线于 2月24日 13:30</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="avatar" style="background-color: #FF9800;">刘</div>
                <div class="contact-info">
                    <h3>刘产品</h3>
                    <p class="last-seen">最近上线于 2月24日 13:15</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="avatar" style="background-color: #795548;">陈</div>
                <div class="contact-info">
                    <h3>陈测试</h3>
                    <p class="last-seen">最近上线于 2月24日 12:50</p>
                </div>
            </div>
        </div>

        <!-- 字母导航栏 -->
        <div class="alphabet-index">
            <div class="letter">A</div>
            <div class="letter">B</div>
            <div class="letter">C</div>
            <div class="letter">D</div>
            <div class="letter">E</div>
            <div class="letter">F</div>
            <div class="letter">G</div>
            <div class="letter">H</div>
            <div class="letter">I</div>
            <div class="letter">J</div>
            <div class="letter">K</div>
            <div class="letter">L</div>
            <div class="letter">M</div>
            <div class="letter">N</div>
            <div class="letter">O</div>
            <div class="letter">P</div>
            <div class="letter">Q</div>
            <div class="letter">R</div>
            <div class="letter">S</div>
            <div class="letter">T</div>
            <div class="letter">U</div>
            <div class="letter">V</div>
            <div class="letter">W</div>
            <div class="letter active">X</div>
            <div class="letter">Y</div>
            <div class="letter">Z</div>
            <div class="letter">#</div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <div class="nav-item">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-item">
                <i class="fas fa-square"></i>
            </div>
            <div class="nav-item">
                <i class="fas fa-chevron-left"></i>
            </div>
        </nav>
    </div>
    <script src="scripts/script.js"></script>
</body>
</html>
