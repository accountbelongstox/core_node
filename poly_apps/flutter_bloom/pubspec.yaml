name: qyflutter
description: "QianYuWords for Android and iOS and Web"
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.2
  cupertino_icons: ^1.0.2
  smooth_page_indicator: ^1.1.0
  file_picker: ^10.0.0
  http: ^1.1.2
  shared_preferences: ^2.2.2
  pin_code_fields: ^8.0.1
  intl:
  connectivity_plus:
  path_provider:
  url_strategy:
  cached_network_image:
  image_picker:
  path:
  dartdoc:
  fluttertoast:
  flutter_spinkit: ^5.2.1
  country_code_picker: ^3.0.0
  syncfusion_flutter_datepicker: ^30.1.42
  flutter_svg: ^2.0.10+1
  vibration: ^3.1.3
  shimmer: ^3.0.0
  url_launcher: ^6.2.6
  carousel_slider: ^5.0.0
  table_calendar: ^3.0.9
  percent_indicator: ^4.2.3
  flutter_local_notifications: ^19.0.0
  # flutter_native_splash: ^2.4.6  # Temporarily disabled to avoid CMake requirement
  sqlite3: ^2.7.5
  json_annotation: ^4.9.0
  idb_shim: ^2.6.5+1
  provider: ^6.1.4
  chinese_font_library: ^1.2.0
  get: ^4.7.2
  go_router: ^16.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.3
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  font_awesome_flutter: ^10.10.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    # Common assets (shared across all apps) - New organized structure
    - assets/common/icons/
    - assets/common/images/
    - assets/common/launch/
    - assets/common/fonts/

    # App-specific assets - New organized structure
    # - assets/apps/app_example/icons/
    # - assets/apps/app_example/images/
    # - assets/apps/app_example/launch/

    - assets/apps/app_achat/icons/
    - assets/apps/app_achat/images/
    - assets/apps/app_achat/launch/
    # - assets/.extra_achat/icons
    # - assets/.extra_achat/images/
    # - assets/.extra_achat/launch/

    - assets/apps/app_wuy/icons/
    - assets/apps/app_wuy/images/
    - assets/apps/app_wuy/launch/

    - assets/apps/app_bank/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/common/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/common/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/common/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/common/fonts/Roboto-Black.ttf
          weight: 900
    - family: CN_font
      fonts:
        - asset: assets/common/fonts/SourceHanSansCNLight.otf
          weight: 300
        - asset: assets/common/fonts/SourceHanSansCNLight.otf
          weight: 500
        - asset: assets/common/fonts/SourceHanSansCNLight.otf
          weight: 700
        - asset: assets/common/fonts/SourceHanSansCNLight.otf
          weight: 900


