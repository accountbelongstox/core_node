<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torus WebGL Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ========== Theme Token：所有审美与性能参数集中管理 ==========
    const ThemeToken = {
      // 几何
      torusMajorRadius: 1.8,
      torusMinorRadius: 0.55,
      numMeridians: 220,
      segmentsPerMeridian: 120,
      particleCount: 12000,
      particleSpread: 1.08,
      // 色彩 (顶点渐变：中心→外围)
      primaryColor: '#00BFFF',   // 深电蓝 (中心/内侧)
      secondaryColor: '#BF00FF', // 电紫 (外围)
      particleColor: '#FFB6C1', // 淡粉
      particleColorAlt: '#FFE4E1', // 柔和白粉
      backgroundHex: 0x000000,
      // 线条与发光
      lineWidthInner: 1.8,
      lineWidthOuter: 0.6,
      bloomStrength: 1.6,
      bloomRadius: 0.45,
      bloomThreshold: 0.25,
      // 运动
      flowSpeed: 0.42,
      rotationSpeedY: 0.12,
      particleBreathSpeed: 0.8,
      particleBreathAmount: 0.35,
      // 交互：鼠标距离对流速的影响 [minMultiplier, maxMultiplier]
      mouseInfluenceRadius: 0.35,
      mouseFlowMin: 0.6,
      mouseFlowMax: 1.45,
    };

    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ThemeToken.backgroundHex);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 0, 6.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // ---------- 参数化托勒斯：生成纤维线几何 ----------
    const R = ThemeToken.torusMajorRadius;
    const r = ThemeToken.torusMinorRadius;
    const nu = ThemeToken.numMeridians;
    const nv = ThemeToken.segmentsPerMeridian;

    const torusPositions = [];
    const torusColors = [];
    const torusParams = []; // 0..1 沿线条，用于流动
    const torusGradient = []; // 0..1 中心蓝 -> 外围紫

    for (let i = 0; i < nu; i++) {
      const u = (i / nu) * Math.PI * 2;
      for (let j = 0; j <= nv; j++) {
        const v = (j / nv) * Math.PI * 2;
        const x = (R + r * Math.cos(v)) * Math.cos(u);
        const y = (R + r * Math.cos(v)) * Math.sin(u);
        const z = r * Math.sin(v);
        torusPositions.push(x, y, z);
        const param = j / nv;
        torusParams.push(param);
        const radialDist = Math.sqrt(x * x + y * y);
        const gradientT = (radialDist - (R - r)) / (2 * r);
        torusGradient.push(Math.max(0, Math.min(1, gradientT)));
      }
    }

    const lineIndices = [];
    for (let i = 0; i < nu; i++) {
      const base = i * (nv + 1);
      for (let j = 0; j < nv; j++) {
        lineIndices.push(base + j, base + j + 1);
      }
    }

    const lineGeometry = new THREE.BufferGeometry();
    const posAttr = new Float32Array(lineIndices.length * 3);
    const colorAttr = new Float32Array(lineIndices.length * 3);
    const paramAttr = new Float32Array(lineIndices.length);
    const gradAttr = new Float32Array(lineIndices.length);

    const c1 = new THREE.Color(ThemeToken.primaryColor);
    const c2 = new THREE.Color(ThemeToken.secondaryColor);
    for (let i = 0; i < lineIndices.length; i++) {
      const idx = lineIndices[i];
      posAttr[i * 3] = torusPositions[idx * 3];
      posAttr[i * 3 + 1] = torusPositions[idx * 3 + 1];
      posAttr[i * 3 + 2] = torusPositions[idx * 3 + 2];
      const t = torusGradient[idx];
      const col = c1.clone().lerp(c2, t);
      colorAttr[i * 3] = col.r;
      colorAttr[i * 3 + 1] = col.g;
      colorAttr[i * 3 + 2] = col.b;
      paramAttr[i] = torusParams[idx];
      gradAttr[i] = t;
    }

    lineGeometry.setAttribute('position', new THREE.BufferAttribute(posAttr, 3));
    lineGeometry.setAttribute('color', new THREE.BufferAttribute(colorAttr, 3));
    lineGeometry.setAttribute('param', new THREE.BufferAttribute(paramAttr, 1));
    lineGeometry.setAttribute('gradient', new THREE.BufferAttribute(gradAttr, 1));

    const lineMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      vertexColors: true,
      vertexShader: `
        attribute float param;
        attribute float gradient;
        uniform float uTime;
        uniform float uFlowSpeed;
        varying vec3 vColor;
        varying float vFlow;
        void main() {
          vColor = color;
          float flow = fract(param + uTime * uFlowSpeed);
          vFlow = flow;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vFlow;
        uniform float uTime;
        void main() {
          float band = smoothstep(0.0, 0.08, vFlow) * smoothstep(0.25, 0.08, vFlow);
          float lum = 1.0 + 1.8 * band;
          gl_FragColor = vec4(vColor * lum, 0.92);
        }
      `,
      uniforms: {
        uTime: { value: 0 },
        uFlowSpeed: { value: ThemeToken.flowSpeed },
      },
    });

    const lineMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lineMesh);

    // ---------- 粒子层 ----------
    const particlePositions = new Float32Array(ThemeToken.particleCount * 3);
    const particleRandoms = new Float32Array(ThemeToken.particleCount * 2);
    const spread = ThemeToken.particleSpread;
    for (let i = 0; i < ThemeToken.particleCount; i++) {
      const u = Math.random() * Math.PI * 2;
      const v = Math.random() * Math.PI * 2;
      const rr = r * (0.92 + Math.random() * 0.2) * spread;
      const RR = R * (0.98 + (Math.random() - 0.5) * 0.08);
      const x = (RR + rr * Math.cos(v)) * Math.cos(u);
      const y = (RR + rr * Math.cos(v)) * Math.sin(u);
      const z = rr * Math.sin(v);
      particlePositions[i * 3] = x;
      particlePositions[i * 3 + 1] = y;
      particlePositions[i * 3 + 2] = z;
      particleRandoms[i * 2] = Math.random();
      particleRandoms[i * 2 + 1] = Math.random();
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeometry.setAttribute('phase', new THREE.BufferAttribute(particleRandoms, 2));

    const particleMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      vertexShader: `
        attribute vec2 phase;
        uniform float uTime;
        uniform float uBreathSpeed;
        uniform float uBreathAmount;
        varying float vAlpha;
        void main() {
          float breath = 1.0 + uBreathAmount * sin(uTime * uBreathSpeed + phase.x * 6.28);
          vAlpha = 0.5 + 0.4 * sin(uTime * 0.7 + phase.y * 6.28);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = 2.2 * breath * (1.0 / -mv.z);
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5) * 2.0;
          float circle = 1.0 - smoothstep(0.6, 1.0, d);
          gl_FragColor = vec4(1.0, 0.85, 0.9, circle * vAlpha);
        }
      `,
      uniforms: {
        uTime: { value: 0 },
        uBreathSpeed: { value: ThemeToken.particleBreathSpeed },
        uBreathAmount: { value: ThemeToken.particleBreathAmount },
      },
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // ---------- 中心亮点（几何中心孔洞处的光晕） ----------
    const centerLight = new THREE.PointLight(0xffffff, 2.5, 8);
    centerLight.position.set(0, 0, 0);
    scene.add(centerLight);

    const centerGlowGeometry = new THREE.SphereGeometry(0.12, 16, 16);
    const centerGlowMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.85,
    });
    const centerGlow = new THREE.Mesh(centerGlowGeometry, centerGlowMaterial);
    centerGlow.position.set(0, 0, 0);
    scene.add(centerGlow);

    // ---------- 后期：Bloom ----------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      ThemeToken.bloomStrength,
      ThemeToken.bloomRadius,
      ThemeToken.bloomThreshold
    );
    composer.addPass(bloomPass);

    // ---------- 鼠标交互：流速随距离变化 ----------
    const mouse = new THREE.Vector2(0, 0);
    const mouseNormalized = new THREE.Vector2(0.5, 0.5);
    function onMouseMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      mouseNormalized.x = (e.clientX / window.innerWidth);
      mouseNormalized.y = 1 - (e.clientY / window.innerHeight);
    }
    window.addEventListener('mousemove', onMouseMove);

    function getFlowMultiplier() {
      const dx = mouseNormalized.x - 0.5;
      const dy = mouseNormalized.y - 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const r = ThemeToken.mouseInfluenceRadius;
      if (dist >= r) return 1.0;
      const t = dist / r;
      return ThemeToken.mouseFlowMin + (1.0 - t) * (ThemeToken.mouseFlowMax - ThemeToken.mouseFlowMin);
    }

    // ---------- 窗口缩放 ----------
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      composer.setSize(w, h);
      composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      bloomPass.resolution.set(w, h);
    }
    window.addEventListener('resize', onResize);

    // ---------- 动画循环（60fps 优化：统一 update uniforms） ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const flowMult = getFlowMultiplier();

      lineMesh.rotation.y = t * ThemeToken.rotationSpeedY;
      particles.rotation.y = t * ThemeToken.rotationSpeedY;
      centerGlow.rotation.y = t * 0.2;

      lineMaterial.uniforms.uTime.value = t;
      lineMaterial.uniforms.uFlowSpeed.value = ThemeToken.flowSpeed * flowMult;
      particleMaterial.uniforms.uTime.value = t;

      composer.render();
    }
    animate();
  </script>
</body>
</html>
