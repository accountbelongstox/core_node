<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OKX Price Monitor - Real-time Cryptocurrency Monitoring</title>

    <!-- CSS Files - Ordered by dependency -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading OKX Price Monitor...</div>
    </div>

    <!-- Application Container -->
    <div id="app-container">
        <!-- Top Menu Bar -->
        <header class="top-menu">
            <div class="menu-left">
                <div class="app-logo">
                    <span class="logo-icon">📊</span>
                    <span class="logo-text">OKX Price Monitor</span>
                </div>
            </div>
            <div class="menu-center">
                <ul class="nav-items" id="top-nav-items">
                    <!-- Dynamically populated from config -->
                </ul>
            </div>
            <div class="menu-right">
                <div class="status-indicator">
                    <span class="status-dot online" id="status-dot"></span>
                    <span class="status-text" id="status-text">Online</span>
                </div>
                <div class="user-menu" id="user-menu">
                    <span class="user-icon">👤</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area (Left + Center + Right) -->
        <div class="main-content">
            <!-- Left Sidebar Menu -->
            <aside class="left-menu" id="left-menu">
                <div class="menu-header">
                    <h3 class="menu-title">Navigation</h3>
                    <button class="menu-toggle-btn" id="left-menu-toggle">
                        <span>☰</span>
                    </button>
                </div>
                <nav class="menu-nav">
                    <ul class="menu-items" id="left-menu-items">
                        <!-- Dynamically populated from config -->
                    </ul>
                </nav>
            </aside>

            <!-- Center Content Area -->
            <main class="center-content">
                <div class="content-header">
                    <div>
                        <h1 id="page-title">Loading...</h1>
                        <p id="page-description" class="text-muted"></p>
                    </div>
                    <div class="content-actions" id="page-actions">
                        <!-- Page-specific actions -->
                    </div>
                </div>
                <div class="page-content" id="page-content">
                    <!-- Page content loaded here -->
                </div>
            </main>

            <!-- Right Sidebar -->
            <aside class="right-menu" id="right-menu">
                <div class="menu-header">
                    <h3 class="menu-title">Quick Info</h3>
                    <button class="menu-toggle-btn" id="right-menu-toggle">
                        <span>☰</span>
                    </button>
                </div>
                <div class="info-sections" id="right-info-sections">
                    <!-- System Info Section -->
                    <div class="info-section">
                        <h4 class="section-title">
                            <span class="section-icon">📊</span>
                            System Status
                        </h4>
                        <div class="section-content">
                            <div class="stat-item">
                                <span class="stat-label">Total Coins</span>
                                <span class="stat-value" id="stat-total-coins">-</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Active Alerts</span>
                                <span class="stat-value" id="stat-active-alerts">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Monitoring</span>
                                <span class="stat-value" id="stat-monitoring-status">Stopped</span>
                            </div>
                        </div>
                    </div>

                    <!-- Real-time Stats Section -->
                    <div class="info-section">
                        <h4 class="section-title">
                            <span class="section-icon">⚡</span>
                            Real-time Stats
                        </h4>
                        <div class="section-content">
                            <div class="stat-item">
                                <span class="stat-label">Update Rate</span>
                                <span class="stat-value" id="stat-update-rate">-</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Last Update</span>
                                <span class="stat-value" id="stat-last-update">Never</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Bottom Menu / Footer -->
        <footer class="bottom-menu">
            <div class="footer-left">
                <div class="footer-item">
                    <span class="footer-icon">©</span>
                    <span class="footer-text">2025 OKX Price Monitor</span>
                </div>
            </div>
            <div class="footer-center">
                <div class="footer-item">
                    <span class="footer-icon">🟢</span>
                    <span class="footer-text" id="footer-status">System Ready</span>
                </div>
            </div>
            <div class="footer-right">
                <div class="footer-item">
                    <span class="footer-icon">v</span>
                    <span class="footer-text">1.0.0</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- External Libraries -->
    <!-- ECharts for charts (from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- Application JavaScript - Ordered by dependency -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/menu.js"></script>

    <!-- Page Scripts -->
    <script src="js/pages/history_stats.js"></script>
    <script src="js/pages/monitoring.js"></script>
    <script src="js/pages/trading.js"></script>
    <script src="js/pages/alerts.js"></script>
    <script src="js/pages/config.js"></script>
    <script src="js/pages/stats.js"></script>

    <!-- Main Application -->
    <script src="js/app.js"></script>
</body>
</html>
