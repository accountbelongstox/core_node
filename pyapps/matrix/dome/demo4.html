<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机占位图 - 粒子效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-container {
            position: relative;
            width: 375px;
            height: 812px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.11) 0%,
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.11) 100%);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 
                0 0 75px rgba(255, 255, 255, 0.38),
                inset 0 0 48px rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(24px);
            border: 2px solid rgba(255, 255, 255, 0.24);
            overflow: hidden;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.28);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        .holographic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                conic-gradient(from 0deg at 50% 50%,
                    rgba(255, 255, 255, 0.1) 0deg,
                    transparent 60deg,
                    rgba(255, 255, 255, 0.1) 120deg,
                    transparent 180deg,
                    rgba(255, 255, 255, 0.1) 240deg,
                    transparent 300deg,
                    rgba(255, 255, 255, 0.1) 360deg);
            animation: rotate-holographic 8s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate-holographic {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            animation: particle-float linear infinite;
        }

        @keyframes particle-float {
            to {
                transform: translateY(-800px) translateX(var(--dx));
                opacity: 0;
            }
        }

        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.92);
            font-size: 18px;
            text-align: center;
            z-index: 10;
            text-shadow: 
                0 0 22px rgba(255, 255, 255, 0.85),
                0 0 44px rgba(255, 255, 255, 0.45);
            animation: breathe 2.2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { 
                opacity: 0.75;
                transform: translate(-50%, -50%) scale(0.98);
            }
            50% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.02);
            }
        }

        .blur-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 40% 30%, rgba(255, 255, 255, 0.13) 0%, transparent 50%),
                radial-gradient(circle at 60% 70%, rgba(255, 255, 255, 0.13) 0%, transparent 50%);
            filter: blur(38px);
            opacity: 0.58;
            pointer-events: none;
        }

        .phone-icon {
            font-size: 70px;
            margin-bottom: 28px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="blur-layer"></div>
            <div class="holographic-overlay"></div>
            <div id="particleContainer"></div>
            <div class="waiting-text">
                <span class="phone-icon">📱</span>
                <div>等待设备连接</div>
                <div style="font-size: 13px; margin-top: 14px; opacity: 0.78;">Waiting for device...</div>
            </div>
        </div>
    </div>

    <script>
        const particleContainer = document.getElementById('particleContainer');
        
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 3 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = '100%';
            particle.style.animationDuration = (Math.random() * 4 + 3) + 's';
            particle.style.animationDelay = Math.random() * 1 + 's';
            particle.style.opacity = Math.random() * 0.5 + 0.5;
            particle.style.setProperty('--dx', (Math.random() * 100 - 50) + 'px');
            particleContainer.appendChild(particle);
            
            setTimeout(() => particle.remove(), 8000);
        }
        
        setInterval(createParticle, 150);
        for (let i = 0; i < 15; i++) {
            setTimeout(createParticle, i * 100);
        }
    </script>
</body>
</html>
