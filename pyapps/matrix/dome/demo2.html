<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机占位图 - Emoji浮动效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-container {
            position: relative;
            width: 375px;
            height: 812px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.12) 100%);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 
                0 0 80px rgba(255, 255, 255, 0.4),
                inset 0 0 50px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            overflow: hidden;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        .holographic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, 0.1) 0px,
                    transparent 2px,
                    transparent 4px,
                    rgba(255, 255, 255, 0.1) 6px),
                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    transparent 50%,
                    rgba(255, 255, 255, 0.15) 100%);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .emoji-float {
            position: absolute;
            font-size: 40px;
            opacity: 0.7;
            filter: blur(1px);
            animation: float linear infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        @keyframes float {
            to {
                transform: translateY(-900px) rotate(360deg);
                opacity: 0;
            }
        }

        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 20px;
            text-align: center;
            z-index: 10;
            text-shadow: 
                0 0 25px rgba(255, 255, 255, 0.9),
                0 0 50px rgba(255, 255, 255, 0.5);
            animation: glow 2.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { 
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .blur-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            filter: blur(40px);
            opacity: 0.6;
            pointer-events: none;
        }

        .main-emoji {
            font-size: 80px;
            margin-bottom: 30px;
            display: block;
            animation: rotate 3s ease-in-out infinite;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="blur-layer"></div>
            <div class="holographic-overlay"></div>
            <div id="emojiContainer"></div>
            <div class="waiting-text">
                <span class="main-emoji">📱</span>
                <div>等待连接设备</div>
                <div style="font-size: 14px; margin-top: 15px; opacity: 0.8;">Waiting for device...</div>
            </div>
        </div>
    </div>

    <script>
        const emojiContainer = document.getElementById('emojiContainer');
        const emojis = ['📱', '💫', '✨', '🌟', '⭐', '🔮', '💎', '⚡', '🌙', '☁️'];
        
        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji-float';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';
            emoji.style.animationDuration = (Math.random() * 3 + 4) + 's';
            emoji.style.animationDelay = Math.random() * 2 + 's';
            emoji.style.fontSize = (Math.random() * 30 + 30) + 'px';
            emojiContainer.appendChild(emoji);
            
            setTimeout(() => emoji.remove(), 7000);
        }
        
        setInterval(createEmoji, 500);
        for (let i = 0; i < 10; i++) {
            setTimeout(createEmoji, i * 200);
        }
    </script>
</body>
</html>
