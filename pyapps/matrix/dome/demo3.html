<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机占位图 - 矩阵代码效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-container {
            position: relative;
            width: 375px;
            height: 812px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0.1) 100%);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 
                0 0 70px rgba(255, 255, 255, 0.35),
                inset 0 0 45px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(22px);
            border: 2px solid rgba(255, 255, 255, 0.22);
            overflow: hidden;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        .holographic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(180deg,
                    rgba(255, 255, 255, 0.2) 0%,
                    transparent 20%,
                    transparent 80%,
                    rgba(255, 255, 255, 0.2) 100%),
                linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.1) 50%,
                    transparent 100%);
            animation: holographic-sweep 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes holographic-sweep {
            0%, 100% { 
                opacity: 0.4;
                transform: translateX(-50px);
            }
            50% { 
                opacity: 0.7;
                transform: translateX(50px);
            }
        }

        .matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.7;
        }

        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 19px;
            text-align: center;
            z-index: 10;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 255, 255, 0.2);
            animation: text-flicker 3s ease-in-out infinite;
        }

        @keyframes text-flicker {
            0%, 100% { opacity: 0.8; }
            25% { opacity: 1; }
            50% { opacity: 0.9; }
            75% { opacity: 1; }
        }

        .blur-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.12) 0%, transparent 45%);
            filter: blur(35px);
            opacity: 0.55;
            pointer-events: none;
        }

        .code-icon {
            font-size: 60px;
            margin-bottom: 25px;
            display: block;
            font-family: monospace;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="blur-layer"></div>
            <div class="holographic-overlay"></div>
            <canvas class="matrix-canvas" id="matrixCanvas"></canvas>
            <div class="waiting-text">
                <div class="code-icon">&lt;/&gt;</div>
                <div>等待连接...</div>
                <div style="font-size: 13px; margin-top: 12px; opacity: 0.75;">Connecting...</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 335;
        canvas.height = 772;

        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                
                ctx.fillText(text, x, y);
                
                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);
    </script>
</body>
</html>
