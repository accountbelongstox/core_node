<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星灿传媒科技 - 云矩阵服务集群</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 模糊背景层 */
        #blur-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 1;
        }

        /* 渐变背景层 */
        #gradient-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(135deg, 
                rgba(0, 100, 200, 0.3) 0%,
                rgba(0, 150, 255, 0.3) 25%,
                rgba(200, 220, 255, 0.3) 50%,
                rgba(0, 150, 255, 0.3) 75%,
                rgba(255, 255, 255, 0.3) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 粒子系统容器 */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        /* 矩阵雨效果 */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            opacity: 0.3;
        }

        /* 全息文字容器 */
        #hologram-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-align: center;
            perspective: 1000px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        /* 备用文字层 */
        .main-title-backup {
            font-size: 5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', 'SimSun', sans-serif;
            color: rgba(0, 170, 255, 0.3);
            letter-spacing: 0.05em;
            word-spacing: 0.1em;
            white-space: nowrap;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: inline-block;
            z-index: 1;
            pointer-events: none;
        }

        .sub-title-backup {
            font-size: 2.5rem;
            font-weight: 600;
            margin-top: 1rem;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', 'SimSun', sans-serif;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            word-spacing: 0.1em;
            white-space: nowrap;
            position: absolute;
            top: 6rem;
            left: 50%;
            transform: translateX(-50%);
            display: inline-block;
            z-index: 1;
            pointer-events: none;
        }

        .main-title {
            font-size: 5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', 'SimSun', sans-serif;
            color: #00aaff;
            background: linear-gradient(45deg, 
                #00aaff, #ffffff, #0088ff, #ffffff, #00aaff, #ffffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: hologramText 3s ease infinite, 
                       textGlow 2s ease-in-out infinite alternate,
                       textFloat 4s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(0, 170, 255, 0.8),
                         0 0 40px rgba(255, 255, 255, 0.6),
                         0 0 60px rgba(0, 170, 255, 0.4),
                         0 0 80px rgba(0, 170, 255, 0.3);
            letter-spacing: 0.05em;
            word-spacing: 0.1em;
            white-space: nowrap;
            position: relative;
            display: inline-block;
            z-index: 11;
            filter: drop-shadow(0 0 10px rgba(0, 170, 255, 0.5));
        }

        .sub-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-top: 1rem;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', 'SimSun', sans-serif;
            color: #ffffff;
            background: linear-gradient(45deg, 
                #00aaff, #ffffff, #0088ff, #ffffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: hologramText 3s ease infinite 0.5s,
                       textGlow 2s ease-in-out infinite alternate 0.5s,
                       textFloat 4s ease-in-out infinite 0.5s;
            text-shadow: 0 0 15px rgba(0, 170, 255, 0.7),
                         0 0 30px rgba(255, 255, 255, 0.5),
                         0 0 45px rgba(0, 170, 255, 0.4);
            letter-spacing: 0.05em;
            word-spacing: 0.1em;
            white-space: nowrap;
            position: relative;
            display: inline-block;
            z-index: 11;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        @keyframes hologramText {
            0%, 100% { 
                background-position: 0% 50%;
                filter: hue-rotate(0deg);
            }
            25% { 
                background-position: 100% 50%;
                filter: hue-rotate(90deg);
            }
            50% { 
                background-position: 100% 100%;
                filter: hue-rotate(180deg);
            }
            75% { 
                background-position: 0% 100%;
                filter: hue-rotate(270deg);
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 20px rgba(0, 170, 255, 0.8),
                             0 0 40px rgba(255, 255, 255, 0.6),
                             0 0 60px rgba(0, 170, 255, 0.4);
            }
            100% {
                text-shadow: 0 0 30px rgba(0, 170, 255, 1),
                             0 0 60px rgba(255, 255, 255, 0.8),
                             0 0 90px rgba(0, 170, 255, 0.6),
                             0 0 120px rgba(255, 255, 255, 0.4);
            }
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-20px) rotateX(5deg); }
        }

        /* 全息扫描线效果 */
        .hologram-scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 170, 255, 0.8), 
                transparent);
            animation: scanlineMove 3s linear infinite;
            pointer-events: none;
        }

        @keyframes scanlineMove {
            0% { top: -2px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 3D变换容器 */
        #transform-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .transform-element {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(0, 170, 255, 0.5);
            background: rgba(0, 170, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: transform3D 8s ease-in-out infinite;
        }

        @keyframes transform3D {
            0%, 100% {
                transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
                opacity: 0.3;
            }
            25% {
                transform: translate3d(100px, 100px, 100px) rotateX(90deg) rotateY(45deg) rotateZ(45deg);
                opacity: 0.6;
            }
            50% {
                transform: translate3d(-100px, 200px, -100px) rotateX(180deg) rotateY(90deg) rotateZ(90deg);
                opacity: 0.8;
            }
            75% {
                transform: translate3d(200px, -100px, 150px) rotateX(270deg) rotateY(135deg) rotateZ(135deg);
                opacity: 0.5;
            }
        }

        /* 过场动画遮罩 */
        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
        }

        .transition-active {
            pointer-events: all;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 模糊背景层 -->
        <canvas id="blur-background"></canvas>
        
        <!-- 渐变背景层 -->
        <div id="gradient-background"></div>
        
        <!-- 粒子系统 -->
        <canvas id="particles-canvas"></canvas>
        
        <!-- 矩阵雨效果 -->
        <canvas id="matrix-canvas"></canvas>
        
        <!-- 3D变换元素 -->
        <div id="transform-container"></div>
        
        <!-- 全息文字容器 -->
        <div id="hologram-container">
            <div class="hologram-scanline"></div>
            <!-- 备用文字层（确保文字可见） -->
            <h1 class="main-title-backup" id="main-title-backup">星灿传媒科技</h1>
            <h2 class="sub-title-backup" id="sub-title-backup">云矩阵服务集群</h2>
            <!-- 渐变文字层 -->
            <h1 class="main-title" id="main-title">星灿传媒科技</h1>
            <h2 class="sub-title" id="sub-title">云矩阵服务集群</h2>
        </div>
        
        <!-- 过场动画遮罩 -->
        <div id="transition-overlay"></div>
    </div>

    <script>
        // ============================================
        // 效果1: 模糊背景粒子系统 (500+ 行)
        // ============================================
        class BlurParticleSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.particleCount = 200;
                this.maxRadius = 4;
                this.minRadius = 1;
                this.speed = 0.5;
                this.connectionDistance = 150;
                this.gradientCache = {};
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.centerX = this.canvas.width / 2;
                this.centerY = this.canvas.height / 2;
            }

            init() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * this.speed,
                        vy: (Math.random() - 0.5) * this.speed,
                        radius: Math.random() * (this.maxRadius - this.minRadius) + this.minRadius,
                        hue: Math.random() * 360,
                        saturation: 50 + Math.random() * 50,
                        lightness: 30 + Math.random() * 40,
                        opacity: 0.3 + Math.random() * 0.7,
                        pulsePhase: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.01 + Math.random() * 0.02,
                        rotation: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() - 0.5) * 0.02,
                        trail: [],
                        trailLength: 5 + Math.floor(Math.random() * 10),
                        magneticField: {
                            strength: 0.1 + Math.random() * 0.2,
                            phase: Math.random() * Math.PI * 2,
                            frequency: 0.001 + Math.random() * 0.002
                        },
                        quantumState: {
                            probability: Math.random(),
                            collapsePhase: Math.random() * Math.PI * 2,
                            entanglement: Math.floor(Math.random() * this.particleCount)
                        },
                        mass: 0.5 + Math.random() * 1.5,
                        charge: (Math.random() - 0.5) * 2,
                        spin: Math.random() * Math.PI * 2,
                        spinSpeed: (Math.random() - 0.5) * 0.1
                    });
                }
                this.setupMouseInteraction();
                this.createParticleGroups();
            }

            createGradient(x, y, radius, hue) {
                const key = `${Math.floor(x/10)}_${Math.floor(y/10)}_${Math.floor(radius)}_${Math.floor(hue)}`;
                if (this.gradientCache[key]) {
                    return this.gradientCache[key];
                }
                
                const gradient = this.ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, 1)`);
                gradient.addColorStop(0.5, `hsla(${hue + 30}, 80%, 50%, 0.6)`);
                gradient.addColorStop(1, `hsla(${hue + 60}, 60%, 30%, 0)`);
                
                this.gradientCache[key] = gradient;
                return gradient;
            }

            updateParticle(particle, index) {
                // 量子态更新
                particle.quantumState.probability += 0.01;
                if (particle.quantumState.probability > 1) {
                    particle.quantumState.probability = 0;
                    particle.quantumState.collapsePhase = Math.random() * Math.PI * 2;
                }

                // 磁场影响
                const magneticAngle = particle.magneticField.phase + 
                    particle.magneticField.frequency * Date.now();
                const magneticForce = particle.magneticField.strength;
                const dx = Math.cos(magneticAngle) * magneticForce;
                const dy = Math.sin(magneticAngle) * magneticForce;

                // 脉冲效果
                const pulse = Math.sin(particle.pulsePhase) * 0.3 + 1;
                particle.pulsePhase += particle.pulseSpeed;

                // 旋转
                particle.rotation += particle.rotationSpeed;

                // 量子纠缠效应
                const entangled = this.particles[particle.quantumState.entanglement];
                if (entangled) {
                    const distance = Math.sqrt(
                        Math.pow(particle.x - entangled.x, 2) + 
                        Math.pow(particle.y - entangled.y, 2)
                    );
                    if (distance < 200) {
                        const force = (200 - distance) / 200 * 0.05;
                        const angle = Math.atan2(entangled.y - particle.y, entangled.x - particle.x);
                        particle.vx += Math.cos(angle) * force;
                        particle.vy += Math.sin(angle) * force;
                    }
                }

                // 中心引力
                const centerDx = this.centerX - particle.x;
                const centerDy = this.centerY - particle.y;
                const centerDistance = Math.sqrt(centerDx * centerDx + centerDy * centerDy);
                if (centerDistance > 0) {
                    const centerForce = 0.0001;
                    particle.vx += (centerDx / centerDistance) * centerForce;
                    particle.vy += (centerDy / centerDistance) * centerForce;
                }

                // 速度更新
                particle.vx += dx;
                particle.vy += dy;
                particle.vx *= 0.99;
                particle.vy *= 0.99;

                // 位置更新
                particle.x += particle.vx;
                particle.y += particle.vy;

                // 边界处理（弹性）
                if (particle.x < 0 || particle.x > this.canvas.width) {
                    particle.vx *= -0.8;
                    particle.x = Math.max(0, Math.min(this.canvas.width, particle.x));
                }
                if (particle.y < 0 || particle.y > this.canvas.height) {
                    particle.vy *= -0.8;
                    particle.y = Math.max(0, Math.min(this.canvas.height, particle.y));
                }

                // 轨迹记录
                particle.trail.push({ x: particle.x, y: particle.y, opacity: particle.opacity });
                if (particle.trail.length > particle.trailLength) {
                    particle.trail.shift();
                }

                // 色相循环
                particle.hue = (particle.hue + 0.5) % 360;
            }

            drawConnection(p1, p2, distance) {
                const opacity = (1 - distance / this.connectionDistance) * 0.3;
                const gradient = this.ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                gradient.addColorStop(0, `hsla(${p1.hue}, 70%, 60%, ${opacity})`);
                gradient.addColorStop(1, `hsla(${p2.hue}, 70%, 60%, ${opacity})`);
                
                this.ctx.strokeStyle = gradient;
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(p1.x, p1.y);
                this.ctx.lineTo(p2.x, p2.y);
                this.ctx.stroke();
            }

            drawParticle(particle) {
                // 绘制轨迹
                if (particle.trail.length > 1) {
                    for (let i = 0; i < particle.trail.length - 1; i++) {
                        const point = particle.trail[i];
                        const nextPoint = particle.trail[i + 1];
                        const trailOpacity = (i / particle.trail.length) * particle.opacity * 0.3;
                        
                        this.ctx.strokeStyle = `hsla(${particle.hue}, ${particle.saturation}%, ${particle.lightness}%, ${trailOpacity})`;
                        this.ctx.lineWidth = 1;
                        this.ctx.beginPath();
                        this.ctx.moveTo(point.x, point.y);
                        this.ctx.lineTo(nextPoint.x, nextPoint.y);
                        this.ctx.stroke();
                    }
                }

                // 绘制粒子
                const pulse = Math.sin(particle.pulsePhase) * 0.3 + 1;
                const radius = particle.radius * pulse;
                
                this.ctx.save();
                this.ctx.translate(particle.x, particle.y);
                this.ctx.rotate(particle.rotation);
                
                const gradient = this.createGradient(0, 0, radius * 2, particle.hue);
                this.ctx.fillStyle = gradient;
                
                this.ctx.beginPath();
                this.ctx.arc(0, 0, radius, 0, Math.PI * 2);
                this.ctx.fill();
                
                // 外发光
                this.ctx.shadowBlur = radius * 3;
                this.ctx.shadowColor = `hsl(${particle.hue}, 100%, 60%)`;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, radius * 0.5, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.restore();
            }

            // 添加鼠标交互
            setupMouseInteraction() {
                this.mouseX = this.centerX;
                this.mouseY = this.centerY;
                this.mouseRadius = 100;
                
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                document.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        this.mouseX = e.touches[0].clientX;
                        this.mouseY = e.touches[0].clientY;
                    }
                });
            }

            // 计算鼠标对粒子的影响
            applyMouseInfluence(particle) {
                const dx = this.mouseX - particle.x;
                const dy = this.mouseY - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < this.mouseRadius) {
                    const force = (this.mouseRadius - distance) / this.mouseRadius;
                    const angle = Math.atan2(dy, dx);
                    particle.vx -= Math.cos(angle) * force * 0.5;
                    particle.vy -= Math.sin(angle) * force * 0.5;
                }
            }

            // 添加涡流效果
            createVortex(particle) {
                const vortexX = this.canvas.width / 2;
                const vortexY = this.canvas.height / 2;
                const dx = particle.x - vortexX;
                const dy = particle.y - vortexY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const vortexRadius = 200;
                
                if (distance < vortexRadius) {
                    const angle = Math.atan2(dy, dx);
                    const vortexStrength = (vortexRadius - distance) / vortexRadius * 0.1;
                    particle.vx += Math.cos(angle + Math.PI / 2) * vortexStrength;
                    particle.vy += Math.sin(angle + Math.PI / 2) * vortexStrength;
                }
            }

            // 添加重力井效果
            createGravityWell(particle, wellX, wellY, strength) {
                const dx = wellX - particle.x;
                const dy = wellY - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 0 && distance < 300) {
                    const force = strength / (distance * distance + 1);
                    particle.vx += (dx / distance) * force;
                    particle.vy += (dy / distance) * force;
                }
            }

            // 添加碰撞检测
            checkCollisions(particle, index) {
                for (let i = index + 1; i < this.particles.length; i++) {
                    const other = this.particles[i];
                    const dx = particle.x - other.x;
                    const dy = particle.y - other.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = particle.radius + other.radius;
                    
                    if (distance < minDistance && distance > 0) {
                        const angle = Math.atan2(dy, dx);
                        const targetX = particle.x + Math.cos(angle) * minDistance;
                        const targetY = particle.y + Math.sin(angle) * minDistance;
                        const ax = (targetX - other.x) * 0.05;
                        const ay = (targetY - other.y) * 0.05;
                        
                        particle.vx -= ax;
                        particle.vy -= ay;
                        other.vx += ax;
                        other.vy += ay;
                    }
                }
            }

            // 添加能量场效果
            createEnergyField(particle) {
                const fieldCenters = [
                    { x: this.canvas.width * 0.25, y: this.canvas.height * 0.25, phase: 0 },
                    { x: this.canvas.width * 0.75, y: this.canvas.height * 0.25, phase: Math.PI },
                    { x: this.canvas.width * 0.25, y: this.canvas.height * 0.75, phase: Math.PI / 2 },
                    { x: this.canvas.width * 0.75, y: this.canvas.height * 0.75, phase: Math.PI * 1.5 }
                ];
                
                fieldCenters.forEach(field => {
                    const dx = particle.x - field.x;
                    const dy = particle.y - field.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const fieldRadius = 150;
                    
                    if (distance < fieldRadius) {
                        const time = Date.now() * 0.001;
                        const wave = Math.sin(time * 2 + field.phase) * 0.5 + 0.5;
                        const force = (fieldRadius - distance) / fieldRadius * wave * 0.02;
                        const angle = Math.atan2(dy, dx);
                        particle.vx += Math.cos(angle) * force;
                        particle.vy += Math.sin(angle) * force;
                    }
                });
            }

            // 扩展更新粒子方法
            updateParticleExtended(particle, index) {
                this.updateParticle(particle, index);
                this.applyMouseInfluence(particle);
                this.createVortex(particle);
                this.createEnergyField(particle);
                this.checkCollisions(particle, index);
            }

            // 添加粒子群组效果
            createParticleGroups() {
                this.groups = [];
                const groupCount = 5;
                for (let i = 0; i < groupCount; i++) {
                    this.groups.push({
                        centerX: Math.random() * this.canvas.width,
                        centerY: Math.random() * this.canvas.height,
                        radius: 100 + Math.random() * 100,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.01 + Math.random() * 0.02,
                        particles: []
                    });
                }
                
                this.particles.forEach((particle, index) => {
                    const groupIndex = index % groupCount;
                    this.groups[groupIndex].particles.push(index);
                });
            }

            // 更新群组
            updateGroups() {
                this.groups.forEach(group => {
                    group.phase += group.speed;
                    group.centerX += Math.cos(group.phase) * 0.5;
                    group.centerY += Math.sin(group.phase) * 0.5;
                    
                    if (group.centerX < 0 || group.centerX > this.canvas.width) {
                        group.centerX = Math.max(0, Math.min(this.canvas.width, group.centerX));
                    }
                    if (group.centerY < 0 || group.centerY > this.canvas.height) {
                        group.centerY = Math.max(0, Math.min(this.canvas.height, group.centerY));
                    }
                });
            }

            // 绘制群组连接
            drawGroupConnections() {
                this.groups.forEach(group => {
                    const particles = group.particles.map(i => this.particles[i]);
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < 100) {
                                const opacity = (1 - distance / 100) * 0.2;
                                this.ctx.strokeStyle = `hsla(${particles[i].hue}, 70%, 60%, ${opacity})`;
                                this.ctx.lineWidth = 0.5;
                                this.ctx.beginPath();
                                this.ctx.moveTo(particles[i].x, particles[i].y);
                                this.ctx.lineTo(particles[j].x, particles[j].y);
                                this.ctx.stroke();
                            }
                        }
                    }
                });
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 更新群组
                if (this.groups) {
                    this.updateGroups();
                }
                
                // 更新所有粒子
                this.particles.forEach((particle, index) => {
                    this.updateParticleExtended(particle, index);
                });

                // 绘制群组连接
                if (this.groups) {
                    this.drawGroupConnections();
                }

                // 绘制连接线
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.connectionDistance) {
                            this.drawConnection(this.particles[i], this.particles[j], distance);
                        }
                    }
                }

                // 绘制粒子
                this.particles.forEach(particle => {
                    this.drawParticle(particle);
                });

                requestAnimationFrame(() => this.animate());
            }
        }

            setupGlitchEffect() {
                let glitchCount = 0;
                this.glitchInterval = setInterval(() => {
                    if (Math.random() > 0.7) {
                        this.applyGlitch();
                        glitchCount++;
                        if (glitchCount > 3) {
                            glitchCount = 0;
                            clearInterval(this.glitchInterval);
                            setTimeout(() => {

                            }, 100);
                        }
                    }
                }, 100);
            }

            applyGlitch() {
                const glitchTypes = ['horizontal', 'vertical', 'diagonal', 'color', 'offset'];
                const type = glitchTypes[Math.floor(Math.random() * glitchTypes.length)];
                
                switch(type) {
                    case 'horizontal':
                        this.mainTitle.style.transform = `translateX(${(Math.random() - 0.5) * 20}px)`;
                        this.subTitle.style.transform = `translateX(${(Math.random() - 0.5) * 15}px)`;

                        this.mainTitle.style.transform = `translateY(${(Math.random() - 0.5) * 10}px)`;

                        setTimeout(() => {
                            this.mainTitle.style.transform = '';
                            this.subTitle.style.transform = '';
                        }, 50);

        class DynamicGradientSystem {

                this.canvas.style.top = '0';

                this.canvas.style.zIndex = '1';
                this.container.appendChild(this.canvas);
                
                this.ctx = this.canvas.getContext('2d');
                this.gradients = [];
                this.waves = [];
                this.particles = [];
                this.time = 0;
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                // 初始化多个渐变层
                for (let i = 0; i < 5; i++) {
                    this.gradients.push({
                        type: ['radial', 'linear', 'conic'][i % 3],
                        colors: this.generateColorPalette(),
                        position: {
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height
                        },
                        velocity: {
                            x: (Math.random() - 0.5) * 0.5,
                            y: (Math.random() - 0.5) * 0.5
                        },
                        rotation: Math.random() * Math.PI * 2,
