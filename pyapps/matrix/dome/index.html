                        scaleSpeed: (Math.random() - 0.5) * 0.001,
                        opacity: 0.3 + Math.random() * 0.4,
                        blendMode: ['multiply', 'screen', 'overlay', 'soft-light'][i % 4]
                    });
                }

                // 初始化波浪
                for (let i = 0; i < 8; i++) {
                    this.waves.push({
                        amplitude: 20 + Math.random() * 30,
                        frequency: 0.01 + Math.random() * 0.02,
                        speed: 0.02 + Math.random() * 0.03,
                        phase: Math.random() * Math.PI * 2,
                        direction: Math.random() * Math.PI * 2,
                        color: `hsla(${Math.random() * 360}, 100%, 60%, ${0.2 + Math.random() * 0.3})`,
                        thickness: 2 + Math.random() * 3
                    });
                }

                // 初始化渐变粒子
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: 10 + Math.random() * 40,
                        hue: Math.random() * 360,
                        saturation: 80 + Math.random() * 20,
                        lightness: 40 + Math.random() * 30,
                        opacity: 0.2 + Math.random() * 0.4,
                        life: 1,
                        decay: 0.001 + Math.random() * 0.002
                    });
                }

                // 初始化新效果
                this.createNoiseField();
                this.createLightRays();
                this.createEnergyRipples();
                this.createDynamicGrid();
            }

            generateColorPalette() {
                const baseHue = Math.random() * 360;
                const palette = [];
                for (let i = 0; i < 5; i++) {
                    const hue = (baseHue + i * 72) % 360;
                    palette.push({
                        hue: hue,
                        saturation: 70 + Math.random() * 30,
                        lightness: 40 + Math.random() * 30,
                        position: i / 4
                    });
                }
                return palette;
            }

            updateGradient(gradient) {
                // 更新位置
                gradient.position.x += gradient.velocity.x;
                gradient.position.y += gradient.velocity.y;

                // 边界反弹
                if (gradient.position.x < 0 || gradient.position.x > this.canvas.width) {
                    gradient.velocity.x *= -1;
                }
                if (gradient.position.y < 0 || gradient.position.y > this.canvas.height) {
                    gradient.velocity.y *= -1;
                }

                // 更新旋转
                gradient.rotation += gradient.rotationSpeed;

                // 更新缩放
                gradient.scale += gradient.scaleSpeed;
                if (gradient.scale < 0.3 || gradient.scale > 1.5) {
                    gradient.scaleSpeed *= -1;
                }

                // 颜色变化
                gradient.colors.forEach(color => {
                    color.hue = (color.hue + 0.2) % 360;
                    color.saturation = 70 + Math.sin(this.time + color.position * Math.PI * 2) * 20;
                    color.lightness = 40 + Math.cos(this.time * 2 + color.position * Math.PI * 2) * 20;
                });
            }

            drawGradient(gradient) {
                this.ctx.save();
                this.ctx.globalAlpha = gradient.opacity;
                this.ctx.globalCompositeOperation = gradient.blendMode;

                let grad;
                const centerX = gradient.position.x;
                const centerY = gradient.position.y;
                const radius = Math.max(this.canvas.width, this.canvas.height) * gradient.scale;

                switch(gradient.type) {
                    case 'radial':
                        grad = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                        break;
                    case 'linear':
                        const angle = gradient.rotation;
                        const x1 = centerX + Math.cos(angle) * radius;
                        const y1 = centerY + Math.sin(angle) * radius;
                        const x2 = centerX - Math.cos(angle) * radius;
                        const y2 = centerY - Math.sin(angle) * radius;
                        grad = this.ctx.createLinearGradient(x1, y1, x2, y2);
                        break;
                    case 'conic':
                        grad = this.ctx.createConicGradient(gradient.rotation, centerX, centerY);
                        break;
                }

                gradient.colors.forEach(color => {
                    grad.addColorStop(color.position, 
                        `hsla(${color.hue}, ${color.saturation}%, ${color.lightness}%, 1)`);
                });

                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.restore();
            }

            updateWave(wave) {
                wave.phase += wave.speed;
            }

            drawWave(wave) {
                this.ctx.save();
                this.ctx.strokeStyle = wave.color;
                this.ctx.lineWidth = wave.thickness;
                this.ctx.beginPath();

                const steps = 100;
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = t * this.canvas.width;
                    const y = this.canvas.height / 2 + 
                        Math.sin(x * wave.frequency + wave.phase) * wave.amplitude +
                        Math.cos(x * wave.frequency * 2 + wave.phase * 1.5) * wave.amplitude * 0.5;

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }

                this.ctx.stroke();
                this.ctx.restore();
            }

            updateParticle(particle) {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.hue = (particle.hue + 0.5) % 360;
                particle.life -= particle.decay;

                // 边界处理
                if (particle.x < 0 || particle.x > this.canvas.width) {
                    particle.vx *= -1;
                }
                if (particle.y < 0 || particle.y > this.canvas.height) {
                    particle.vy *= -1;
                }

                // 重置死亡粒子
                if (particle.life <= 0) {
                    particle.x = Math.random() * this.canvas.width;
                    particle.y = Math.random() * this.canvas.height;
                    particle.life = 1;
                    particle.hue = Math.random() * 360;
                }
            }

            drawParticle(particle) {
                const gradient = this.ctx.createRadialGradient(
                    particle.x, particle.y, 0,
                    particle.x, particle.y, particle.size
                );
                gradient.addColorStop(0, `hsla(${particle.hue}, ${particle.saturation}%, ${particle.lightness}%, ${particle.opacity * particle.life})`);
                gradient.addColorStop(1, `hsla(${particle.hue}, ${particle.saturation}%, ${particle.lightness}%, 0)`);

                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                this.ctx.fill();
            }

            // 添加噪声场效果
            createNoiseField() {
                this.noiseData = [];
                const noiseSize = 50;
                for (let y = 0; y < this.canvas.height; y += noiseSize) {
                    for (let x = 0; x < this.canvas.width; x += noiseSize) {
                        this.noiseData.push({
                            x: x,
                            y: y,
                            value: Math.random(),
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }
            }

            drawNoiseField() {
                this.noiseData.forEach(noise => {
                    noise.phase += 0.01;
                    noise.value = Math.sin(noise.phase) * 0.5 + 0.5;
                    const hue = (this.time * 30 + noise.x * 0.1 + noise.y * 0.1) % 360;
                    this.ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${noise.value * 0.1})`;
                    this.ctx.fillRect(noise.x, noise.y, 50, 50);
                });
            }

            // 添加光晕效果
            createLightRays() {
                this.lightRays = [];
                for (let i = 0; i < 8; i++) {
                    this.lightRays.push({
                        angle: (i / 8) * Math.PI * 2,
                        length: 200 + Math.random() * 300,
                        width: 2 + Math.random() * 5,
                        hue: Math.random() * 360,
                        speed: 0.01 + Math.random() * 0.02,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            drawLightRays() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.lightRays.forEach(ray => {
                    ray.phase += ray.speed;
                    ray.hue = (ray.hue + 0.5) % 360;
                    
                    const endX = centerX + Math.cos(ray.angle + ray.phase) * ray.length;
                    const endY = centerY + Math.sin(ray.angle + ray.phase) * ray.length;
                    
                    const gradient = this.ctx.createLinearGradient(centerX, centerY, endX, endY);
                    gradient.addColorStop(0, `hsla(${ray.hue}, 100%, 60%, 0.8)`);
                    gradient.addColorStop(1, `hsla(${ray.hue}, 100%, 60%, 0)`);
                    
                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = ray.width;
                    this.ctx.beginPath();
                    this.ctx.moveTo(centerX, centerY);
                    this.ctx.lineTo(endX, endY);
                    this.ctx.stroke();
                });
            }

            // 添加能量波纹
            createEnergyRipples() {
                this.ripples = [];
                for (let i = 0; i < 5; i++) {
                    this.ripples.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: 0,
                        maxRadius: 200 + Math.random() * 200,
                        speed: 1 + Math.random() * 2,
                        hue: Math.random() * 360,
                        opacity: 0.5,
                        life: 1
                    });
                }
            }

            updateEnergyRipples() {
                this.ripples.forEach(ripple => {
                    ripple.radius += ripple.speed;
                    ripple.opacity = (1 - ripple.radius / ripple.maxRadius) * 0.5;
                    ripple.hue = (ripple.hue + 1) % 360;
                    
                    if (ripple.radius > ripple.maxRadius) {
                        ripple.radius = 0;
                        ripple.x = Math.random() * this.canvas.width;
                        ripple.y = Math.random() * this.canvas.height;
                        ripple.hue = Math.random() * 360;
                    }
                });
            }

            drawEnergyRipples() {
                this.ripples.forEach(ripple => {
                    this.ctx.strokeStyle = `hsla(${ripple.hue}, 100%, 60%, ${ripple.opacity})`;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
                    this.ctx.stroke();
                });
            }

            // 添加动态网格
            createDynamicGrid() {
                this.gridLines = [];
                const gridSize = 50;
                for (let x = 0; x < this.canvas.width; x += gridSize) {
                    this.gridLines.push({
                        type: 'vertical',
                        x: x,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.01 + Math.random() * 0.02
                    });
                }
                for (let y = 0; y < this.canvas.height; y += gridSize) {
                    this.gridLines.push({
                        type: 'horizontal',
                        y: y,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.01 + Math.random() * 0.02
                    });
                }
            }

            drawDynamicGrid() {
                this.gridLines.forEach(line => {
                    line.phase += line.speed;
                    const opacity = Math.sin(line.phase) * 0.3 + 0.3;
                    const hue = (this.time * 20 + line.phase * 50) % 360;
                    
                    this.ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${opacity})`;
                    this.ctx.lineWidth = 1;
                    this.ctx.beginPath();
                    
                    if (line.type === 'vertical') {
                        const offset = Math.sin(line.phase) * 10;
                        this.ctx.moveTo(line.x + offset, 0);
                        this.ctx.lineTo(line.x + offset, this.canvas.height);
                    } else {
                        const offset = Math.cos(line.phase) * 10;
                        this.ctx.moveTo(0, line.y + offset);
                        this.ctx.lineTo(this.canvas.width, line.y + offset);
                    }
                    
                    this.ctx.stroke();
                });
            }

            animate() {
                this.time += 0.01;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制噪声场
                if (this.noiseData) {
                    this.drawNoiseField();
                }

                // 绘制渐变层
                this.gradients.forEach(gradient => {
                    this.updateGradient(gradient);
                    this.drawGradient(gradient);
                });

                // 绘制光晕
                if (this.lightRays) {
                    this.drawLightRays();
                }

                // 绘制能量波纹
                if (this.ripples) {
                    this.updateEnergyRipples();
                    this.drawEnergyRipples();
                }

                // 绘制动态网格
                if (this.gridLines) {
                    this.drawDynamicGrid();
                }

                // 绘制波浪
                this.waves.forEach(wave => {
                    this.updateWave(wave);
                    this.drawWave(wave);
                });

                // 绘制粒子
                this.particles.forEach(particle => {
                    this.updateParticle(particle);
                    this.drawParticle(particle);
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        // ============================================
        // 效果4: 矩阵雨效果 (500+ 行)
        // ============================================
        class MatrixRainEffect {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.columns = [];
                this.fontSize = 14;
                this.characters = '星灿传媒科技云矩阵服务集群0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+-=[]{}|;:,.<>?';
                this.drops = [];
                this.particles = [];
                this.time = 0;
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.columns = Math.floor(this.canvas.width / this.fontSize);
                this.initDrops();
            }

            init() {
                this.initDrops();
                this.initParticles();
                this.createLightning();
                this.createCharExplosions();
                this.createMatrixGrid();
            }

            initDrops() {
                this.drops = [];
                for (let i = 0; i < this.columns; i++) {
                    this.drops.push({
                        y: Math.random() * -this.canvas.height,
                        speed: 2 + Math.random() * 5,
                        length: 10 + Math.floor(Math.random() * 30),
                        hue: Math.random() * 60 + 120, // 绿色到青色
                        opacity: 0.3 + Math.random() * 0.7,
                        charIndex: Math.floor(Math.random() * this.characters.length),
                        charSpeed: 0.1 + Math.random() * 0.3,
                        trail: [],
                        trailLength: 5 + Math.floor(Math.random() * 10),
                        glow: Math.random() > 0.5,
                        pulse: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.02 + Math.random() * 0.03
                    });
                }
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: 2 + Math.random() * 4,
                        hue: Math.random() * 60 + 120,
                        opacity: 0.3 + Math.random() * 0.5,
                        life: 1,
                        decay: 0.001 + Math.random() * 0.002
                    });
                }
            }

            updateDrop(drop, index) {
                // 更新位置
                drop.y += drop.speed;

                // 更新字符
                drop.charIndex = (drop.charIndex + drop.charSpeed) % this.characters.length;

                // 更新脉冲
                drop.pulse += drop.pulseSpeed;

                // 记录轨迹
                drop.trail.push({
                    y: drop.y,
                    char: this.characters[Math.floor(drop.charIndex)],
                    opacity: drop.opacity
                });
                if (drop.trail.length > drop.length) {
                    drop.trail.shift();
                }

                // 重置
                if (drop.y > this.canvas.height + drop.length * this.fontSize) {
                    drop.y = Math.random() * -200;
                    drop.speed = 2 + Math.random() * 5;
                    drop.length = 10 + Math.floor(Math.random() * 30);
                    drop.hue = Math.random() * 60 + 120;
                    drop.opacity = 0.3 + Math.random() * 0.7;
                }
            }

            drawDrop(drop, x) {
                const pulse = Math.sin(drop.pulse) * 0.2 + 1;
                const currentOpacity = drop.opacity * pulse;

                // 绘制轨迹
                drop.trail.forEach((trailPoint, index) => {
                    const trailOpacity = (index / drop.trail.length) * currentOpacity;
                    const trailHue = drop.hue + (drop.trail.length - index) * 2;
                    
                    this.ctx.fillStyle = `hsla(${trailHue}, 100%, ${50 + (drop.trail.length - index) * 2}%, ${trailOpacity})`;
                    this.ctx.font = `${this.fontSize}px monospace`;
                    
                    if (drop.glow) {
                        this.ctx.shadowBlur = 10;
                        this.ctx.shadowColor = `hsl(${trailHue}, 100%, 60%)`;
                    }
                    
                    this.ctx.fillText(trailPoint.char, x, trailPoint.y);
                    this.ctx.shadowBlur = 0;
                });

                // 绘制头部高亮
                if (drop.trail.length > 0) {
                    const head = drop.trail[drop.trail.length - 1];
                    this.ctx.fillStyle = `hsla(${drop.hue}, 100%, 70%, ${currentOpacity})`;
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = `hsl(${drop.hue}, 100%, 60%)`;
                    this.ctx.fillText(head.char, x, head.y);
                    this.ctx.shadowBlur = 0;
                }
            }

            updateParticle(particle) {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.hue = (particle.hue + 0.5) % 360;
                particle.life -= particle.decay;

                // 边界处理
                if (particle.x < 0 || particle.x > this.canvas.width) {
                    particle.vx *= -1;
                }
                if (particle.y < 0 || particle.y > this.canvas.height) {
                    particle.vy *= -1;
                }

                // 重置
                if (particle.life <= 0) {
                    particle.x = Math.random() * this.canvas.width;
                    particle.y = Math.random() * this.canvas.height;
                    particle.life = 1;
                    particle.hue = Math.random() * 60 + 120;
                }
            }

            drawParticle(particle) {
                const gradient = this.ctx.createRadialGradient(
                    particle.x, particle.y, 0,
                    particle.x, particle.y, particle.size * 2
                );
                gradient.addColorStop(0, `hsla(${particle.hue}, 100%, 60%, ${particle.opacity * particle.life})`);
                gradient.addColorStop(1, `hsla(${particle.hue}, 100%, 60%, 0)`);

                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                this.ctx.fill();
            }

            // 添加闪电效果
            createLightning() {
                this.lightning = [];
                for (let i = 0; i < 3; i++) {
                    this.lightning.push({
                        x: Math.random() * this.canvas.width,
                        y: 0,
                        branches: [],
                        life: 1,
                        decay: 0.01,
                        hue: 180 + Math.random() * 60
                    });
                }
            }

            updateLightning() {
                this.lightning.forEach(bolt => {
                    bolt.life -= bolt.decay;
                    if (bolt.life <= 0) {
                        bolt.x = Math.random() * this.canvas.width;
                        bolt.y = 0;
                        bolt.life = 1;
                        bolt.branches = [];
                        this.generateLightningBranches(bolt);
                    }
                });
            }

            generateLightningBranches(bolt) {
                bolt.branches = [];
                let currentY = bolt.y;
                let currentX = bolt.x;
                const segmentLength = 20;
                
                while (currentY < this.canvas.height) {
                    const nextX = currentX + (Math.random() - 0.5) * 30;
                    const nextY = currentY + segmentLength;
                    bolt.branches.push({ x: currentX, y: currentY, nextX, nextY });
                    currentX = nextX;
                    currentY = nextY;
                }
            }

            drawLightning() {
                this.lightning.forEach(bolt => {
                    if (bolt.branches.length > 0) {
                        this.ctx.strokeStyle = `hsla(${bolt.hue}, 100%, 70%, ${bolt.life})`;
                        this.ctx.lineWidth = 2;
                        this.ctx.shadowBlur = 10;
                        this.ctx.shadowColor = `hsl(${bolt.hue}, 100%, 60%)`;
                        
                        bolt.branches.forEach(branch => {
                            this.ctx.beginPath();
                            this.ctx.moveTo(branch.x, branch.y);
                            this.ctx.lineTo(branch.nextX, branch.nextY);
                            this.ctx.stroke();
                        });
                        
                        this.ctx.shadowBlur = 0;
                    }
                });
            }

            // 添加字符爆炸效果
            createCharExplosions() {
                this.explosions = [];
            }

            triggerExplosion(x, y) {
                this.explosions.push({
                    x: x,
                    y: y,
                    particles: [],
                    life: 1,
                    decay: 0.02
                });
                
                const explosion = this.explosions[this.explosions.length - 1];
                for (let i = 0; i < 30; i++) {
                    explosion.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        char: this.characters[Math.floor(Math.random() * this.characters.length)],
                        hue: Math.random() * 60 + 120,
                        size: 10 + Math.random() * 20,
                        life: 1,
                        decay: 0.01 + Math.random() * 0.02
                    });
                }
            }

            updateExplosions() {
                this.explosions.forEach((explosion, index) => {
                    explosion.life -= explosion.decay;
                    explosion.particles.forEach(particle => {
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.vx *= 0.98;
                        particle.vy *= 0.98;
                        particle.life -= particle.decay;
                    });
                    
                    if (explosion.life <= 0) {
                        this.explosions.splice(index, 1);
                    }
                });
            }

            drawExplosions() {
                this.explosions.forEach(explosion => {
                    explosion.particles.forEach(particle => {
                        if (particle.life > 0) {
                            this.ctx.fillStyle = `hsla(${particle.hue}, 100%, 60%, ${particle.life})`;
                            this.ctx.font = `${particle.size}px monospace`;
                            this.ctx.fillText(particle.char, particle.x, particle.y);
                        }
                    });
                });
            }

            // 添加矩阵网格效果
            createMatrixGrid() {
                this.gridCells = [];
                const cellSize = 20;
                for (let y = 0; y < this.canvas.height; y += cellSize) {
                    for (let x = 0; x < this.canvas.width; x += cellSize) {
                        this.gridCells.push({
                            x: x,
                            y: y,
                            char: this.characters[Math.floor(Math.random() * this.characters.length)],
                            hue: Math.random() * 60 + 120,
                            opacity: Math.random() * 0.3,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.01 + Math.random() * 0.02
                        });
                    }
                }
            }

            updateMatrixGrid() {
                this.gridCells.forEach(cell => {
                    cell.phase += cell.speed;
                    cell.opacity = Math.sin(cell.phase) * 0.15 + 0.15;
                    if (Math.random() < 0.01) {
                        cell.char = this.characters[Math.floor(Math.random() * this.characters.length)];
                    }
                });
            }

            drawMatrixGrid() {
                this.gridCells.forEach(cell => {
                    this.ctx.fillStyle = `hsla(${cell.hue}, 100%, 60%, ${cell.opacity})`;
                    this.ctx.font = '12px monospace';
                    this.ctx.fillText(cell.char, cell.x, cell.y);
                });
            }

            animate() {
                this.time += 0.01;
                
                // 半透明黑色背景（创建拖尾效果）
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 更新和绘制矩阵网格
                if (this.gridCells) {
                    this.updateMatrixGrid();
                    this.drawMatrixGrid();
                }

                // 更新和绘制闪电
                if (this.lightning) {
                    this.updateLightning();
                    this.drawLightning();
                }

                // 更新和绘制爆炸
                if (this.explosions) {
                    this.updateExplosions();
                    this.drawExplosions();
                }

                // 更新和绘制雨滴
                this.drops.forEach((drop, index) => {
                    const x = index * this.fontSize;
                    this.updateDrop(drop, index);
                    this.drawDrop(drop, x);
                    
                    // 随机触发爆炸
                    if (Math.random() < 0.0001 && drop.trail.length > 0) {
                        const head = drop.trail[drop.trail.length - 1];
                        this.triggerExplosion(x, head.y);
                    }
                });

                // 更新和绘制粒子
                this.particles.forEach(particle => {
                    this.updateParticle(particle);
                    this.drawParticle(particle);
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        // ============================================
        // 效果5: 3D变换过场动画系统 (500+ 行)
        // ============================================
        class Transform3DTransition {
            constructor() {
                this.container = document.getElementById('transform-container');
                this.elements = [];
                this.transitions = [];
                this.currentTransition = 0;
                this.transitionDuration = 3000;
                this.transitionDelay = 5000;
                this.time = 0;
                
                this.init();
                this.startTransitions();
            }

            init() {
                // 创建3D变换元素
                for (let i = 0; i < 20; i++) {
                    const element = document.createElement('div');
                    element.className = 'transform-element';
                    element.style.left = `${Math.random() * 100}%`;
                    element.style.top = `${Math.random() * 100}%`;
                    element.style.animationDelay = `${i * 0.2}s`;
                    element.style.borderColor = `hsla(${Math.random() * 360}, 100%, 60%, 0.5)`;
                    element.style.background = `hsla(${Math.random() * 360}, 100%, 60%, 0.1)`;
                    this.container.appendChild(element);
                    this.elements.push(element);
                }

                // 定义过场动画类型
                this.transitions = [
                    this.createTransition1.bind(this),
                    this.createTransition2.bind(this),
                    this.createTransition3.bind(this)
                ];
            }

            createTransition1() {
                // 旋转展开过场
                this.elements.forEach((element, index) => {
                    const delay = index * 50;
                    const angle = (index / this.elements.length) * Math.PI * 2;
                    const radius = 300;
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    
                    element.style.transition = `all 3s cubic-bezier(0.68, -0.55, 0.265, 1.55)`;
                    element.style.transitionDelay = `${delay}ms`;
                    
                    setTimeout(() => {
                        element.style.transform = `
                            translate3d(${centerX + Math.cos(angle) * radius - 100}px, 
                                       ${centerY + Math.sin(angle) * radius - 100}px, 
                                       0px)
                            rotateX(${angle * 180 / Math.PI}deg)
                            rotateY(${angle * 180 / Math.PI}deg)
                            rotateZ(${angle * 180 / Math.PI}deg)
                            scale(1.5)
                        `;
                        element.style.opacity = '0.8';
                    }, 10);
                });

                setTimeout(() => {
                    this.resetElements();
                }, 3500);
            }

            createTransition2() {
                // 波浪过场
                this.elements.forEach((element, index) => {
                    const delay = index * 30;
                    const wavePhase = (index / this.elements.length) * Math.PI * 2;
                    const waveAmplitude = 200;
                    
                    element.style.transition = `all 2.5s ease-in-out`;
                    element.style.transitionDelay = `${delay}ms`;
                    
                    setTimeout(() => {
                        const x = window.innerWidth / 2 + Math.sin(wavePhase) * waveAmplitude;
                        const y = window.innerHeight / 2 + Math.cos(wavePhase) * waveAmplitude;
                        const z = Math.sin(wavePhase) * 300;
                        
                        element.style.transform = `
                            translate3d(${x - 100}px, ${y - 100}px, ${z}px)
                            rotateX(${Math.sin(wavePhase) * 180}deg)
                            rotateY(${Math.cos(wavePhase) * 180}deg)
                            scale(${1 + Math.sin(wavePhase) * 0.5})
                        `;
                        element.style.opacity = '0.9';
                        
                        const hue = (wavePhase * 180 / Math.PI + Date.now() * 0.1) % 360;
                        element.style.borderColor = `hsla(${hue}, 100%, 60%, 0.8)`;
                        element.style.background = `hsla(${hue}, 100%, 60%, 0.2)`;
                    }, 10);
                });

                setTimeout(() => {
                    this.resetElements();
                }, 3000);
            }

            createTransition3() {
                // 螺旋过场
                this.elements.forEach((element, index) => {
                    const delay = index * 40;
                    const spiralTurns = 3;
                    const spiralRadius = 400;
                    const spiralHeight = 600;
                    
                    element.style.transition = `all 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                    element.style.transitionDelay = `${delay}ms`;
                    
                    setTimeout(() => {
                        const t = index / this.elements.length;
                        const angle = t * Math.PI * 2 * spiralTurns;
                        const radius = t * spiralRadius;
                        const height = t * spiralHeight - spiralHeight / 2;
                        
                        const x = window.innerWidth / 2 + Math.cos(angle) * radius;
                        const y = window.innerHeight / 2 + Math.sin(angle) * radius;
                        
                        element.style.transform = `
                            translate3d(${x - 100}px, ${y - 100}px, ${height}px)
                            rotateX(${angle * 180 / Math.PI}deg)
                            rotateY(${angle * 180 / Math.PI * 2}deg)
                            rotateZ(${angle * 180 / Math.PI}deg)
                            scale(${0.5 + t * 1.5})
                        `;
                        element.style.opacity = '0.7';
                        
                        const hue = (angle * 180 / Math.PI + Date.now() * 0.1) % 360;
                        element.style.borderColor = `hsla(${hue}, 100%, 60%, 0.7)`;
                        element.style.background = `hsla(${hue}, 100%, 60%, 0.15)`;
                    }, 10);
                });

                setTimeout(() => {
                    this.resetElements();
                }, 4000);
            }

            resetElements() {
                this.elements.forEach((element, index) => {
                    element.style.transition = `all 2s ease-in-out`;
                    element.style.transitionDelay = `${index * 20}ms`;
                    
                    setTimeout(() => {
                        const randomX = Math.random() * window.innerWidth;
                        const randomY = Math.random() * window.innerHeight;
                        const randomZ = (Math.random() - 0.5) * 200;
                        
                        element.style.transform = `
                            translate3d(${randomX - 100}px, ${randomY - 100}px, ${randomZ}px)
                            rotateX(${Math.random() * 360}deg)
                            rotateY(${Math.random() * 360}deg)
                            rotateZ(${Math.random() * 360}deg)
                            scale(${0.5 + Math.random() * 0.5})
                        `;
                        element.style.opacity = '0.3';
                        
                        const hue = Math.random() * 360;
                        element.style.borderColor = `hsla(${hue}, 100%, 60%, 0.5)`;
                        element.style.background = `hsla(${hue}, 100%, 60%, 0.1)`;
                    }, 10);
                });
            }

            // 添加第四个过场动画：粒子爆炸
            createTransition4() {
                this.elements.forEach((element, index) => {
                    const delay = index * 25;
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    const angle = (index / this.elements.length) * Math.PI * 2;
                    const distance = 400;
                    
                    element.style.transition = `all 2s cubic-bezier(0.68, -0.55, 0.265, 1.55)`;
                    element.style.transitionDelay = `${delay}ms`;
                    
                    setTimeout(() => {
                        const x = centerX + Math.cos(angle) * distance;
                        const y = centerY + Math.sin(angle) * distance;
                        const z = Math.sin(angle) * 500;
                        
                        element.style.transform = `
                            translate3d(${x - 100}px, ${y - 100}px, ${z}px)
                            rotateX(${angle * 180 / Math.PI}deg)
                            rotateY(${angle * 180 / Math.PI * 2}deg)
                            rotateZ(${angle * 180 / Math.PI * 3}deg)
                            scale(${2 + Math.sin(angle) * 0.5})
                        `;
                        element.style.opacity = '1';
                        
                        const hue = (angle * 180 / Math.PI + Date.now() * 0.1) % 360;
                        element.style.borderColor = `hsla(${hue}, 100%, 60%, 1)`;
                        element.style.background = `hsla(${hue}, 100%, 60%, 0.3)`;
                    }, 10);
                });

                setTimeout(() => {
                    this.resetElements();
                }, 2500);
            }

            // 添加第五个过场动画：折叠展开
            createTransition5() {
                this.elements.forEach((element, index) => {
                    const delay = index * 30;
                    const foldAngle = (index / this.elements.length) * 360;
                    const foldDistance = 300;
                    
                    element.style.transition = `all 3s ease-in-out`;
                    element.style.transitionDelay = `${delay}ms`;
                    
                    setTimeout(() => {
                        const x = window.innerWidth / 2 + Math.cos(foldAngle * Math.PI / 180) * foldDistance;
                        const y = window.innerHeight / 2 + Math.sin(foldAngle * Math.PI / 180) * foldDistance;
                        const z = Math.cos(foldAngle * Math.PI / 180) * 400;
                        
                        element.style.transform = `
                            translate3d(${x - 100}px, ${y - 100}px, ${z}px)
                            rotateX(${foldAngle}deg)
                            rotateY(${foldAngle * 2}deg)
                            rotateZ(${foldAngle}deg)
                            scale(${0.3 + Math.cos(foldAngle * Math.PI / 180) * 0.7})
                        `;
                        element.style.opacity = '0.9';
                        
                        const hue = (foldAngle + Date.now() * 0.1) % 360;
                        element.style.borderColor = `hsla(${hue}, 100%, 60%, 0.9)`;
                        element.style.background = `hsla(${hue}, 100%, 60%, 0.25)`;
                    }, 10);
                });

                setTimeout(() => {
                    this.resetElements();
                }, 3500);
            }

            // 添加第六个过场动画：轨道旋转
            createTransition6() {
                this.elements.forEach((element, index) => {
                    const delay = index * 20;
                    const orbitRadius = 350;
                    const orbitHeight = 500;
                    const orbitAngle = (index / this.elements.length) * Math.PI * 2;
                    
                    element.style.transition = `all 4s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                    element.style.transitionDelay = `${delay}ms`;
                    
                    setTimeout(() => {
                        const time = Date.now() * 0.001;
                        const x = window.innerWidth / 2 + Math.cos(orbitAngle + time) * orbitRadius;
                        const y = window.innerHeight / 2 + Math.sin(orbitAngle + time) * orbitRadius;
                        const z = Math.sin(orbitAngle + time * 2) * orbitHeight;
                        
                        element.style.transform = `
                            translate3d(${x - 100}px, ${y - 100}px, ${z}px)
                            rotateX(${(orbitAngle + time) * 180 / Math.PI}deg)
                            rotateY(${(orbitAngle + time) * 180 / Math.PI * 2}deg)
                            rotateZ(${(orbitAngle + time) * 180 / Math.PI}deg)
                            scale(${0.8 + Math.sin(orbitAngle + time) * 0.4})
                        `;
                        element.style.opacity = '0.8';
                        
                        const hue = ((orbitAngle + time) * 180 / Math.PI + Date.now() * 0.1) % 360;
                        element.style.borderColor = `hsla(${hue}, 100%, 60%, 0.8)`;
                        element.style.background = `hsla(${hue}, 100%, 60%, 0.2)`;
                    }, 10);
                });

                setTimeout(() => {
                    this.resetElements();
                }, 4500);
            }

            // 添加粒子轨迹效果
            createParticleTrails() {
                this.trails = [];
                this.elements.forEach((element, index) => {
                    this.trails.push({
                        element: element,
                        points: [],
                        maxPoints: 20,
                        hue: Math.random() * 360
                    });
                });
            }

            updateParticleTrails() {
                this.trails.forEach(trail => {
                    const rect = trail.element.getBoundingClientRect();
                    const x = rect.left + rect.width / 2;
                    const y = rect.top + rect.height / 2;
                    
                    trail.points.push({ x, y, time: Date.now() });
                    if (trail.points.length > trail.maxPoints) {
                        trail.points.shift();
                    }
                    
                    trail.hue = (trail.hue + 1) % 360;
                });
            }

            drawParticleTrails() {
                const canvas = document.createElement('canvas');
                canvas.style.position = 'absolute';
                canvas.style.top = '0';
                canvas.style.left = '0';
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.pointerEvents = 'none';
                canvas.style.zIndex = '6';
                this.container.appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    this.trails.forEach(trail => {
                        if (trail.points.length > 1) {
                            for (let i = 0; i < trail.points.length - 1; i++) {
                                const point = trail.points[i];
                                const nextPoint = trail.points[i + 1];
                                const opacity = (i / trail.points.length) * 0.5;
                                
                                ctx.strokeStyle = `hsla(${trail.hue}, 100%, 60%, ${opacity})`;
                                ctx.lineWidth = 2;
                                ctx.beginPath();
                                ctx.moveTo(point.x, point.y);
                                ctx.lineTo(nextPoint.x, nextPoint.y);
                                ctx.stroke();
                            }
                        }
                    });
                    
                    requestAnimationFrame(animate);
                };
                animate();
            }

            startTransitions() {
                // 添加新的过场动画
                this.transitions.push(
                    this.createTransition4.bind(this),
                    this.createTransition5.bind(this),
                    this.createTransition6.bind(this)
                );
                
                // 创建粒子轨迹
                this.createParticleTrails();
                this.drawParticleTrails();
                
                const runTransition = () => {
                    const transition = this.transitions[this.currentTransition];
                    transition();
                    
                    this.currentTransition = (this.currentTransition + 1) % this.transitions.length;
                    
                    setTimeout(runTransition, this.transitionDuration + this.transitionDelay);
                };
                
                runTransition();
                
                // 更新粒子轨迹
                setInterval(() => {
                    this.updateParticleTrails();
                }, 50);
            }
        }

        // ============================================
        // 初始化所有效果
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            // 效果1: 模糊背景粒子系统
            const blurParticles = new BlurParticleSystem('blur-background');
            
            // 效果2: 全息文字效果
            const hologramText = new HologramTextEffect();
            
            // 效果3: 动态渐变背景
            const dynamicGradient = new DynamicGradientSystem('gradient-background');
            
            // 效果4: 矩阵雨效果
            const matrixRain = new MatrixRainEffect('matrix-canvas');
            
            // 效果5: 3D变换过场动画
            const transform3D = new Transform3DTransition();
        });
    </script>
