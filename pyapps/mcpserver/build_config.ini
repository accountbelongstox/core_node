# Build Configuration for mcpserver
# This file defines installation and runtime settings for the MCP Server

[app_info]
app_name = mcpserver
display_name_chinese = MCP服务器
display_name_english = MCP Server
description = Global MCP Server - Unified backend for all MCP services
version = 1.0.0
author = Core Node Team

[dependencies]
# Runtime dependencies
require_nodejs = false
require_python = true
# Python version
python_version = 3.10
# Required pip packages
pip_packages = websockets, pydantic, PySide6

[installation]
# Installation behavior
skip_pnpm_install = true
skip_pycore_init = false
create_desktop_shortcut = true
# Pre-install commands (semicolon-separated)
pre_install_commands =
# Post-install commands
post_install_commands =

[startup]
# Custom startup command (overrides default)
command = python mcpserver_ui.py
# Working directory
working_directory =
# Timeout in seconds
timeout = 30

[environment]
# Environment variables for runtime
PYCORE_SKIP_DEP_CHECK = 0
MCP_SERVER_PORT = 8767
MCP_SINGLETON_PORT = 19997
MCP_SERVER_DEBUG = true

[build_settings]
# Build configuration
build_platforms = windows
use_external_resources = false
optimize_images = false
use_external_safe_build = false

[resources]
# Resource files
icon_file = icon.png
# small_icon_file = notification_icon.png
